# Provisioned Prometheus datasource (ADR-0027 §3). The fixed uid is what the
# provisioned dashboard references.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
