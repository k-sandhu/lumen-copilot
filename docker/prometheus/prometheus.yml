# Prometheus for the `observability` compose profile (ADR-0027 §3, #817).
#
# The backend and every Celery worker child PUSH metrics over OTLP/HTTP to
# /api/v1/otlp/v1/metrics (enabled by --web.enable-otlp-receiver in compose),
# so there is no per-process scrape target and no prefork multiprocess mode.
# OTLP maps service.name -> `job` and service.instance.id -> `instance`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # Copy these resource attributes onto every series so dashboards can split
  # API vs worker (`lumen_process`) and environments.
  promote_resource_attributes:
    - deployment.environment.name
    - lumen.process
    - service.version

storage:
  tsdb:
    # Pushed batches from several processes can land slightly out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
