[project]
name = "lumen-sandbox-runner"
version = "0.2.0"
description = "Internal reusable-container runner for Lumen Copilot."
requires-python = "==3.12.*"
dependencies = [
  "docker==7.1.0",
  "fastapi==0.115.6",
  "packaging==24.2",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.4",
  "httpx==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen_sandbox_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]
