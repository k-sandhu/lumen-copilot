name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-tracking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.5"
      - name: Validate definitions and immutable ledger
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/qa_tracking.py validate
          if [ -n "$QA_BASE" ] && [ "$QA_BASE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/qa_tracking.py validate --base "$QA_BASE"
          fi
      - name: Tracking regression tests
        run: python -m unittest discover -s tests -p test_qa_tracking.py -v

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      RUN_LIVE: "0"
      UV_PYTHON: "3.12.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.5"
      - name: Configure uv cache
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - name: Install uv
        run: python -m pip install uv==0.11.18
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-${{ runner.os }}-3.12.5-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-3.12.5-
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --extra dev ruff check app tests
      - name: Check formatting
        run: uv run --extra dev ruff format --check app tests
      - name: Typecheck
        run: uv run --extra dev mypy app
      - name: Offline tests
        run: |
          mkdir -p ../output/qa
          date -u +%Y-%m-%dT%H:%M:%SZ > ../output/qa/backend.started
          uv run --extra dev pytest -n 2 --dist loadfile -p no:cacheprovider --basetemp "${{ runner.temp }}/pytest-${{ github.run_id }}-${{ github.run_attempt }}" --junitxml=../output/qa/backend.xml
      - name: Record backend suite provenance
        if: always()
        working-directory: .
        run: python scripts/qa_tracking.py suite --suite backend --junit output/qa/backend.xml --started-at-file output/qa/backend.started --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}-backend --output output/qa/backend-run.json
      - name: Retain backend QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-backend-${{ github.sha }}-${{ github.run_attempt }}
          path: output/qa/
          retention-days: 90
          if-no-files-found: error
      - name: Trim uv cache
        if: always()
        run: uv cache prune --ci

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install --global pnpm@9.12.3
      - name: Find pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: |
          mkdir -p ../output/qa
          date -u +%Y-%m-%dT%H:%M:%SZ > ../output/qa/frontend.started
          pnpm exec vitest run --reporter=default --reporter=junit --outputFile=../output/qa/frontend.xml
      - name: Build
        run: pnpm build
      - name: Record frontend suite provenance
        if: always()
        working-directory: .
        run: python3 scripts/qa_tracking.py suite --suite frontend --junit output/qa/frontend.xml --started-at-file output/qa/frontend.started --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}-frontend --output output/qa/frontend-run.json
      - name: Retain frontend QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: output/qa/
          retention-days: 90
          if-no-files-found: error
