# Included at HTTP scope in the image. Request/error context may contain OAuth
# codes/state, WS credentials, or sensitive referrers, even before server selection.
# Suppress both loggers for every path, including upstream and malformed requests.
access_log off;
error_log /dev/null;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /_frontend_health {
        default_type text/plain;
        return 200 'ok\n';
    }

    # Docker's DNS resolver follows a backend replacement without a stale
    # startup-time upstream IP. Preserve the complete original request URI.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lumen_backend http://backend:8000;

    # Reserved backend paths must never fall through to the SPA's HTML.
    location ~ ^/(api|ws|health)(/|$) {
        proxy_pass $lumen_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
