# Alembic configuration (ADR-0003: SQLAlchemy 2.0 async + Alembic as the only
# path to schema change). The sqlalchemy.url is intentionally NOT set here —
# alembic/env.py reads it from app.core.config (the single env reader) so there
# is no second source of the database URL and no secret in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use a UTC, sortable filename prefix for migration revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
