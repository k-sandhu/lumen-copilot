[project]
name = "lumen-copilot-backend"
version = "0.0.1"
description = "Lumen Copilot backend — FastAPI service (grounded, permissioned, cited, auditable chat)."
readme = "README.md"
requires-python = "==3.12.*"

# Runtime dependencies. Pinned (no unpinned / no :latest) per AGENTS.md §3 / ADR-0003 §10.
dependencies = [
    "fastapi==0.115.6",
    # Multipart parsing remains for small tenant-branding/avatar forms only;
    # uploaded document/media bytes use the v2 browser-to-storage data plane.
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "celery==5.4.0",
    # Dynamic, per-tenant Beat scheduler (ADR-0015 §1, #236): schedule entries live
    # in the EXISTING Redis broker and are added/changed/removed at runtime — the
    # user-created cadences a static ``beat_schedule`` cannot express. No new infra
    # (rides the Redis we already run). Imported only by ``app/tasks/scheduler.py``
    # — the single module that owns the Beat wiring (ADR-0004: ``tasks/`` owns jobs).
    "celery-redbeat==2.3.3",
    "litellm==1.55.9",
    "httpx==0.27.2",  # pinned <0.28 to satisfy litellm 1.55.9 (httpx>=0.23,<0.28)
    "structlog==24.4.0",
    "aioboto3==13.2.0",
    "pgvector==0.4.2",  # SQLAlchemy `vector` column type for chunk embeddings (#44)
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    # Envelope encryption for the per-tenant secrets vault (#209): AES-256-GCM
    # (an authenticated cipher) via the maintained OSS `cryptography` lib. Imported
    # only by app/core/crypto.py — the single module that owns the cipher (ADR-0004
    # chokepoint); nothing else touches it.
    "cryptography==44.0.0",
    "packaging==24.2",  # PEP-508 parsing/canonicalisation for governed sandbox packages (#457)
    # Ingestion parsers (CC-5 #21), pinned. Each is imported lazily inside its
    # helper in app/ingestion/parsers.py so the dependency stays localized.
    "pypdf==5.1.0",  # PDF text extraction
    "python-docx==1.1.2",  # DOCX paragraph text
    "python-pptx==1.0.2",  # PPTX text frames
    "openpyxl==3.1.5",  # XLSX cell values
    # Official MCP (Model Context Protocol) Python SDK — the remote MCP client
    # (Streamable HTTP + SSE transports, capability negotiation, JSON-RPC framing).
    # ADR-0012 §2 adopts the maintained reference implementation for protocol
    # correctness/forward-compat, as a documented exception to ADR-0004's
    # SDK-avoidance preference. Imported ONLY by app/mcp/ — the single owning
    # module (ADR-0004 boundary row); an architecture test asserts no other module
    # imports it. Its transports are injected with an SSRF-guarded httpx client so
    # every outbound hop passes the connectors/web/fetch.py egress discipline.
    "mcp==1.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "aiosqlite==0.21.0",  # async SQLite for offline repository unit tests (#44)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling config (ADR-0003 §10): ruff (lint+format), mypy --strict, pytest.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# Sensible, strict-leaning default set. Tighten as the stack matures.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async (catch blocking calls in async code)
    "C4",  # comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Third-party libs without bundled stubs — don't fail strict on their internals.
[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "aioboto3.*",
    "celery.*",
    "kombu.*",
    "redbeat.*",
    "botocore.*",
    "pgvector.*",
    "pypdf.*",
    "docx.*",
    "pptx.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
# Registered markers (use --strict-markers-friendly names; unregistered markers
# would warn -> error under `filterwarnings`). `live` gates tests that open a
# REAL outbound socket to a provider/datastore; they are SKIPPED by default and
# only run when explicitly opted in (e.g. RUN_LIVE=1 plus the needed
# credentials/reachability). The default offline `uv run pytest` opens no
# external sockets (issue #94).
markers = [
    "live: opens a real network socket to an external provider/datastore; skipped by default, opt in with RUN_LIVE=1 (+ the needed key/reachability).",
]
# Surface our own warnings as errors, but don't fail on third-party deprecation
# noise (FastAPI/Starlette/pydantic/celery). Tighten per-module as needed.
# The `error` rule is what turns a leaked unclosed socket into a hard,
# order-dependent failure — the live tests above are skipped by default and
# close LiteLLM's clients in teardown so nothing leaks even when they run (#94).
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
