[project]
name = "lumen-copilot-backend"
version = "0.0.1"
description = "Lumen Copilot backend — FastAPI service (grounded, permissioned, cited, auditable chat)."
readme = "README.md"
requires-python = "==3.12.*"

# Runtime dependencies. Pinned (no unpinned / no :latest) per AGENTS.md §3 / ADR-0003 §10.
dependencies = [
    "fastapi==0.115.6",
    "python-multipart==0.0.20",  # multipart/form-data parsing for document upload (#28)
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "celery==5.4.0",
    "litellm==1.55.9",
    "httpx==0.27.2",  # pinned <0.28 to satisfy litellm 1.55.9 (httpx>=0.23,<0.28)
    "structlog==24.4.0",
    "aioboto3==13.2.0",
    "pgvector==0.4.2",  # SQLAlchemy `vector` column type for chunk embeddings (#44)
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "aiosqlite==0.21.0",  # async SQLite for offline repository unit tests (#44)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling config (ADR-0003 §10): ruff (lint+format), mypy --strict, pytest.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# Sensible, strict-leaning default set. Tighten as the stack matures.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async (catch blocking calls in async code)
    "C4",  # comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Third-party libs without bundled stubs — don't fail strict on their internals.
[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "aioboto3.*",
    "celery.*",
    "botocore.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
# Surface our own warnings as errors, but don't fail on third-party deprecation
# noise (FastAPI/Starlette/pydantic/celery). Tighten per-module as needed.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
