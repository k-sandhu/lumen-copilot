# Lumen Copilot — one-command local stack (ADR-0005).
#   cp .env.example .env  &&  docker compose up --build
# Brings up: Postgres+pgvector, Redis, MinIO, backend (web), Celery worker, frontend.
# Host ports come from .env (471xx block); container-to-container traffic uses service names.
# Images are version-pinned (no :latest) per AGENTS.md.

name: lumen-copilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-47182}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-47183}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-47184}:9000"
      - "${MINIO_CONSOLE_PORT:-47185}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    # The single retrieval store (ADR-0010): BM25 lexical + kNN vectors in one
    # engine, part of the BASE stack (sponsor decision — not an opt-in profile).
    # Single-node local config: security plugin disabled (HTTP, no TLS/auth —
    # local dev only), bounded JVM heap so the stack stays laptop-sized.
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-47186}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      # yellow is healthy for a single node before replicas-0 indices exist.
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  searxng:
    # Self-hosted metasearch backing the `web_search` agent tool (ADR-0014, #219):
    # OSS (AGPL-3.0), no per-query API key, no tenant queries egressing to a
    # commercial vendor. JSON output is enabled via the mounted settings so the
    # `search_web/` adapter reads structured results (not scraped HTML). The
    # `web_search` tool is OFF by default (WEB_SEARCH_ENABLED=false), so this
    # service is present but only exercised once a deploy/tenant enables web mode.
    # Pinned image (no :latest), healthcheck, reachable on the internal compose
    # network + the mapped host port for dev/tests.
    image: searxng/searxng:2026.7.2-67973783d
    restart: unless-stopped
    environment:
      # The public base URL SearXNG advertises (internal to the compose network).
      SEARXNG_BASE_URL: http://searxng:8080/
      # Real secret for a deployment comes from the host env; the mounted
      # settings.yml carries only a local-dev placeholder (never a real secret).
      SEARXNG_SECRET: ${SEARXNG_SECRET:-lumen-local-dev-searxng-not-a-secret}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "${WEB_SEARCH_PORT:-47187}:8080"
    healthcheck:
      # The JSON search endpoint is the contract the adapter uses; a 200 on a
      # trivial query means the engine is answering in the format we need.
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://localhost:8080/search?q=ping&format=json' >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Always prefer the host's OPENROUTER_API_KEY (so an exported/User env var
      # configures the LLM gateway without editing .env). `environment` wins over
      # `env_file`, and ${...} interpolates from the host shell then .env, so a
      # blank value in .env never shadows a real host key. .env stays the fallback.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Presigned URLs must be reachable from the BROWSER, not just the compose
      # network (#241): sign them against MinIO's published host port. Deployments
      # with a real public object-store URL override this via .env / host env.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:47184}
      # Serve document /content by STREAMING it inline through the API (same
      # origin) rather than 302-ing to a presigned MinIO URL (#242). The viewer
      # fetches the bytes and renders them; an inline same-origin response needs
      # no CORS, whereas a browser fetch that follows the 302 to MinIO would be a
      # cross-origin read MinIO does not expose by default → the preview fails.
      # Deployments that put object storage behind a CORS-enabled endpoint or a
      # CDN can flip this to "true" to serve bytes straight from storage.
      DOCUMENT_CONTENT_REDIRECT: ${DOCUMENT_CONTENT_REDIRECT:-false}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-47181}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # The single retrieval store (ADR-0010) is a base-stack boot dependency.
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Dedicated sandbox runner (ADR-0013 §1, #230, risk:security): the ONLY component
  # with container-engine / Docker-socket access. It owns ALL per-run container
  # lifecycle — launching one ephemeral, single-use, network-none, read-only-rootfs,
  # caps-dropped, non-root, cpu/mem/pids/timeout-bounded container per run — and
  # exposes a small internal HTTP API (POST /runs, GET /runs/{id}, POST /runs/{id}/cancel)
  # on the compose network ONLY (NO published host port — never reachable from the
  # host/browser, only from the worker). Keeping the socket out of the app/worker
  # (mounting it there is equivalent to host root) and confining it to this one small,
  # audited service is the core of the design.
  #
  # OFF by default (ADR-0013 §6): with SANDBOX_ENABLED=false the worker refuses every
  # run before ever calling this service, so it sits idle. Pinned image (no :latest);
  # bounded resources so the extra service stays laptop-viable. The runner's own
  # service image is provisioned per-deploy (its build/impl is a follow-up seam); this
  # is the topology the ADR specifies. gVisor (SANDBOX_RUNTIME=runsc) is a runner
  # config swap for production hardening — no app code change.
  sandbox-runner:
    image: ghcr.io/k-sandhu/lumen-sandbox-runner:0.1.0
    restart: unless-stopped
    # The single Docker-socket holder. Read-only mount limits it to the container API
    # it needs (the app/worker NEVER mount this).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # The pinned per-run base image (curated Python + scientific stack, pinned by
      # @sha256 digest, no :latest — ADR-0013 §3) and the OCI runtime.
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/k-sandhu/lumen-sandbox-py:0.1.0}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
    # NO `ports:` — the internal API is reachable only on the compose network, never
    # published to the host (ADR-0013 §1).
    expose:
      - "8000"
    # Bounded so the runner itself stays laptop-sized; per-run containers carry their
    # own cpu/mem/pids caps (enforced by the runner from the worker's run spec).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    environment:
      # Mirror the backend: the host OPENROUTER_API_KEY always wins, .env is the
      # fallback (the worker embeds/queries through the same LLM gateway).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # The dedicated runner's internal API (compose network only). The worker calls
      # this to execute a sandbox code run — it holds NO Docker socket itself.
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8000}
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # The worker indexes into the retrieval store (ADR-0010) during ingestion.
      opensearch:
        condition: service_healthy
      # Wait for the web service (which runs `alembic upgrade head` on boot) so the
      # worker's identical entrypoint migration is a no-op — never a concurrent upgrade.
      backend:
        condition: service_healthy

  # Dynamic per-tenant Beat scheduler (ADR-0015 §7, #236): reads the `schedules`
  # table (Postgres authoritative) and fires `lumen.fire_schedule` at each schedule's
  # cadence via celery-redbeat, whose live entries ride the EXISTING Redis broker (no
  # new infra). Reuses the worker image; a thin add — it holds no state of its own.
  # A single beat process is correct (RedBeat holds a Redis leader lock).
  beat:
    build:
      context: ./backend
    restart: unless-stopped
    command:
      - "celery"
      - "-A"
      - "app.tasks.celery_app"
      - "beat"
      - "--scheduler"
      - "redbeat.RedBeatScheduler"
      - "--loglevel=info"
    environment:
      # Mirror the worker/backend: the host OPENROUTER_API_KEY always wins, .env is
      # the fallback (Beat itself makes no model call, but shares the image/env).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Beat reconciles its RedBeat entries from Postgres on boot, so wait for the web
      # service to have run `alembic upgrade head` (the `schedules` table must exist).
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-47180}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  osdata:
  frontend_node_modules:
