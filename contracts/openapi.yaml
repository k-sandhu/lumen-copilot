openapi: 3.1.0
info:
  title: Lumen Copilot API
  version: 0.7.0
  description: >
    Source-of-truth contract for the Lumen Copilot REST surface. The backend
    implements to match this; the frontend client is generated from it.


    Revision 0.1.0 froze the **grounded-chat MVP wire** (issue #37,
    ADR-0006 Phase 0): auth, collections, documents, chat, and the model
    picker. Streaming assistant answers ride the WebSocket envelope
    (`websocket-envelopes.schema.json`); request/response stays REST (ADR-0003).


    This revision (0.2.0) **additively** freezes the **M2 Trust-Surfaces wire**
    (issue #80, ADR-0006 Phase 0 / ADR-0008 wave 0): `GET /search`
    (permission-trimmed, cited grounded search), `GET /audit` (the append-only
    audit trail with provenance), and the read-only `/admin/*` governance
    surfaces (members, model governance, risk tiers). These are the frozen
    hand-off artifact that gates the parallel M2 build slices; no shape from
    0.1.0 changed. All three are REST request/response — no new WebSocket
    envelope shapes were required.


    This revision (0.3.0) **additively** freezes the **Sources wire** (issue
    #108, ADR-0009 §5, ADR-0006 Phase 0): `GET /sources` (the connector grid),
    `POST /sources` (add a source — the first connector is a Web URL; an invalid
    or SSRF-blocked URL is a **422**, ADR-0009 §3), `POST /sources/{id}/sync`
    (re-sync), and `DELETE /sources/{id}` (remove, cascading the source's
    documents). Sources are tenant- and owner-scoped (INV-1/INV-2). No shape from
    0.1.0 or 0.2.0 changed; these are REST request/response only.


    This revision (0.4.0) **additively** freezes the **preferences, saved-searches
    & search-suggestions wire** (spec 0005, epic #144, ADR-0006 Phase 0):
    `GET`/`PATCH /preferences` (the caller's account preferences — a default chat
    model validated against `/models`), `GET`/`POST`/`GET`/`PATCH`/`DELETE
    /saved-searches` (save a query + filters and re-run it), `GET /search/suggest`
    (permission-trimmed typeahead through the `retrieval/` chokepoint), and
    `GET`/`DELETE /search/recent` (recent-query history; `/search` records the
    executed query). All per-user and tenant-scoped (INV-1/INV-2). No shape from
    0.1.0–0.3.0 changed; REST request/response only.


    This revision (0.5.0) **additively** adds the **admin per-tenant settings
    wire** (issue #148): `GET /admin/settings` (the tenant's effective chat
    tool-turn budget) and `PATCH /admin/settings` (set or clear the per-tenant
    override). The PATCH is the first `/admin` **write** — a reversible,
    tenant-scoped **T1** action (spec 0004 §2.5): `admin`-only (**403** otherwise,
    INV-5), audited, with an out-of-range value rejected as **422** (INV-8). No
    shape from 0.1.0–0.4.0 changed; REST request/response only.


    **Tenancy & permission (spec 0004).** Every resource below is implicitly
    scoped to the authenticated user's tenant and ownership. A request for a
    resource in another tenant — or one the caller is not permitted to see —
    returns **404** (existence non-disclosure, INV-1/INV-2), never 403. Clients
    never send `tenant_id`; it is resolved from the bearer token in
    `backend/app/auth/`. All endpoints except `getHealth`, `getReadiness`,
    `login`, and `refresh` require the bearer token.
servers:
  - url: http://localhost:47181
    description: Local compose (default host port; see ADR-0005 / .env.example)
  - url: /
    description: Same-origin (behind a reverse proxy / in dev via Vite proxy)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness — the process is up.
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness — the process and its dependencies are reachable.
      tags: [health]
      security: []
      responses:
        "200":
          description: Service and all dependencies are ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
        "503":
          description: One or more dependencies are not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }

  # --- Auth (CC-3 / spec 0004 §2.3) -----------------------------------------
  /auth/login:
    post:
      operationId: login
      summary: Exchange email + password for an access token.
      description: >
        App-managed identity (spec 0004): returns a short-lived access token and
        sets a rotating, httpOnly refresh cookie. Invalid credentials → 401 with
        a generic message (no account-existence disclosure).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/refresh:
    post:
      operationId: refresh
      summary: Mint a new access token from the refresh cookie.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token / clear the session.
      tags: [auth]
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The authenticated principal (id, tenant, roles).
      tags: [auth]
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Collections / folders -------------------------------------------------
  /collections:
    get:
      operationId: listCollections
      summary: List the caller's collections.
      tags: [collections]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of collections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCollection
      summary: Create a collection.
      tags: [collections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /collections/{collectionId}:
    parameters:
      - { $ref: "#/components/parameters/CollectionId" }
    get:
      operationId: getCollection
      summary: Get a collection by id.
      tags: [collections]
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCollection
      summary: Rename / re-describe a collection.
      tags: [collections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteCollection
      summary: Delete a collection and its documents.
      tags: [collections]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Documents (upload + multi-format ingestion: #28 / #21) ----------------
  /documents:
    get:
      operationId: listDocuments
      summary: List documents, optionally filtered by collection / status / text.
      tags: [documents]
      parameters:
        - name: collection_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict to one collection.
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Filter by filename substring (lexical, not semantic).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: uploadDocument
      summary: Upload a document into a collection (multi-format).
      description: >
        Stores the file (MinIO sandbox, CC-12) and creates a `Document` with
        status `pending`; ingestion (parse → chunk → embed) runs async (#21).
        Allowed content-types and the size cap are enforced server-side
        (`UPLOAD_ALLOWED_CONTENT_TYPES`, `MAX_UPLOAD_BYTES`).
      tags: [documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collection_id]
              properties:
                file:
                  type: string
                  format: binary
                collection_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Accepted for ingestion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /documents/{documentId}:
    parameters:
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      operationId: getDocument
      summary: Get document metadata (incl. ingestion status).
      tags: [documents]
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDocument
      summary: Delete a document and its chunks/embeddings.
      tags: [documents]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/content:
    parameters:
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      operationId: getDocumentContent
      summary: Download / view the original file bytes.
      description: >
        Returns the stored bytes for viewing in the UI. The server may instead
        respond 302 to a short-TTL presigned URL (CC-12); clients must follow it.
      tags: [documents]
      responses:
        "200":
          description: The raw document bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a short-TTL presigned URL.
          headers:
            Location:
              required: true
              description: Short-TTL presigned URL for the object.
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/text:
    parameters:
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      operationId: getDocumentText
      summary: Get the extracted plain text of a ready document.
      description: >
        The ingestion parser's plain-text output for the document, reassembled
        from its stored chunks (issue #244). This is the viewer's text surface
        for formats a browser cannot render natively (DOCX/PPTX/XLSX) and the
        universal "show me the text" affordance. Visibility is identical to
        `/documents/{documentId}/content` (INV-2: not visible → 404, never 403).
        A document that exists but is not `ready` has no text yet → 409
        (`code=document_not_ready`).
      tags: [documents]
      responses:
        "200":
          description: The extracted text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentText" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # --- Artifacts (agent/run-produced files) : CC-B #208 / panel #222 ---------
  /artifacts:
    get:
      operationId: listArtifacts
      summary: List artifacts an agent/run produced, optionally filtered.
      description: >
        The caller's own produced artifacts (files the `write_file` tool #220 or
        the code sandbox #230/#231 emitted), distinct from uploaded `documents`.
        Cursor-paginated, newest first, tenant- and owner-scoped (spec 0004
        INV-1/INV-2). Optional filters narrow the page by producing session
        (`session_id`) or write origin (`produced_by`).
      tags: [artifacts]
      parameters:
        - name: session_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict to artifacts produced in one chat session.
        - name: produced_by
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ArtifactProducedBy" }
          description: Restrict to one write origin (chat_session / run / tool).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of artifacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /artifacts/{artifactId}:
    parameters:
      - { $ref: "#/components/parameters/ArtifactId" }
    get:
      operationId: getArtifact
      summary: Get artifact metadata.
      description: >
        One of the caller's produced artifacts. Tenant- and owner-scoped: an
        artifact in another tenant, or owned by another user, returns **404**
        (existence non-disclosure, INV-1/INV-2), never 403. A malformed (non-uuid)
        id is **422**.
      tags: [artifacts]
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteArtifact
      summary: Delete an artifact (row + stored object).
      description: >
        Removes the stored object and the artifact row. Visibility is established
        before any write, so another tenant's / owner's artifact is reported as
        **404** and left untouched (INV-1/INV-2). Audited `artifact.deleted`.
      tags: [artifacts]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /artifacts/{artifactId}/content:
    parameters:
      - { $ref: "#/components/parameters/ArtifactId" }
    get:
      operationId: getArtifactContent
      summary: Download / view the artifact's bytes.
      description: >
        Returns the stored bytes for download or inline preview. Like
        `/documents/{documentId}/content`, the server may instead respond **302**
        to a short-TTL presigned URL (CC-12); clients must follow it. Visibility
        is identical to `GET /artifacts/{artifactId}` (not visible → 404, never
        403). Audited `artifact.downloaded`.
      tags: [artifacts]
      responses:
        "200":
          description: The raw artifact bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a short-TTL presigned URL.
          headers:
            Location:
              required: true
              description: Short-TTL presigned URL for the object.
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Chat (sessions, history, send → stream) : CC-6 #24 --------------------
  /chat/sessions:
    get:
      operationId: listChatSessions
      summary: List the caller's chat sessions (history).
      tags: [chat]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of chat sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createChatSession
      summary: Start a new chat session.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSessionCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /chat/sessions/{sessionId}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getChatSession
      summary: Get a chat session.
      tags: [chat]
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateChatSession
      summary: Rename a session or change its default model.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSessionUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteChatSession
      summary: Delete a chat session and its messages.
      tags: [chat]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/sessions/{sessionId}/sandbox:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getSandboxSession
      summary: Inspect the reusable Python sandbox attached to this chat.
      description: >
        Returns the caller's chat-scoped sandbox state (ADR-0020). Before the first
        run the state is `not_created`. Tenant/owner isolation follows the parent
        chat: a foreign chat id is 404. Root access is contained inside the offline
        sandbox and grants no host, engine-socket, application-secret, or network
        authority.
      tags: [chat]
      responses:
        "200":
          description: The current sandbox state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: closeSandboxSession
      summary: Close and destroy this chat's reusable Python sandbox.
      description: >
        Idempotently destroys the current container and marks the durable sandbox
        session closed. A later run creates a fresh generation.
      tags: [chat]
      responses:
        "204": { description: Closed (or no sandbox had been created). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Problem" }

  /chat/sessions/{sessionId}/sandbox/reset:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    post:
      operationId: resetSandboxSession
      summary: Destroy this chat's Python sandbox and start a clean generation.
      description: >
        Removes all persisted files, processes, and installed packages from the
        previous generation, then ensures an empty root-capable offline container.
      tags: [chat]
      responses:
        "200":
          description: The new active generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Problem" }

  /chat/sessions/{sessionId}/usage:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getChatSessionUsage
      summary: Token/context accounting for a session (spec 0007 #429).
      description: >
        Powers the conversation context meter: summed per-answer llm_usage
        (#409), the most recent answer's record, and the input-token budget the
        context assembler grants the session's model (window − output headroom −
        safety margin — the same formula answers are assembled under). A session
        with no answers yet returns all-zero totals and no `last`.
      tags: [chat]
      responses:
        "200":
          description: The session's usage accounting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/sessions/{sessionId}/messages:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: listMessages
      summary: Message history for a session (oldest → newest).
      tags: [chat]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: sendMessage
      summary: Send a user message; the assistant answer streams over WebSocket.
      description: >
        Persists the user message and returns a `stream_id`. The client then
        consumes the answer over the WebSocket envelope stream with that id
        (`start` → `delta`(token)* / `event`(citation|tool_call|tool_result)* →
        `done|error`; see websocket-envelopes.schema.json). The finished
        assistant message — with citations — is also retrievable via
        `listMessages`. `model` overrides the session default for this turn;
        `collection_ids` scopes retrieval (default: all the caller's documents).
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "202":
          description: Accepted; consume the answer on the WS stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Model picker ----------------------------------------------------------
  /models:
    get:
      operationId: listModels
      summary: The selectable chat models (picker registry).
      description: >
        The curated set the UI offers, grouped by tier (frontier / fast / oss).
        Exactly one has `is_default: true`. Backed by config — adding a model is
        a config change, not a contract change.
      tags: [models]
      responses:
        "200":
          description: Available chat models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Search (M2: grounded, permission-trimmed, cited) : #80 ----------------
  /search:
    get:
      operationId: search
      summary: Permission-trimmed ranked search, with an optional cited answer.
      description: >
        Runs the query through the `retrieval/` chokepoint (spec 0004 §2.2): the
        ranked results contain ONLY passages in the caller's effective allow-set
        (INV-2) within their tenant (INV-1). Passages the caller may not see are
        never returned; they are counted in `hidden_count` so the UI can disclose
        "N results hidden by your permissions" without leaking their content.


        When the query is answerable from the permitted results the response MAY
        include a `direct_answer` — a short synthesized answer whose every claim
        is backed by `citations[]` that reference passages present in `results`
        (INV-3, citation integrity). When nothing answers it, `direct_answer` is
        omitted (prefer "no answer" over an unsourced claim, mission filter #2).
      tags: [search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: The search query (lexical + semantic; ranked).
        - name: collection_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict to one collection.
        - name: source
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ResultSource" }
          description: Restrict to results from one source kind.
        - name: type
          in: query
          required: false
          schema: { type: string }
          description: Restrict to one content type (e.g. document, message).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of permission-trimmed ranked results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Audit trail (M2: provenance-rich, admin/security only) : #80 ----------
  /audit:
    get:
      operationId: listAuditEvents
      summary: The append-only audit trail (admin / security only).
      description: >
        Reads the one append-only audit sink (spec 0004 §2.4). Restricted to the
        `admin` and `security` roles; any other role (incl. `member`) receives
        **403** (INV-5). Events are tenant-scoped — a caller only ever sees their
        own tenant's events (INV-1). Each event carries `provenance` so a reviewer
        can see WHY a retrieval/answer decision was made, including the candidate
        passages that were allowed vs. excluded and the reason for each.


        Default ordering is newest → oldest; `from`/`to` bound the time window.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
          description: Filter to one actor (user id, or `system`/`anonymous`).
        - name: event_type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AuditEventType" }
          description: Filter to one event type.
        - name: resource_id
          in: query
          required: false
          schema: { type: string }
          description: Filter to events touching one resource.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive lower bound on event timestamp (UTC ISO-8601).
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Exclusive upper bound on event timestamp (UTC ISO-8601).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of audit events (newest → oldest).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Admin (M2 governance reads #80 + per-tenant settings write #148, admin only) ---
  /admin/members:
    get:
      operationId: listMembers
      summary: The tenant's members and their roles (admin only).
      description: >
        Read-only roster for the admin console. Restricted to the `admin` role;
        any other role receives **403** (INV-5). Tenant-scoped (INV-1): only the
        caller's own tenant's members are returned.
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/members/{memberId}/attest-identity:
    parameters:
      - { $ref: "#/components/parameters/MemberId" }
    post:
      operationId: attestMemberIdentity
      summary: Attest a member's email identity for connector-ACL mapping (admin only).
      description: >
        Records the tenant admin's attestation that this member's email is the
        person it names (ADR-0019 §2). Connector ACL mirroring maps a source
        permission to a Lumen user **only** when that user's email is attested —
        unattested members never receive mirrored access. Restricted to the
        `admin` role (403 otherwise, INV-5); a cross-tenant or unknown member is
        **404** (INV-1). Idempotent: re-attesting refreshes `email_attested_at`.
        Audited as `user.identity_attested` (INV-6). Any future email-mutation
        path must clear the attestation in the same write (ADR-0019 §2).
      tags: [admin]
      responses:
        "200":
          description: The member with their new attestation state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/groups:
    get:
      operationId: listGroups
      summary: The tenant's groups (admin only).
      description: >
        Groups are the sharing primitive behind `group` grants (ADR-0022): a
        grant to a group admits every member. Restricted to the `admin` role;
        any other role receives **403** (INV-5). Tenant-scoped (INV-1). The
        tenant's derived "All members" group is listed first and is read-only.
      tags: [admin]
      responses:
        "200":
          description: Every group in the tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createGroup
      summary: Create a group (admin only).
      description: >
        Creates an empty group an admin can then populate. Names are trimmed and
        unique per tenant **case-insensitively** - a duplicate is **409**, a
        blank or over-long name is **422**. Audited as `group.created` (INV-6).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: The created group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/groups/{groupId}:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      operationId: getGroup
      summary: One group (admin only).
      description: >
        A group in another tenant is **404**, never 403 (existence
        non-disclosure, INV-1).
      tags: [admin]
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      operationId: renameGroup
      summary: Rename a group (admin only).
      description: >
        Renaming the derived "All members" group is refused **409**
        (`system_group_immutable`) - its membership is derived, so it is not an
        editable group (ADR-0022 section 3). Audited as `group.updated` (INV-6).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdate" }
      responses:
        "200":
          description: The renamed group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteGroup
      summary: Delete a group (admin only).
      description: >
        Deletes the group, its membership, **and every grant naming it** - so
        anything shared with the group stops being shared. `grants` carries no
        foreign key on `principal_id` (spec 0004 section 2.2), so this cleanup is
        explicit rather than a database cascade. Deleting the derived "All
        members" group is refused **409**. Audited as `group.deleted` (INV-6).
      tags: [admin]
      responses:
        "204": { description: Deleted (group + its membership + every grant naming it). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/groups/{groupId}/members:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
    get:
      operationId: listGroupMembers
      summary: The users explicitly in a group (admin only).
      description: >
        Returns the group's members ordered by email. The derived "All members"
        group returns an **empty list**: its membership is not enumerated
        because every user in the tenant belongs to it (ADR-0022 section 3) -
        read `member_count: null` on the group to tell "everyone" from "empty".
      tags: [admin]
      responses:
        "200":
          description: The group's members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: addGroupMember
      summary: Add a user to a group (admin only).
      description: >
        Idempotent - adding an existing member succeeds and changes nothing. A
        user in another tenant is **404**, never 403 (INV-1). Populating the
        derived "All members" group is refused **409**. Audited as
        `group.member_added` (INV-6). The new member's access widens on their
        **next request**: membership is re-read per request and never cached in
        a token (ADR-0022 section 7).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMemberAdd" }
      responses:
        "204": { description: The user is a member of the group. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/groups/{groupId}/members/{memberId}:
    parameters:
      - { $ref: "#/components/parameters/GroupId" }
      - { $ref: "#/components/parameters/MemberId" }
    delete:
      operationId: removeGroupMember
      summary: Remove a user from a group (admin only).
      description: >
        Idempotent - removing a non-member succeeds and changes nothing.
        Revocation takes effect on that user's **next request** (ADR-0022
        section 7), never at token expiry. Audited as `group.member_removed`
        (INV-6).
      tags: [admin]
      responses:
        "204": { description: The user is not a member of the group. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/model-governance:
    get:
      operationId: getModelGovernance
      summary: Which models are allowed, by governance tier (admin only).
      description: >
        Read-only view of model governance for the admin console: the set of
        models permitted for this tenant and the governance tiers they map to.
        Restricted to the `admin` role; otherwise **403** (INV-5).
      tags: [admin]
      responses:
        "200":
          description: Model governance configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelGovernance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/risk-tiers:
    get:
      operationId: getRiskTiers
      summary: The read-before-write risk tiers T0–T3 (admin only).
      description: >
        Read-only reference of the action risk tiers (spec 0004 §2.5): T0
        (read-only) through T3 (destructive/irreversible external), each with its
        description and the approval it requires. Restricted to the `admin` role;
        otherwise **403** (INV-5).
      tags: [admin]
      responses:
        "200":
          description: The risk-tier reference (T0–T3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskTierList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/settings:
    get:
      operationId: getTenantSettings
      summary: The tenant's admin-configurable settings (admin only).
      description: >
        The caller's tenant's effective chat tool-turn budget (issue #148): the
        per-tenant override if set, else the system default, plus whether the
        default is in force. Restricted to the `admin` role; otherwise **403**
        (INV-5). Tenant-scoped (INV-1).
      tags: [admin]
      responses:
        "200":
          description: The tenant's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateTenantSettings
      summary: Set or clear the tenant's chat tool-turn budget (admin only).
      description: >
        Set the per-tenant chat tool-turn budget override, or clear it (`null`) to
        fall back to the system default (issue #148). The first `/admin` **write**
        — a reversible, tenant-scoped **T1** action (spec 0004 §2.5): `admin`-only
        (**403** otherwise, INV-5), audited (INV-6). An out-of-range value (outside
        1–50) or a missing field is **422** (INV-8). Returns the resulting
        effective settings.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettingsUpdate" }
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/branding:
    put:
      operationId: updateTenantBranding
      summary: Upload the tenant's application logo (admin only).
      description: >
        Set the per-tenant application logo shown in the app shell for every user
        of the tenant (admin branding). Stores the image (MinIO) and persists its
        key on the tenant row; the shell reads the resulting presigned URL from
        `GET /auth/me` (`logo_url`). A reversible, tenant-scoped **T1** action (spec
        0004 §2.5 — "authorized owner; audited; no extra approval"): `admin`-only
        (**403** otherwise, INV-5), audited as `tenant.branding_updated` (INV-6).
        Allowed content-types are `image/png`, `image/jpeg`, `image/svg+xml` and the
        size cap is `MAX_LOGO_BYTES` (default 1 MiB), enforced server-side: an
        over-size logo is **413**, a non-image content-type **415**, and a
        missing/blank filename **422** (INV-8). Returns the new logo URL.
      tags: [admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The tenant's logo URL after upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantBranding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: clearTenantBranding
      summary: Clear the tenant's application logo (admin only).
      description: >
        Revert the app shell to the default brand mark for every user of the tenant
        (the reverse of `PUT /admin/branding`): sets the tenant's logo key to null.
        A reversible, tenant-scoped **T1** action: `admin`-only (**403** otherwise,
        INV-5), audited as `tenant.branding_updated` (INV-6). Idempotent — clearing
        an already-unset logo succeeds with **204**.
      tags: [admin]
      responses:
        "204": { description: The logo was cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/tool-policy:
    get:
      operationId: getToolPolicy
      summary: The per-tenant tool-governance policy (admin only).
      description: >
        The caller's tenant's tool-governance policy (issue #223): for **every**
        registered tool, its static `risk_tier` (for display) plus the effective
        per-tenant flags `enabled` and `requires_approval`. Absence of an admin
        override falls back to the tool's built-in default, so a `requires_approval`
        tool (e.g. `run_python`) is **denied by default** until an admin enables and
        pre-approves it. Restricted to the `admin` role; any other role receives
        **403** (INV-5). Tenant-scoped (INV-1): the policy is the caller's own
        tenant's.
      tags: [admin]
      responses:
        "200":
          description: The per-tenant tool-governance policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateToolPolicy
      summary: Set the per-tenant flags for one tool (admin only).
      description: >
        Set the per-tenant `enabled` / `requires_approval` flags for one registered
        tool (issue #223). A tenant-scoped **T1** governance write (spec 0004 §2.5 —
        "authorized owner; audited; no extra approval"): `admin`-only (**403**
        otherwise, INV-5), audited as `tool_policy.updated` (INV-6). Turning a
        `requires_approval` tool's `requires_approval` to `false` while `enabled` is
        `true` is the admin **pre-approval** that lets the policy-driven approval
        gate execute it (the `run_python` unlock). An unknown `tool_name` (not in the
        registry) is **422** (INV-8). Returns the full resulting policy.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolPolicyUpdate" }
      responses:
        "200":
          description: The updated per-tenant tool-governance policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/sandbox-policy:
    get:
      operationId: getSandboxPolicy
      summary: The per-tenant code-execution sandbox policy (admin only).
      description: >
        The caller's tenant's sandbox policy: whether code execution is `enabled` and
        the enforced package allow/deny lists. ADR-0020 reusable sessions are always
        offline and currently apply no automatic runtime/resource/quota ceilings. The
        egress and cap fields remain compatibility-only values for older clients and
        are not enforced by reusable sessions. Absence of a
        stored policy is deny-by-default — code execution stays DISABLED for the tenant
        (matching the deploy-wide kill-switch). Restricted to the `admin` role; any
        other role receives **403** (INV-5). Tenant-scoped (INV-1).
      tags: [admin]
      responses:
        "200":
          description: The per-tenant sandbox policy (effective, clamped to the config ceiling).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateSandboxPolicy
      summary: Set the per-tenant sandbox policy (admin only).
      description: >
        Set the caller's tenant's sandbox enablement and package allow/deny lists. A
        tenant-scoped **T1** governance write (spec 0004 §2.5 —
        "authorized owner; audited; no extra approval"): `admin`-only (**403**
        otherwise, INV-5), audited as `sandbox_policy.updated` (INV-6). Compatibility
        egress/cap fields are still accepted and clamped for old clients but are not
        enforced by ADR-0020 reusable sessions. Changes take effect on subsequent
        runs. An out-of-range value or unknown field is **422** (INV-8).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxPolicyUpdate" }
      responses:
        "200":
          description: The updated effective sandbox policy (clamped to the config ceiling).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/autonomy-policy:
    get:
      operationId: getAutonomyPolicy
      summary: The per-tenant assistant autonomy cap (admin only).
      description: >
        The caller's tenant's autonomy cap (issue #218, ADR-0011 §3): `max_autonomy`
        is the ceiling an assistant's EFFECTIVE autonomy is `min`'d to. `is_default` is
        true when no cap is stored — there is no ceiling, so every assistant runs at its
        own configured level (permissive default). Restricted to the `admin` role; any
        other role receives **403** (INV-5). Tenant-scoped (INV-1).
      tags: [admin]
      responses:
        "200":
          description: The per-tenant assistant autonomy cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomyPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateAutonomyPolicy
      summary: Set the per-tenant assistant autonomy cap (admin only).
      description: >
        Set the caller's tenant's autonomy cap (issue #218): `max_autonomy` is the
        maximum `AutonomyLevel` any assistant may effectively run at. A tenant-scoped
        **T1** governance write (spec 0004 §2.5 — "authorized owner; audited; no extra
        approval"): `admin`-only (**403** otherwise, INV-5), audited as
        `autonomy_cap.updated` (INV-6). The cap only ever NARROWS — it lowers an
        assistant's effective autonomy, never raises it. Publishing an assistant above
        the ceiling is rejected **422**, and a running assistant above it is clamped at
        the run-time tool gate. An unknown `max_autonomy` is **422** (INV-8). Returns
        the resulting cap.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomyPolicyUpdate" }
      responses:
        "200":
          description: The updated per-tenant assistant autonomy cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomyPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Sources (connector framework + Web URL source) : ADR-0009 / #108 -------
  /sources:
    get:
      operationId: listSources
      summary: The caller's connected sources (connector grid).
      description: >
        Lists the sources the caller has connected, tenant- and owner-scoped
        (ADR-0009 §5, spec 0004 INV-1/INV-2): a caller only ever sees their own
        sources within their tenant. Each item carries the connector `type`, its
        `config`, sync `status` and `indexed_count` for the health grid, plus
        `owner_id` so the UI can show ownership.
      tags: [sources]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of sources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSource
      summary: Add a source (web URL, or a managed connector — admin only).
      description: >
        Adds a source (ADR-0009 §5, ADR-0019 §1). For the `web` connector the
        body is `{type: web, url}` (any member): the server validates the URL and
        runs the mandatory SSRF check (allow only http/https; reject loopback,
        private/RFC-1918, link-local, CGNAT, and cloud-metadata ranges, on every
        redirect hop; ADR-0009 §3). An invalid OR SSRF-blocked URL is rejected with
        **422** (INV-8) — a blocked URL is a validation failure, not a 403. The
        created `web` source returns `pending` and its first sync is enqueued.
        For a **managed** connector (`gdrive`) the body is `{type: gdrive,
        config}` — **tenant-admin only** (every managed-source mutation is
        admin-gated at action time, ADR-0019 §1; any other role is **403**,
        INV-5); the source is created in `pending_auth` and syncs only after
        `connectSource` + consent completes. Writes are tier T1 (spec 0004
        §2.5) — every add emits an audit event.
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCreate" }
      responses:
        "201":
          description: >
            Created — `pending` with the first sync enqueued (`web`), or
            `pending_auth` awaiting consent (`gdrive`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >
            Malformed body or invalid configuration (INV-8). `Problem.code` is
            one of the **stable codes**: `unsupported_source_type` (a `type` no
            registered connector serves), `url_blocked` (web: SSRF-rejected URL,
            ADR-0009 §3), `invalid_url` (web: malformed URL), `invalid_config`
            (gdrive: a config violating the mode-discriminated schema — missing
            `folder_id`/`drive_id`, or an id the mode does not take).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /sources/{sourceId}:
    parameters:
      - { $ref: "#/components/parameters/SourceId" }
    delete:
      operationId: deleteSource
      summary: Remove a source (cascades its ingested documents).
      description: >
        Deletes the source and cascades the documents it ingested — their chunks
        and embeddings are removed too (ADR-0009 §5); for a managed source the
        vault-held OAuth credential is deleted in the same operation (ADR-0019
        §1). `web` sources are owner-gated: a non-owner receives **404**
        (existence non-disclosure within the tenant, INV-1/INV-2); a source in
        another tenant is likewise **404**. **Managed sources are admin-gated at
        action time** (ADR-0019 §1): a non-admin — including a demoted former
        admin — receives **403** (INV-5). Emits audit events.
      tags: [sources]
      responses:
        "204": { description: Deleted (source + its documents; + its credential when managed). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sources/{sourceId}/sync:
    parameters:
      - { $ref: "#/components/parameters/SourceId" }
    post:
      operationId: syncSource
      summary: Re-sync a source (re-fetch and re-index).
      description: >
        Re-fetches the source and re-indexes its content (ADR-0009 §2/§5; for a
        managed source this is the incremental cursor sync of ADR-0019 §3). The
        sync runs async as a Celery task; the response returns the source with
        status `syncing` (202 — accepted, sync enqueued; 200 if the source was
        already syncing and this is a no-op). `web` sources are owner-gated: a
        non-owner or cross-tenant source is **404** (INV-1/INV-2). **Managed
        sources are admin-gated at action time** (ADR-0019 §1): a non-admin is
        **403** (INV-5); a `pending_auth` source cannot sync — **409** (INV-8).
        Emits an audit event.
      tags: [sources]
      responses:
        "200":
          description: Already syncing — no new sync enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "202":
          description: Accepted; a re-sync was enqueued (status syncing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            The source is awaiting OAuth consent (`pending_auth`) and cannot
            sync (INV-8). `Problem.code` is the stable `source_pending_auth`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # --- Managed-connector OAuth (ADR-0019 §1; F-CB-0 #451) --------------------
  /sources/{sourceId}/connect:
    parameters:
      - { $ref: "#/components/parameters/SourceId" }
    post:
      operationId: connectSource
      summary: Start (or restart) a managed source's OAuth consent flow (admin only).
      description: >
        Begins the OAuth authorization-code + PKCE flow for a managed source
        (ADR-0019 §1) and returns the provider consent URL the browser should
        navigate to. **Tenant-admin only** — every managed-source mutation is
        admin-gated at action time against the caller's current roles; any other
        role receives **403** (INV-5). Starting a new flow increments the
        source's connect generation, invalidating any older in-flight flow.
        Also used to **reauthorize** a source whose grant died
        (`reauthorize_required`). A `web` source — which has no OAuth — is
        **409** (illegal transition, INV-8). Cross-tenant or unknown source is
        **404** (INV-1). Emits audit events; a denied initiation is audited as
        `permission.denied`.
      tags: [sources]
      responses:
        "200":
          description: The consent URL for the browser to navigate to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceConnectResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Illegal transition (INV-8). `Problem.code` is one of the **stable
            codes**: `oauth_not_supported` (the source's type has no OAuth flow,
            e.g. `web`) or `not_connectable` (the source is in a state that
            cannot start a flow).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /sources/oauth/callback:
    get:
      operationId: oauthCallback
      summary: OAuth redirect target for managed connectors (state-authenticated).
      security: []
      description: >
        The single provider-redirect endpoint for all managed-connector OAuth
        flows (ADR-0019 §1). It carries no bearer token (a browser redirect);
        it is authenticated by `state` — an **opaque, high-entropy, single-use
        server-side handle** bound to the initiating tenant/admin/source and
        consumed atomically. The server re-authorizes from current state
        (caller still admin, source connectable, generation current), exchanges
        the code server-side, stores the refresh token in the secrets vault,
        and **always responds 302** — there is no other status. Every query
        parameter is therefore *syntactically* optional (a missing/garbled
        `state` must reach the fail-closed handler and produce the generic
        error redirect, never a validation error); `state` and `code` are
        semantically required for success. The redirect target is the
        deployment-configured SPA sources route (config
        `CONNECTOR_OAUTH_FRONTEND_RETURN_URL`, e.g.
        `https://app.example.com/sources`); the **frozen query contract** on
        top of it is exactly:

          * success — `{return_url}?connect=ok&source={sourceId}`
          * failure — `{return_url}?connect=error&reason={reason}`

        with `reason` one of the closed set: `expired` (missing, unknown,
        already-consumed, or expired `state` — indistinguishable by design, no
        existence disclosure), `denied` (callback re-authorization failed:
        acting user no longer admin, source deleted/not connectable, or a
        superseded connect generation), `provider_error` (the provider returned
        an `error`, or the code exchange failed), `failed` (any other internal
        failure). No provider detail, token, code, or verifier material ever
        appears in the redirect (INV-1/INV-4/INV-8).
      tags: [sources]
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: >
            The opaque single-use flow handle issued by connectSource.
            Semantically required — its absence yields the `expired` error
            redirect, never a 4xx.
        - name: code
          in: query
          required: false
          schema: { type: string }
          description: The provider's authorization code (absent when the provider reports an error).
        - name: error
          in: query
          required: false
          schema: { type: string }
          description: The provider's error code (e.g. access_denied), when consent failed.
      responses:
        "302":
          description: >
            Always — success and every failure mode. No response body; the
            outcome rides the frozen `connect`/`source`/`reason` query
            parameters on the Location target above.
          headers:
            Location:
              required: true
              schema: { type: string }
              description: >
                `{return_url}?connect=ok&source={sourceId}` or
                `{return_url}?connect=error&reason={expired|denied|provider_error|failed}`.

  # --- User preferences (spec 0005 §3; epic #144) ----------------------------
  /preferences:
    get:
      operationId: getPreferences
      summary: The caller's account preferences.
      description: >
        Per-user, tenant-scoped settings (spec 0005). A fresh user has
        `default_model_id: null` (meaning "use the server default"). Always the
        CALLER's row — there is no id in the path and no way to read another user's
        preferences (INV-2).
      tags: [preferences]
      responses:
        "200":
          description: The caller's preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updatePreferences
      summary: Update the caller's account preferences.
      description: >
        Sets the caller's preferences. `default_model_id` must be an id from
        `/models` (else 422 `unknown_model`); send `null` to clear the override and
        fall back to the server default. Stored as an override, validated
        fail-closed at chat time (a model later removed from the registry falls back
        to the server default rather than erroring a chat — spec 0005 §2).
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesUpdate" }
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Per-user account (user settings) --------------------------------------
  /me/avatar:
    put:
      operationId: updateAvatar
      summary: Upload the caller's profile avatar.
      description: >
        Set the caller's own profile picture shown in the app shell. Stores the image
        (MinIO), keyed to the caller within their tenant, and persists its key on the
        user row; the shell reads the resulting presigned URL from `GET /auth/me`
        (`avatar_url`). Authenticated (INV-4) but NOT admin-gated — a user manages
        their OWN avatar; audited as `user.avatar_updated` (INV-6). Allowed
        content-types are `image/png`, `image/jpeg`, `image/svg+xml` and the size cap
        is `MAX_LOGO_BYTES` (default 1 MiB, reused for avatars), enforced server-side:
        an over-size avatar is **413**, a non-image content-type **415**, and a
        missing/blank filename **422** (INV-8). Returns the new avatar URL.
      tags: [user]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The caller's avatar URL after upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAvatar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: clearAvatar
      summary: Clear the caller's profile avatar.
      description: >
        Revert the app shell to the initials fallback for the caller (the reverse of
        `PUT /me/avatar`): sets the caller's avatar key to null. Authenticated (INV-4),
        scoped to the caller's own row (INV-1/INV-2), audited as `user.avatar_updated`
        (INV-6). Idempotent — clearing an already-unset avatar succeeds with **204**.
      tags: [user]
      responses:
        "204": { description: The avatar was cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Saved searches (spec 0005 §3; epic #144) ------------------------------
  /saved-searches:
    get:
      operationId: listSavedSearches
      summary: List the caller's saved searches (newest first).
      tags: [saved-searches]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of saved searches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearchList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSavedSearch
      summary: Save a search (query + optional filters) under a name.
      description: >
        Captures exactly what `/search` accepts — `query` plus the optional
        `collection_id` / `source` / `type` filters — so applying a saved search is
        re-running `/search` with those params (spec 0005 §2). Per-user and
        tenant-scoped.
      tags: [saved-searches]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedSearchCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /saved-searches/{savedSearchId}:
    parameters:
      - { $ref: "#/components/parameters/SavedSearchId" }
    get:
      operationId: getSavedSearch
      summary: Get one saved search.
      tags: [saved-searches]
      responses:
        "200":
          description: The saved search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSavedSearch
      summary: Rename a saved search or change its query/filters.
      tags: [saved-searches]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedSearchUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteSavedSearch
      summary: Delete a saved search.
      tags: [saved-searches]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Search typeahead + recent history (spec 0005 §3; epic #144) -----------
  /search/suggest:
    get:
      operationId: suggestSearch
      summary: Typeahead suggestions as the user types (permission-trimmed).
      description: >
        Returns up to `limit` suggestions for a partial query, ranked by relevance
        and mixing kinds (spec 0005 §3): `completion` (from the caller's own recent
        and saved searches), `document` (matching document titles the caller may
        open), and `saved_search` (a matching saved search). Document matches run
        through the SAME `retrieval/` permission chokepoint as `/search` (CC-1): a
        title the caller cannot open is never suggested (INV-2), within their tenant
        (INV-1). Empty/whitespace `q` → 422 (INV-8). This is a retrieval surface, so
        like `/search` it emits a retrieval audit event (INV-6).
      tags: [search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, pattern: "\\S" }
          description: >
            The partial query typed so far. Must contain a non-whitespace character
            (the `\S` pattern makes an all-whitespace `q` a 422 in the contract,
            matching spec 0005 AC-G3 — no FE/BE divergence); the server trims it
            before use.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
          description: Max suggestions to return.
      responses:
        "200":
          description: Ranked, permission-trimmed suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /search/recent:
    get:
      operationId: listRecentSearches
      summary: The caller's recent search queries (newest first).
      description: >
        Recent queries the caller actually ran via `/search`, de-duplicated by
        normalized query and capped server-side (spec 0005 §2). Per-user — one
        user's recents never appear for another (INV-2).
      tags: [search]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: Max recent queries to return.
      responses:
        "200":
          description: Recent queries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentSearchList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: clearRecentSearches
      summary: Clear the caller's recent search history.
      description: Idempotent — clears all of the caller's recent queries (spec 0005 AC-R2).
      tags: [search]
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- MCP servers (ADR-0012; epic #199 / issue #224) ------------------------
  /mcp-servers:
    get:
      operationId: listMcpServers
      summary: The caller's registered MCP servers.
      description: >
        Lists the MCP (Model Context Protocol) servers the caller has
        registered, tenant- and owner-scoped (ADR-0012 §5, spec 0004
        INV-1/INV-2): a caller only ever sees their own servers within their
        tenant. Each item carries the `transport`, `endpoint_url`, `enabled`
        toggle, health `status`, `last_health_at`, `discovered_tool_count`, and a
        masked `secret_hint` — **never** the stored credential value (ADR-0012 §5,
        CC-C #209).
      tags: [mcp-servers]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of registered MCP servers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServerList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: registerMcpServer
      summary: Register a remote MCP server.
      description: >
        Registers a remote MCP server (ADR-0012 §1/§5). `transport` is
        constrained to the remote transports `streamable_http` (primary) or `sse`
        (compat) — **stdio/local-process is rejected** as unsupported (ADR-0012
        §1). `endpoint_url` MUST be `https` and passes the mandatory SSRF check on
        register (and again on every connect): reject loopback, private/RFC-1918,
        IPv6 ULA, link-local, CGNAT, and cloud-metadata ranges, on every redirect
        hop (ADR-0012 §4, reusing the ADR-0009 chokepoint). A malformed body, an
        unsupported/`stdio` transport, or an invalid / non-https / SSRF-blocked
        `endpoint_url` is rejected with **422** (INV-8) — `code` distinguishes the
        cases (e.g. `endpoint_blocked` for an SSRF rejection,
        `unsupported_transport` for stdio). The optional `auth` credential is
        **write-only**: it is stored envelope-encrypted via CC-C (#209) as an
        `auth_ref` and is **never** returned by any endpoint — the response
        carries only a masked `secret_hint`. The created server is returned with
        `status: pending`; run `POST /mcp-servers/{serverId}/test` to probe health
        and discover tools. A write at read-before-write tier T1 (owner-gated;
        spec 0004 §2.5) — registration emits an audit event (INV-6).
      tags: [mcp-servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerCreate" }
      responses:
        "201":
          description: Registered (status pending; secret stored write-only via CC-C).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >
            Malformed body, an unsupported / `stdio` transport, or an invalid /
            non-https / SSRF-blocked `endpoint_url` (INV-8, ADR-0012 §1/§4). `code`
            distinguishes the cases (e.g. `unsupported_transport`,
            `endpoint_blocked`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /mcp-servers/{serverId}:
    parameters:
      - { $ref: "#/components/parameters/McpServerId" }
    get:
      operationId: getMcpServer
      summary: Get one registered MCP server.
      description: >
        Returns one MCP server, owner-gated: a non-owner or cross-tenant id is
        **404** (existence non-disclosure within the tenant, INV-1/INV-2). The
        response never includes the stored credential — only a masked `secret_hint`
        (ADR-0012 §5).
      tags: [mcp-servers]
      responses:
        "200":
          description: The MCP server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMcpServer
      summary: Update a registered MCP server (rename, toggle, rotate credential).
      description: >
        Updates a registered MCP server (ADR-0012 §5). Change the display `name`,
        the `enabled` toggle, the `endpoint_url` (re-validated + SSRF-checked, same
        rules as register), or rotate the `auth` credential (write-only, replaces
        the CC-C `auth_ref`; send `null` to clear it). The credential value is
        never returned — the response carries only the updated masked `secret_hint`.
        Owner-gated: a non-owner or cross-tenant id is **404** (INV-1/INV-2); a
        malformed body or invalid / non-https / SSRF-blocked `endpoint_url` is
        **422** (INV-8). Emits an audit event (INV-6).
      tags: [mcp-servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpServerUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Malformed body, an unsupported / `stdio` transport, or an invalid /
            non-https / SSRF-blocked `endpoint_url` (INV-8, ADR-0012 §1/§4).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deleteMcpServer
      summary: Remove a registered MCP server.
      description: >
        Deletes the MCP server, its stored credential (`auth_ref` in the CC-C
        vault), and its discovered-tool snapshot; the server's tools are removed
        from the registry so assistants can no longer invoke them (ADR-0012 §5/§6).
        Owner-gated: a non-owner or cross-tenant id is **404** (INV-1/INV-2). Emits
        an audit event (INV-6).
      tags: [mcp-servers]
      responses:
        "204": { description: Deleted (server + its stored credential + discovered tools). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mcp-servers/{serverId}/test:
    parameters:
      - { $ref: "#/components/parameters/McpServerId" }
    post:
      operationId: testMcpServer
      summary: Probe an MCP server's health and re-discover its tools.
      description: >
        Runs a bounded liveness/handshake probe through the SSRF-guarded egress
        path and re-discovers the server's advertised tools (ADR-0012 §2 `health` +
        `list_tools`, §4 egress). On success the server's `status` becomes `ready`,
        `last_health_at` is stamped, and the discovered-tool snapshot
        (`discovered_tool_count`) is refreshed; a failed handshake / down / slow
        server marks `status: error` and returns the updated server with a safe
        `last_error` — a probe never throws (ADR-0012 §7 failure isolation). The
        credential is fetched in-process from CC-C at connect time and never
        returned. Owner-gated: a non-owner or cross-tenant id is **404**
        (INV-1/INV-2). Emits an audit event (INV-6).
      tags: [mcp-servers]
      responses:
        "200":
          description: >
            Probe completed; the updated server is returned. Both a healthy
            (`status: ready`) and an unreachable/erroring (`status: error`) result
            return 200 — the outcome is in `status` / `last_error`, not the HTTP
            code (ADR-0012 §7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpServer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mcp-servers/{serverId}/tools:
    parameters:
      - { $ref: "#/components/parameters/McpServerId" }
    get:
      operationId: listMcpServerTools
      summary: The tools discovered from an MCP server.
      description: >
        Lists the tools discovered from this server on the last successful probe
        (ADR-0012 §6). Each tool carries its **namespaced** registry name
        (`mcp:<server_slug>:<tool>`), description, advertised argument JSON schema,
        and inferred `risk_tier` — default **T2** (approval-gated) unless the server
        annotated it read-only/non-destructive, which maps to **T0** (ADR-0012 §6,
        spec 0004 §2.5). Owner-gated: a non-owner or cross-tenant id is **404**
        (INV-1/INV-2).
      tags: [mcp-servers]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of discovered tools (from the last probe).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpToolList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }


  /tools:
    get:
      operationId: listTools
      summary: The tool catalogue with this tenant's effective governance (read-only).
      description: >
        Every registered tool with its static registry metadata (`description`,
        `risk_tier`, `read_only`) plus this tenant's **effective** governance flags
        (`enabled` / `requires_approval`, an admin override where one exists, else the
        tool's built-in default). Deterministically ordered by `tool_name`.


        This is the source the **assistant builder** composes a `toolAllowlist`
        against (issue #505). `/admin/tool-policy` carries the same data but is
        `admin`-only (INV-5), so an ordinary assistant owner could not see which tools
        exist or which their admin had switched off, and the builder shipped a
        hardcoded stub that omitted `run_python` entirely.


        Read-only and **grants nothing**: changing a tenant's policy stays an admin
        write on `PATCH /admin/tool-policy`, and the runtime approval gate still
        decides whether an allowed tool may actually execute. A tool with
        `enabled: false` must be surfaced as unavailable rather than offered as a
        selectable control that would be refused at run time. Requires a valid bearer
        token (**401** otherwise, INV-4); tenant-scoped (INV-1).
      tags: [tools]
      responses:
        "200":
          description: The tenant's tool catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- merged: /assistants, /assistants/{assistantId}, /assistants/{assistantId}/publish, /assistants/{assistantId}/versions, /assistants/{assistantId}/rollback ---
  /assistants:
    get:
      operationId: listAssistants
      summary: List the caller's assistants (owned + shared) — paginated.
      description: >
        Tenant- and permission-scoped (INV-1/INV-2): the caller's own assistants
        plus those granted to them (the `grants` pattern, ADR-0011 §1). Never
        another tenant's or an unshared assistant.
      tags: [assistants]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AssistantStatus" }
          description: Optional filter by lifecycle status.
      responses:
        "200":
          description: A page of assistants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createAssistant
      summary: Create a draft assistant.
      description: >
        Creates a `draft` assistant owned by the caller (ADR-0011 §1). A backup
        owner is not required at draft time (it is required before publish). A
        malformed body → 422 (INV-8).
      tags: [assistants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantCreate" }
      responses:
        "201":
          description: Created (draft).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /assistants/draft:
    post:
      operationId: draftAssistant
      summary: Draft an assistant config from a plain-language description (E6-1).
      description: >
        The conversational agent builder (issue #213): given a plain-language
        `description`, returns a **draft** config the client loads into the editor
        for review + save — it creates **nothing** (nothing is persisted until the
        user saves via `POST /assistants`). Owner-scoped (INV-1/INV-2): the draft
        can only reference tools that exist and collections/sources the caller owns;
        a tool the description named that is unknown, or a collection/source the
        caller cannot see, is **omitted** from the draft with an explanatory `note`
        (deny-by-default) rather than surfaced. `clarifications` are questions the
        builder asks for anything the description left ambiguous (missing scope,
        owner, or risk acknowledgement, E6-3); `warnings` flag any drafted high-risk
        (write-tier / approval-gated) tool. Audited `assistant.drafted` (INV-6). A
        blank or oversize `description` → 422 (INV-8).
      tags: [assistants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantDraftRequest" }
      responses:
        "200":
          description: The drafted config plus clarifications, notes, and warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /assistants/{assistantId}:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    get:
      operationId: getAssistant
      summary: Get an assistant.
      description: >
        Cross-tenant / non-owned / non-granted id → 404 (existence
        non-disclosure, INV-1/INV-2).
      tags: [assistants]
      responses:
        "200":
          description: The assistant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAssistant
      summary: Update a draft assistant's working definition.
      description: >
        Edits the mutable head (ADR-0011 §1). Only the owner (or a tenant admin)
        may edit; a non-owned/cross-tenant id → 404. A malformed body → 422.
      tags: [assistants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteAssistant
      summary: Delete an assistant.
      description: >
        Removes the assistant head (immutable version history is preserved per
        ADR-0011 §1). Non-owned / cross-tenant id → 404.
      tags: [assistants]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistants/{assistantId}/publish:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    post:
      operationId: publishAssistant
      summary: Publish a draft assistant (draft → published).
      description: >
        Freezes the current head into a new immutable `AssistantVersion`
        (`version = max+1`) and sets `status = published` (ADR-0011 §1). Requires
        both an owner and a distinct backup owner to be present — publishing
        without a backup owner is rejected as **422** (INV-8). Only the owner (or
        a tenant admin) may publish; a non-owned / cross-tenant id → 404.
      tags: [assistants]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantPublishRequest" }
      responses:
        "200":
          description: Published; the newly created head version is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /assistants/{assistantId}/versions:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    get:
      operationId: listAssistantVersions
      summary: List an assistant's immutable published versions (newest first).
      description: >
        The append-only version history (ADR-0011 §1), paginated. Non-owned /
        cross-tenant id → 404.
      tags: [assistants]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantVersionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistants/{assistantId}/rollback:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    post:
      operationId: rollbackAssistant
      summary: Roll the head back to a prior version.
      description: >
        Creates a **new** head version whose config copies the named prior
        version (history is never mutated or deleted; ADR-0011 §1). Only the
        owner (or a tenant admin) may roll back; a non-owned / cross-tenant id →
        404. An unknown or malformed `version` → 422.
      tags: [assistants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantRollbackRequest" }
      responses:
        "200":
          description: Rolled back; the newly created head version is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /assistants/{assistantId}/test:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    post:
      operationId: testAssistant
      summary: Preview/test/debug a draft assistant with NO real side effect (E6-5).
      description: >
        Runs the assistant's **working (draft) config** against a sample input with
        **write-tier tools forced into simulate/deny mode** (CC-A #207 read-only
        demotion), and returns the debug trace (ADR-0011, issue #215). A T1
        file-writing tool (`write_file`) builds + validates but persists **no**
        artifact; the T2 code-execution tool (`run_python`) is denied — no container
        launches. So a test run produces **no artifact, no code run, and no external
        effect** — it is a safe preview before publishing.


        The trace carries the effective system `prompt` (persona-augmented), the
        sample `input`, the resolved `model`, the `retrieval` grounding (permitted
        passages only — INV-3, keyed off the caller so a preview can never surface a
        passage the caller could not retrieve), each `toolCalls` entry (args +
        result), the streamed `outputs`, any typed `errors`, whether the run
        `succeeded`, and the wall-clock `durationMs`.


        Owner-scoped (owner-or-admin, the same rule the CRUD surface uses): a
        non-owned / cross-tenant id → **404** (existence non-disclosure,
        INV-1/INV-2). A malformed body → 422 (INV-8). Audited `assistant.tested`
        (INV-6); no other row is persisted (the internal transcript is rolled back).
      tags: [assistants]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantTestRequest" }
      responses:
        "200":
          description: The debug trace of the read-only test run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTestTrace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }


  # --- merged: /code-runs/{codeRunId} ---
  /code-runs/{codeRunId}:
    parameters:
      - { $ref: "#/components/parameters/CodeRunId" }
    get:
      operationId: getCodeRun
      summary: Inspect a code run (status, code, output, timing, artifacts).
      description: >
        Read-only inspection of one sandbox code run (ADR-0020, E15-7 / E6-5).
        Runs are **agent-mediated**: the `run_python` tool (CC-A #207, highest risk
        tier, admin-gated #231) enqueues them off the request path
        — there is deliberately **no** public "execute arbitrary code" endpoint here.
        This surface exists so the inspector UI (#232) and debuggable-runs (E6-5) can
        show what the agent ran and what it produced: the exact `code` executed, its
        `status`, captured `stdout`/`stderr`, `exit_code`,
        `duration_ms`, `resource_usage`, and the ids of any artifacts the run emitted
        (`artifact_ids`, collected via CC-B #208).


        Tenant- and owner-scoped (spec 0004 INV-1/INV-2): a run id in another tenant —
        or one the caller does not own — returns **404** (existence non-disclosure),
        never 403. A malformed (non-uuid) id is **422**.
      tags: [code-runs]
      responses:
        "200":
          description: The code run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /code-runs/{codeRunId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/CodeRunId" }
    post:
      operationId: cancelCodeRun
      summary: Cancel a running code execution and reset its sandbox generation.
      description: >
        Owner-only explicit recovery for an unbounded run. Cancellation destroys the
        run's matching session generation and marks the run `killed`. If that
        generation is still current, the sandbox generation advances so the next run
        starts clean; cancelling an older run never destroys a newer reset generation.
        A foreign run id is 404.
      tags: [code-runs]
      responses:
        "200":
          description: The resulting code-run record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }


  # --- merged: /schedules, /schedules/{scheduleId}, /schedules/{scheduleId}/pause, /schedules/{scheduleId}/resume, /schedules/{scheduleId}/run-now, /runs, /runs/{runId} ---
  /schedules:
    get:
      operationId: listSchedules
      summary: The caller's schedules (owner-scoped).
      description: >
        Lists the caller's saved recurring runs, tenant- and owner-scoped
        (ADR-0015 §8, spec 0004 INV-1/INV-2): a caller only ever sees their own
        schedules within their tenant. Each item carries its `cadence`, `timezone`,
        `enabled` flag, and the last-fire summary (`next_run_at`, `last_run_at`,
        `last_status`) for the list view.
      tags: [schedules]
      parameters:
        - name: assistant_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filter to schedules that run one assistant.
        - name: enabled
          in: query
          required: false
          schema: { type: boolean }
          description: Filter to enabled (true) or paused (false) schedules.
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of the caller's schedules (newest first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createSchedule
      summary: Create a schedule (a recurring assistant run).
      description: >
        Creates a recurring run of a saved assistant (ADR-0015 §8): pick the
        assistant, a `cadence` (a cron expression OR a structured cadence), an IANA
        `timezone` that drives the DST-correct `next_run_at`, the assistant's
        `input_params`, a `delivery` policy, and an `overlap_policy`. Owner-gated
        **T1** write (reversible internal write, spec 0004 §2.5); audited. A
        malformed cron expression or an unknown IANA timezone is rejected with
        **422** (INV-8); `code` distinguishes the cases (e.g. `invalid_cron`,
        `invalid_timezone`). The created schedule is returned `enabled` with its
        computed `next_run_at`.
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCreate" }
      responses:
        "201":
          description: Created; the RedBeat entry is derived and next_run_at computed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Malformed body, an unknown assistant, or an invalid cron expression /
            IANA timezone (INV-8). `code` distinguishes the cases (e.g.
            `invalid_cron`, `invalid_timezone`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /schedules/{scheduleId}:
    parameters:
      - { $ref: "#/components/parameters/ScheduleId" }
    get:
      operationId: getSchedule
      summary: Get one schedule.
      description: >
        Owner-scoped: a schedule owned by another user or in another tenant is
        **404** (existence non-disclosure, INV-1/INV-2).
      tags: [schedules]
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSchedule
      summary: Edit a schedule (cadence, timezone, inputs, delivery, overlap).
      description: >
        Updates a schedule; the RedBeat entry is re-derived from the new cadence /
        timezone (ADR-0015 §1). Owner-gated — a non-owner or cross-tenant schedule
        is **404** (INV-1/INV-2). A malformed cron expression or unknown IANA
        timezone is **422** (INV-8, `code` = `invalid_cron` / `invalid_timezone`).
        Audited.
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            Malformed body, or an invalid cron expression / IANA timezone (INV-8).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deleteSchedule
      summary: Delete a schedule (cascades its runs per retention).
      description: >
        Removes the schedule and its derived RedBeat entry; its runs cascade per
        retention (ADR-0015 §8). Owner-gated — a non-owner or cross-tenant schedule
        is **404** (INV-1/INV-2). Audited.
      tags: [schedules]
      responses:
        "204": { description: Deleted (schedule + its runs). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schedules/{scheduleId}/pause:
    parameters:
      - { $ref: "#/components/parameters/ScheduleId" }
    post:
      operationId: pauseSchedule
      summary: Pause a schedule (set enabled=false).
      description: >
        Sets `enabled=false` and removes the derived RedBeat entry so the schedule
        stops firing (ADR-0015 §6). Idempotent — pausing an already-paused schedule
        returns it unchanged (200). Owner-gated — a non-owner or cross-tenant
        schedule is **404** (INV-1/INV-2). Audited.
      tags: [schedules]
      responses:
        "200":
          description: Paused (enabled=false); next_run_at is null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schedules/{scheduleId}/resume:
    parameters:
      - { $ref: "#/components/parameters/ScheduleId" }
    post:
      operationId: resumeSchedule
      summary: Resume a schedule (set enabled=true).
      description: >
        Sets `enabled=true` and re-derives the RedBeat entry so the schedule fires
        again; `next_run_at` is recomputed tz/DST-correct (ADR-0015 §6).
        Idempotent — resuming an already-enabled schedule returns it unchanged
        (200). Owner-gated — a non-owner or cross-tenant schedule is **404**
        (INV-1/INV-2). Audited.
      tags: [schedules]
      responses:
        "200":
          description: Resumed (enabled=true); next_run_at recomputed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schedules/{scheduleId}/run-now:
    parameters:
      - { $ref: "#/components/parameters/ScheduleId" }
    post:
      operationId: runScheduleNow
      summary: Enqueue an out-of-band manual run immediately.
      description: >
        Enqueues a `manual` run of the schedule's assistant right now, out of band
        from the cadence (ADR-0015 §6). The run is created `queued` and executed by
        the `lumen.run_assistant` Celery task off the request path; the response
        returns the new run's `run_id` (202 — accepted). Owner-gated — a non-owner
        or cross-tenant schedule is **404** (INV-1/INV-2). Running a schedule whose
        assistant/version is unavailable, or an illegal state, is a **409**
        (INV-8). Audited (`run.started`).
      tags: [schedules]
      responses:
        "202":
          description: Accepted; a manual run was enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunEnqueued" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /runs:
    get:
      operationId: listRuns
      summary: The run inbox — list runs (newest first).
      description: >
        Lists the caller's runs, tenant- and owner-scoped (ADR-0015 §8, spec 0004
        INV-1/INV-2), newest first. Filter by `assistant_id`, `schedule_id`, or
        `status`. Each item carries `status`, `trigger`, `started_at`/`finished_at`,
        and the `summary` digest line for the inbox — the transcript, tool calls and
        citations live on the detail (`GET /runs/{runId}`).
      tags: [runs]
      parameters:
        - name: assistant_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filter to runs of one assistant.
        - name: schedule_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filter to runs from one schedule (omit for both scheduled + manual).
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RunStatus" }
          description: Filter to one run status.
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of runs (newest first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /runs/{runId}:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    get:
      operationId: getRun
      summary: Run detail — status, inputs, transcript, citations, outputs, error.
      description: >
        The full run record (ADR-0015 §8): `status`, resolved `inputs`, the ordered
        persisted transcript (`steps` — the durable analogue of the WS envelope
        stream, with tool calls and deltas), the grounded `citations`, the run's
        `outputs`, the typed `error` / escalation reason (never a raw vendor
        string), and the inbox `summary`. Owner-scoped — a run owned by another user
        or in another tenant is **404** (existence non-disclosure, INV-1/INV-2).


        **Live attach:** to watch an in-progress run, connect the existing chat
        WebSocket with this run's `id` as the `streamId`; the consumer relays the
        run's envelopes (drains the transcript-backed replay, then goes live),
        reusing the `start` → (`delta` | `event` | `citation`) → `done`/`error`
        sequence unchanged (ADR-0015 §3) — no new envelope shape.
      tags: [runs]
      responses:
        "200":
          description: The run detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Escalation handoff: resume / cancel / reroute an escalated run (E7-5, #239) ---
  # A run that escalated (status=escalated) is handed to a human who resumes it
  # (re-enqueue), cancels it (acknowledge + close), or reroutes it (reassign to another
  # owner, re-enqueue as them — INV-2, the reroute never widens access). Owner-scoped:
  # a run in another tenant / owned by another user is 404 (existence non-disclosure).
  # Acting on a run that is NOT escalated is 409 (illegal transition, INV-8). Each
  # action is audited (run.resumed / run.cancelled / run.rerouted).
  /runs/{runId}/resume:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    post:
      operationId: resumeRun
      summary: Resume an escalated run — re-enqueue it from the escalation point.
      description: >
        The owner resumes an **escalated** run (E7-5): it is reset to `queued` and
        re-driven by the run task, clearing the escalation reason. Returns the run in
        its `queued` state. Not escalated → **409** (INV-8); not visible/owned → **404**
        (INV-1/INV-2). Audited `run.resumed`.
      tags: [runs]
      responses:
        "202":
          description: The run, reset to queued and re-enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /runs/{runId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    post:
      operationId: cancelRun
      summary: Cancel an escalated run — acknowledge and close it.
      description: >
        The owner cancels an **escalated** run (E7-5): it is closed to a permanent
        terminal with a `cancelled` reason in `error` and is not re-enqueued. Returns
        the closed run. Not escalated → **409** (INV-8); not visible/owned → **404**.
        An escalated run is never silently dropped — cancel is an explicit, audited
        (`run.cancelled`) human decision.
      tags: [runs]
      responses:
        "200":
          description: The run, closed by the owner's cancellation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /runs/{runId}/reroute:
    parameters:
      - { $ref: "#/components/parameters/RunId" }
    post:
      operationId: rerouteRun
      summary: Reroute an escalated run to another owner, then re-enqueue it.
      description: >
        The owner reroutes an **escalated** run (E7-5) to another user in the tenant:
        the run's owner (its execution principal) is reassigned and the run is reset to
        `queued`, so it re-drives **as the new owner** — the new owner's grants apply
        (INV-2), never a widening of access. The target must be a user in the caller's
        tenant (else **404**, existence non-disclosure) and not the current owner (else
        **422**). Not escalated → **409** (INV-8); not visible/owned → **404**. Audited
        `run.rerouted`.
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunReroute" }
      responses:
        "202":
          description: The run, reassigned to the new owner and re-enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }


  # --- merged: /admin/assistants, /admin/assistants/disable-orphans, /admin/assistants/{assistantId}/certify, /admin/assistants/{assistantId}/feature, /admin/assistants/{assistantId}/disable, /admin/assistants/{assistantId}/transfer-ownership ---
  /admin/assistants:
    get:
      operationId: listGovernedAssistants
      summary: Every assistant in the tenant with its governance state (admin only).
      description: >
        The admin library view (E6-6, #217): all assistants across every owner in the
        tenant, each carrying its certification / featured / disabled state, category,
        and the `ownerOrphaned` flag (owner no longer a tenant member — flag for
        reassignment, E6-8). Restricted to the `admin` role; any other role receives
        **403** (INV-5). Tenant-scoped (INV-1). Cursor-paginated; a malformed cursor is
        **422** (INV-8).
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A cursor page of the tenant's assistants with governance state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernedAssistantList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/assistants/disable-orphans:
    post:
      operationId: disableOrphanedAssistants
      summary: Disable every orphaned assistant in the tenant (admin only).
      description: >
        Bulk E6-8 control (#217): disable every orphaned assistant (owner
        deprovisioned) so an abandoned assistant does not keep running unattended.
        `admin`-only (**403** otherwise, INV-5); tenant-scoped (INV-1); audits each
        `assistant.disabled` (INV-6). Idempotent — an already-disabled orphan is
        skipped. Returns the affected ids.
      tags: [admin]
      responses:
        "200":
          description: The bulk-sweep outcome (affected ids + the applied action).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkOrphanResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/assistants/{assistantId}/certify:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    post:
      operationId: certifyAssistant
      summary: Set an assistant's certification verdict (admin only).
      description: >
        Certify / deprecate / clear an assistant's library certification (E6-6, #217) —
        an orthogonal governance axis. `admin`-only (**403** otherwise, INV-5);
        tenant-scoped (INV-1); audited `assistant.certified` / `assistant.deprecated`
        (INV-6). A cross-tenant / missing id is **404** (existence non-disclosure).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantCertifyRequest" }
      responses:
        "200":
          description: The assistant with its updated governance state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernedAssistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/assistants/{assistantId}/feature:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    post:
      operationId: featureAssistant
      summary: Feature / unfeature an assistant in the library (admin only).
      description: >
        Feature / unfeature an assistant (E6-6, #217). `admin`-only (**403** otherwise,
        INV-5); tenant-scoped (INV-1); audited `assistant.featured` (INV-6). A
        cross-tenant / missing id is **404**.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantFeatureRequest" }
      responses:
        "200":
          description: The assistant with its updated governance state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernedAssistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/assistants/{assistantId}/disable:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    post:
      operationId: disableAssistant
      summary: Disable / re-enable an assistant (admin only).
      description: >
        Disable / re-enable an assistant (E6-6, #217). Disabling flips the lifecycle
        status to `disabled` (and stamps `disabledAt`) so the existing run / chat /
        schedule gate refuses it — a disabled assistant cannot start (INV-8).
        Re-enabling returns the head to `draft` (the owner re-publishes to run again).
        `admin`-only (**403** otherwise, INV-5); tenant-scoped (INV-1); audited
        `assistant.disabled` (INV-6). A cross-tenant / missing id is **404**.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantDisableRequest" }
      responses:
        "200":
          description: The assistant with its updated governance state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernedAssistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/assistants/{assistantId}/transfer-ownership:
    parameters:
      - { $ref: "#/components/parameters/AssistantId" }
    post:
      operationId: transferAssistantOwnership
      summary: Reassign an assistant's accountable owner (admin only).
      description: >
        Reassign the assistant's accountable owner to another tenant member (E6-8,
        #217) — the admin rescue for an orphaned assistant. The new owner must be a
        distinct member of the tenant (else **422**, INV-8). `admin`-only (**403**
        otherwise, INV-5); tenant-scoped (INV-1); audited
        `assistant.ownership_transferred` (INV-6). A cross-tenant / missing id is
        **404**.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantOwnershipTransferRequest" }
      responses:
        "200":
          description: The assistant with its new owner + governance state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernedAssistant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }


  # --- merged: /run-deliveries, /run-deliveries/{deliveryId}/read ---
  /run-deliveries:
    get:
      operationId: listRunDeliveries
      summary: The run inbox — list a completed run's in-app deliveries (newest first).
      description: >
        Lists the caller's in-app run deliveries, tenant- and owner-scoped (ADR-0015
        §6, spec 0004 INV-1/INV-2), newest first. A completed scheduled/manual run
        lands here with its `summary` and its `run_id` (a link to the full cited
        transcript, `GET /runs/{runId}`) so results reach the owner without opening
        the app. Filter by `status`, or pass `unread=true` for the unread inbox.
        Digest deliveries are batched by a periodic beat and surface as `delivered`.
        External channels (email/Slack) are deferred T2-ish egress (INV-7) — this
        surface is in-app only.
      tags: [run-deliveries]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RunDeliveryStatus" }
          description: Filter to one delivery status.
        - name: unread
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, exclude already-read deliveries (the unread inbox).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of run deliveries (newest first).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDeliveryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /run-deliveries/{deliveryId}/read:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The run-delivery id.
    post:
      operationId: markRunDeliveryRead
      summary: Mark one run delivery as read (idempotent).
      description: >
        Marks the delivery read and stamps `read_at`; idempotent (re-marking a read
        delivery returns it unchanged). Owner-scoped — a delivery in another tenant or
        addressed to another user is **404** (existence non-disclosure, INV-1/INV-2).
        Audited (`run.delivery_read`, INV-6).
      tags: [run-deliveries]
      responses:
        "200":
          description: The updated (read) delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }


  # --- merged: /admin/llm-providers, /admin/llm-providers/{providerId}, /admin/llm-providers/{providerId}/refresh ---
  /admin/llm-providers:
    get:
      operationId: listLlmProviders
      summary: The tenant's registered LLM providers + discovered models (admin only).
      description: >
        The caller's tenant's registered LLM providers, each with its discovered
        models and discovery/health `status`. Restricted to the `admin` role; any
        other role receives **403** (INV-5). Tenant-scoped (INV-1). The stored API key
        is **never** returned — only a masked `secret_hint`.
      tags: [admin]
      responses:
        "200":
          description: The tenant's registered LLM providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProviderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLlmProvider
      summary: Register an LLM provider and auto-discover its models (admin only).
      description: >
        Register an OpenAI-compatible LLM provider (name + base URL + optional API
        key). The backend auto-discovers the provider's models via `GET
        {base_url}/models` and stores a snapshot + `status`. `admin`-only (**403**
        otherwise, INV-5); tenant-scoped (INV-1); audited (INV-6). The `api_key` is
        write-only — stored envelope-encrypted via CC-C, never returned. An
        unsupported `provider_type`, or an invalid / non-https / SSRF-blocked
        `base_url`, is **422** (INV-8). A reachable provider returns `status: ready`
        with `discovered_models`; a bad key/url returns `status: error` + `last_error`
        (never a 500).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProviderCreate" }
      responses:
        "201":
          description: The registered provider (with discovered models + status).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/llm-providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The LLM provider id.
    patch:
      operationId: updateLlmProvider
      summary: Update a registered LLM provider (admin only).
      description: >
        Update a registered LLM provider (rename, retarget `base_url`, toggle
        `enabled`, or rotate/clear the `api_key`). Changing `base_url` re-runs the
        https + SSRF validation (else **422**) and re-runs model discovery; rotating
        the key likewise re-discovers. The key value is never returned — only the
        updated masked `secret_hint`. `admin`-only (**403** otherwise, INV-5);
        tenant-scoped (INV-1) — a cross-tenant id is **404** (never 403). Audited
        (INV-6).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmProviderUpdate" }
      responses:
        "200":
          description: The updated provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteLlmProvider
      summary: Remove a registered LLM provider (admin only).
      description: >
        Delete the LLM provider and its stored API key (in the CC-C vault).
        `admin`-only (**403** otherwise, INV-5); tenant-scoped (INV-1) — a
        cross-tenant id is **404**. Audited (INV-6).
      tags: [admin]
      responses:
        "204": { description: Deleted (provider + its stored API key). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/llm-providers/{providerId}/refresh:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The LLM provider id.
    post:
      operationId: refreshLlmProvider
      summary: Re-run model discovery for a provider (admin only).
      description: >
        Re-run model discovery for the provider via `GET {base_url}/models`, resolving
        the API key in-process from the CC-C vault. On success `status: ready` with a
        fresh `discovered_models`; on failure `status: error` + a safe `last_error`
        (previous snapshot preserved). Both outcomes return **200** — the result is in
        `status` / `last_error`, not the HTTP code. `admin`-only (**403** otherwise,
        INV-5); tenant-scoped (INV-1) — a cross-tenant id is **404**. Audited (INV-6).
      tags: [admin]
      responses:
        "200":
          description: Discovery completed; the updated provider is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque pagination cursor from a previous response's next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Max items to return.
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SavedSearchId:
      name: savedSearchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    McpServerId:
      name: serverId
      in: path
      required: true
      schema: { type: string, format: uuid }

    AssistantId:
      name: assistantId
      in: path
      required: true
      schema: { type: string, format: uuid }

    CodeRunId:
      name: codeRunId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, example: lumen-copilot-backend }
        version: { type: string, example: 0.0.1 }

    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/DependencyStatus" }

    DependencyStatus:
      type: object
      additionalProperties: false
      required: [name, ok]
      properties:
        name:
          type: string
          description: Dependency identifier (e.g. postgres, redis, minio).
        ok: { type: boolean }
        detail:
          type: string
          description: Optional human-readable detail when not ok.

    # --- Auth ---------------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: Short-lived JWT bearer token. }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, description: Access-token lifetime in seconds. }

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, tenant_id, tenant_name, roles, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        tenant_id: { type: string, format: uuid }
        tenant_name:
          type: string
          description: >
            Human-readable tenant name (the `tenants.name` column) so the UI
            never has to surface the raw tenant UUID (issue #247).
        roles:
          type: array
          items: { type: string, enum: [member, admin, security] }
        created_at: { type: string, format: date-time }
        logo_url:
          type: [string, "null"]
          description: >
            The tenant's application logo as a short-TTL presigned GET URL, or
            null when none is set (the shell renders the default brand mark). A
            per-tenant setting an admin uploads via PUT /admin/branding — the same
            for every user of the tenant.
        avatar_url:
          type: [string, "null"]
          description: >
            The caller's own profile avatar as a short-TTL presigned GET URL, or
            null when none is set (the shell renders the initials fallback). A
            per-user setting the user uploads via PUT /me/avatar — theirs alone.

    UserAvatar:
      type: object
      additionalProperties: false
      description: >
        The caller's profile avatar (user settings). `avatar_url` is a short-TTL
        presigned GET URL for the caller's uploaded avatar, or null when none is set.
        The current state is also readable via GET /auth/me (`avatar_url`), so no
        separate GET is needed.
      required: [avatar_url]
      properties:
        avatar_url:
          type: [string, "null"]

    # --- Collections --------------------------------------------------------
    CollectionCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    CollectionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    Collection:
      type: object
      additionalProperties: false
      required: [id, name, owner_id, document_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner_id: { type: string, format: uuid }
        document_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CollectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # --- Documents ----------------------------------------------------------
    DocumentStatus:
      type: string
      description: Ingestion lifecycle.
      enum: [pending, processing, ready, failed]

    Document:
      type: object
      additionalProperties: false
      required:
        [id, filename, mime_type, size_bytes, collection_id, owner_id, status, chunk_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        collection_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        error:
          type: string
          description: Failure reason when status is failed.
        chunk_count:
          type: integer
          minimum: 0
          description: Number of indexed chunks (0 until ingestion completes).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        next_cursor:
          type: [string, "null"]

    DocumentText:
      type: object
      additionalProperties: false
      required: [text, chunk_count, truncated]
      properties:
        text:
          type: string
          description: The extracted plain text (parser output, chunk-reassembled).
        chunk_count:
          type: integer
          minimum: 0
          description: Number of chunks the text was reassembled from.
        truncated:
          type: boolean
          description: >
            True when the text was capped at the server limit
            (DOCUMENT_TEXT_MAX_BYTES); the UI should say so and offer the
            original-bytes download instead of implying completeness.

    ArtifactProducedBy:
      type: string
      description: >
        What produced an artifact (CC-B #208) — the write origin. `chat_session`
        = written during an interactive chat turn; `run` = produced by a
        background run; `tool` = emitted by a tool / code invocation.
      enum: [chat_session, run, tool]

    Artifact:
      type: object
      additionalProperties: false
      description: >
        A file an agent/run produced (CC-B #208), distinct from a user-uploaded
        `Document`. Immutable (a new version is a new row — no `updated_at`).
        Tenant- and owner-scoped. `produced_by` records the write origin and pins
        which back-link id is set (`session_id` / `run_id` / `tool_invocation_id`).
      required:
        [id, filename, mime_type, size_bytes, owner_id, produced_by, created_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        owner_id: { type: string, format: uuid }
        produced_by: { $ref: "#/components/schemas/ArtifactProducedBy" }
        created_at: { type: string, format: date-time }
        session_id:
          type: [string, "null"]
          format: uuid
          description: The chat session that produced this artifact, when applicable.
        run_id:
          type: [string, "null"]
          format: uuid
          description: The background run that produced this artifact, when applicable.
        tool_invocation_id:
          type: [string, "null"]
          format: uuid
          description: The tool/code invocation that emitted this artifact, when applicable.

    ArtifactList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        next_cursor:
          type: [string, "null"]

    # --- Chat ---------------------------------------------------------------
    ChatSessionCreate:
      type: object
      additionalProperties: false
      properties:
        assistant_id:
          type: string
          format: uuid
          description: >
            Optional (additive; ADR-0011 §5). Start the session from an assistant:
            the server resolves the assistant, pins its current published version,
            and stamps both `assistant_id`/`assistant_version_id` on the session,
            injecting its instructions/tool-allowlist/knowledge-scope into the
            existing chat runtime. Omitted ⇒ an ad-hoc session, unchanged. A
            cross-tenant / non-owned / non-granted id → 404; a non-published or
            disabled assistant → 422.

        title: { type: string, maxLength: 200 }
        model:
          type: string
          description: A model id from GET /models; omitted = server default.

    ChatSessionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 200 }
        model: { type: string }

    ChatSession:
      type: object
      additionalProperties: false
      required: [id, title, model, owner_id, message_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        model: { type: string, description: The session's default model id. }
        owner_id: { type: string, format: uuid }
        message_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatSession" }
        next_cursor:
          type: [string, "null"]

    MessageRole:
      type: string
      enum: [user, assistant, system]

    Citation:
      type: object
      additionalProperties: false
      description: >
        A clickable, passage-level reference (spec 0004 INV-3). Resolves to a
        document the caller is permitted to see and a character span within it.


        Permission is re-checked on every READ, not only at the time the citation
        was written (#536): a grant revoked after the answer was produced must not
        keep disclosing the passage through the transcript. When the caller can no
        longer retrieve the cited document, `redacted` is true and the disclosing
        fields (`snippet`, `document_name`) come back empty — the shell is kept so
        a claim's provenance is still visible as "source no longer available"
        rather than the citation silently vanishing.
      required: [id, document_id, document_name, chunk_id, snippet, char_start, char_end]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_name: { type: string }
        chunk_id: { type: string, format: uuid }
        snippet: { type: string, description: The cited passage text. }
        char_start: { type: integer, minimum: 0 }
        char_end: { type: integer, minimum: 0 }
        score:
          type: number
          description: Optional retrieval/rerank score.
        redacted:
          type: boolean
          default: false
          description: >
            True when the caller may no longer retrieve the cited document, in
            which case `snippet` and `document_name` are empty. Optional and
            defaulting to false so existing clients are unaffected.

    MessageToolInvocation:
      type: object
      additionalProperties: false
      description: >
        One governed tool call that contributed to an assistant message (#377) —
        surfaced so a settled answer's tool activity stays visible in the thread,
        not only in the audit log (mission: auditable in place). Carries the tool
        name and outcome only: call arguments are never stored raw (the trace
        keeps a non-reversible hash — spec 0004 §2.4 discipline).
      required: [id, tool_name, ok, duration_ms, created_at]
      properties:
        id: { type: string, format: uuid }
        tool_name: { type: string }
        ok:
          type: boolean
          description: False for a governance denial or a tool failure.
        error:
          type: [string, "null"]
          description: Stable machine-readable code when ok=false (never a raw vendor string).
        result_summary:
          type: [string, "null"]
          maxLength: 300
          description: >
            Short handler-produced result line ("3 passages", "13 documents") —
            what the tool returned, in user-safe form. Never raw arguments,
            payloads, or vendor text. Null when the handler produced none.
        duration_ms: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }

    Message:
      type: object
      additionalProperties: false
      required: [id, session_id, role, content, citations, tool_invocations, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/MessageRole" }
        content: { type: string }
        model:
          type: string
          description: Model that produced an assistant message (null for user).
        citations:
          type: array
          description: Passage-level citations (assistant messages only).
          items: { $ref: "#/components/schemas/Citation" }
        tool_invocations:
          type: array
          description: >
            Governed tool calls behind an assistant message, oldest first
            (empty for user messages) (#377).
          items: { $ref: "#/components/schemas/MessageToolInvocation" }
        question:
          $ref: "#/components/schemas/AskUserQuestion"
          description: >
            Present only on an assistant turn that ended by asking the user a
            clarifying question (spec 0006 #429, finishReason=ask_user). The UI
            re-renders the options from here after reload; they stay active only
            while this is the conversation's last message. The reply is an
            ordinary SendMessageRequest.
        created_at: { type: string, format: date-time }

    AskUserQuestion:
      type: object
      additionalProperties: false
      description: >
        A clarifying question the model asked instead of answering (spec 0006
        #429). Mirrors the WS ChatAskUser payload (minus messageId — it rides
        the owning Message). The question text is also the message content.
      required: [question, options, allow_free_text]
      properties:
        question: { type: string }
        options:
          type: array
          minItems: 2
          maxItems: 4
          description: >
            Mutually exclusive choices; clicking one sends its label verbatim
            as the next user message.
          items: { $ref: "#/components/schemas/AskUserOption" }
        allow_free_text:
          type: boolean
          description: Whether a typed custom reply is a sanctioned answer path.

    AskUserOption:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string }
        description:
          type: string
          description: Optional one-line elaboration shown under the label.

    MessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_cursor:
          type: [string, "null"]

    SessionUsageTotals:
      type: object
      additionalProperties: false
      description: >
        Summed per-answer llm_usage for one session (spec 0007 #429). `answers`
        is how many produced answers the sums cover; all zero before the first.
      required:
        [
          answers,
          prompt_tokens,
          completion_tokens,
          total_tokens,
          cached_prompt_tokens,
          cache_write_tokens,
        ]
      properties:
        answers: { type: integer, minimum: 0 }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cached_prompt_tokens: { type: integer, minimum: 0 }
        cache_write_tokens: { type: integer, minimum: 0 }

    SessionUsageLast:
      type: object
      additionalProperties: false
      description: The most recent answer's usage record (spec 0007 #429).
      required:
        [
          prompt_tokens,
          completion_tokens,
          total_tokens,
          cached_prompt_tokens,
          cache_write_tokens,
        ]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        cached_prompt_tokens: { type: integer, minimum: 0 }
        cache_write_tokens: { type: integer, minimum: 0 }
        context_prompt_tokens:
          type: integer
          minimum: 0
          description: >
            The final answer-loop turn's prompt size — actual window occupancy
            for the context meter, vs prompt_tokens' billing sum across all
            loop turns (+ the suggestions call). Additive; absent on legacy
            rows or when the provider reported no usage (fall back to
            prompt_tokens).

    SessionUsage:
      type: object
      additionalProperties: false
      description: >
        A session's token/context accounting (spec 0007 #429). The context meter
        reads `last.prompt_tokens / input_budget_tokens` as window utilization;
        `window_known=false` means the model was absent from the model map and
        the configured conservative fallback window was used.
      required: [model, totals, input_budget_tokens, window_known]
      properties:
        model:
          type: string
          description: >
            The model id the budget was computed for (public form): the model
            that produced the LAST answer when one exists (per-turn overrides
            included — #434 NEW-2), else the session default.
        totals: { $ref: "#/components/schemas/SessionUsageTotals" }
        last:
          $ref: "#/components/schemas/SessionUsageLast"
          description: Absent until the session has produced at least one answer.
        input_budget_tokens:
          type: integer
          minimum: 1
          description: >
            The input-token budget the context assembler grants this model
            (window − output headroom − safety margin — the same formula answers
            are assembled under).
        window_known: { type: boolean }

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        model:
          type: string
          description: Override the session model for this turn (a GET /models id).
        document_ids:
          type: array
          maxItems: 20
          description: >
            Pinned documents (spec 0007 #429): passage retrieval for THIS answer
            narrows to these ids — an additional filter over the caller's
            allow-set (INV-2 still applies inside retrieval; an id the caller
            cannot access contributes nothing and discloses nothing, so ids are
            deliberately not validated at send time). Additive; omitted/empty ⇒
            unchanged behavior.
          items: { type: string, format: uuid }
        collection_ids:
          type: array
          description: Restrict retrieval to these collections; omitted = all permitted docs.
          items: { type: string, format: uuid }

    SendMessageResponse:
      type: object
      additionalProperties: false
      required: [message, stream_id]
      properties:
        message:
          allOf: [{ $ref: "#/components/schemas/Message" }]
          description: The persisted user message.
        stream_id:
          type: string
          description: Subscribe to this WebSocket stream id for the assistant answer.

    # --- Models -------------------------------------------------------------
    ModelTier:
      type: string
      description: Picker grouping.
      enum: [frontier, fast, oss]

    ChatModelInfo:
      type: object
      additionalProperties: false
      required: [id, label, provider, tier, is_default]
      properties:
        id: { type: string, description: Model id passed to chat (e.g. anthropic/claude-opus-4.8). }
        label: { type: string, description: Display name for the picker. }
        provider: { type: string, description: e.g. anthropic, openai, google, deepseek, qwen. }
        tier: { $ref: "#/components/schemas/ModelTier" }
        is_default: { type: boolean }
        description: { type: string }

    ModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatModelInfo" }

    # --- Search (M2, #80) ---------------------------------------------------
    ResultSource:
      type: string
      description: >
        Where a result originated. `upload` = a user-uploaded document; `chat` =
        a prior chat message; `connector` = an external connected source (the
        connector framework is post-MVP, spec 0004 §2.2 — the value is reserved).
      enum: [upload, chat, connector]

    PermissionState:
      type: string
      description: >
        Per-result permission outcome. Permission-trimmed results are normally
        `allowed`; `restricted` is for results surfaced as metadata-only (the
        caller may see that it exists but not its full content). Passages the
        caller may not see at all are never returned — they are counted in
        `hidden_count` instead (spec 0004 INV-2).
      enum: [allowed, restricted]

    MatchSpan:
      type: object
      additionalProperties: false
      description: A character span within `snippet` that matched the query (for highlighting).
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }

    SearchResult:
      type: object
      additionalProperties: false
      description: >
        One permission-trimmed ranked result. Always within the caller's tenant
        and effective allow-set (spec 0004 INV-1/INV-2).
      required:
        [id, title, snippet, match_spans, why_matched, source, type, permission, last_indexed]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        snippet: { type: string, description: Excerpt of the matched passage. }
        match_spans:
          type: array
          description: Character spans within `snippet` that matched the query.
          items: { $ref: "#/components/schemas/MatchSpan" }
        why_matched:
          type: string
          description: Human-readable explanation of why this result ranked (e.g. "semantic + title").
        source: { $ref: "#/components/schemas/ResultSource" }
        type:
          type: string
          description: Content type of the result (e.g. document, message).
        owner:
          type: [string, "null"]
          format: uuid
          description: Owning principal id, when known (null for system/connector content).
        last_indexed:
          type: string
          format: date-time
          description: Freshness — when this result was last indexed.
        permission: { $ref: "#/components/schemas/PermissionState" }
        document_id:
          type: string
          format: uuid
          description: Source document id when the result resolves to a document (for click-through).
        score:
          type: number
          description: Optional retrieval/rerank score.

    SearchCitation:
      type: object
      additionalProperties: false
      description: >
        A citation backing the direct answer. References a passage that is present
        in this response's `results` (by `result_id`) so the answer can never cite
        a passage the caller could not retrieve (spec 0004 INV-3).
      required: [result_id]
      properties:
        result_id:
          type: string
          format: uuid
          description: Id of the SearchResult this citation refers to.
        snippet:
          type: string
          description: The specific cited passage text (a substring of the result snippet).
        char_start: { type: integer, minimum: 0 }
        char_end: { type: integer, minimum: 0 }

    DirectAnswer:
      type: object
      additionalProperties: false
      description: >
        An optional synthesized answer. Present only when the permitted results
        support it; every claim is backed by `citations` (spec 0004 INV-3).
      required: [text, citations]
      properties:
        text: { type: string, description: The synthesized answer (rendered as sanitized markdown). }
        citations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SearchCitation" }

    SearchResponse:
      type: object
      additionalProperties: false
      required: [query, results, hidden_count]
      properties:
        query: { type: string, description: The query that produced this page (echoed back). }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        direct_answer:
          allOf: [{ $ref: "#/components/schemas/DirectAnswer" }]
          description: Optional cited answer; omitted when nothing permitted answers the query.
        hidden_count:
          type: integer
          minimum: 0
          description: >
            How many otherwise-matching results were withheld because they are
            outside the caller's permissions (spec 0004 INV-2). Lets the UI
            disclose the trim without leaking the hidden content.
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # --- Audit (M2, #80) ----------------------------------------------------
    AuditEventType:
      type: string
      description: Audit event taxonomy (spec 0004 §2.4).
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - collection.created
        - document.uploaded
        - document.viewed
        - document.downloaded
        - document.deleted
        - retrieval.query
        - answer.generated
        - permission.denied
        - group.created
        - group.updated
        - group.deleted
        - group.member_added
        - group.member_removed
        - action.requested
        - action.approved
        - action.executed

    AuditDecision:
      type: string
      description: The outcome recorded for the event (spec 0004 §2.4 `outcome`).
      enum: [allowed, denied, error]

    AuditCandidate:
      type: object
      additionalProperties: false
      description: >
        One retrieval candidate considered for a decision, and whether it was
        allowed into the result set or excluded — with the reason. This is the
        provenance that makes a permission/answer decision reviewable (spec 0004
        §2.4: retrieval.query / answer.generated carry retrieved doc ids).
      required: [resource_id, disposition, reason]
      properties:
        resource_id:
          type: string
          description: Id of the candidate passage/document/chunk considered.
        disposition:
          type: string
          enum: [allow, exclude]
          description: Whether the candidate was allowed into the result set or excluded.
        reason:
          type: string
          description: Why it was allowed or excluded (e.g. "in allow-set", "owner mismatch").
        score:
          type: number
          description: Optional retrieval/rerank score for the candidate.

    AuditProvenance:
      type: object
      additionalProperties: false
      description: Why the decision was made — candidate dispositions plus the raw recorded payload.
      required: [candidates]
      properties:
        candidates:
          type: array
          description: The candidates considered, each allowed or excluded with a reason.
          items: { $ref: "#/components/schemas/AuditCandidate" }
        raw:
          type: object
          additionalProperties: true
          description: The raw recorded metadata payload for the event (model id, query hash, etc.).

    AuditEvent:
      type: object
      additionalProperties: false
      description: One append-only audit event (spec 0004 §2.4).
      required: [id, ts, actor, tenant_id, event_type, decision, provenance]
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time, description: Event time (UTC ISO-8601). }
        actor:
          type: string
          description: The acting principal — a user id, or `system` / `anonymous`.
        tenant_id: { type: string, format: uuid }
        event_type: { $ref: "#/components/schemas/AuditEventType" }
        resource_id:
          type: [string, "null"]
          description: The resource the event touched, when applicable.
        decision: { $ref: "#/components/schemas/AuditDecision" }
        provenance: { $ref: "#/components/schemas/AuditProvenance" }

    AuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor:
          type: [string, "null"]

    # --- Admin (M2, #80) ----------------------------------------------------
    Member:
      type: object
      additionalProperties: false
      description: A tenant member and their role(s) for the admin roster.
      required: [id, email, role, email_attested_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: array
          description: The member's tenant roles (MVP RBAC, spec 0004 §2.3).
          items: { type: string, enum: [member, admin, security] }
        email_attested_at:
          type: [string, "null"]
          format: date-time
          description: >
            When a tenant admin attested this member's email identity for
            connector-ACL mapping (ADR-0019 §2), or null — unattested members
            never receive mirrored connector access.

    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_cursor:
          type: [string, "null"]

    Group:
      type: object
      additionalProperties: false
      description: >
        A tenant-scoped set of users an admin manages (ADR-0022). A group confers
        nothing on its own - it only makes a grant to that group apply to its
        members; roles still decide what a user may *do*.
      required: [id, name, kind, member_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        kind:
          type: string
          enum: [user, system]
          description: >
            `user` groups are created and populated by an admin. `system` is the
            tenant's single "All members" group, which expresses tenant-wide
            visibility: it cannot be renamed, deleted or populated, and its
            membership is derived rather than stored (ADR-0022 section 3).
        member_count:
          type: [integer, "null"]
          description: >
            How many users are explicitly in the group, or **null** for the
            `system` group - whose membership is derived, so it has nothing to
            count and every user in the tenant belongs. `null` is not zero.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupList:
      type: object
      additionalProperties: false
      description: >
        Every group in the tenant, system group first then by name. Not paginated
        - a tenant has few groups.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Group" }

    GroupCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: >
            Trimmed before storage and unique per tenant case-insensitively
            ("Tax Team" and "tax team" are the same group).

    GroupUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    GroupMemberAdd:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: A user in the caller's tenant; anyone else is 404 (INV-1).

    GroupMemberList:
      type: object
      additionalProperties: false
      description: >
        The users explicitly in a group, ordered by email. Empty for the `system`
        group, whose membership is derived rather than enumerated.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    ModelGovernanceEntry:
      type: object
      additionalProperties: false
      description: One allowed model and the governance tier it maps to.
      required: [model_id, tier]
      properties:
        model_id: { type: string, description: A model id (e.g. anthropic/claude-opus-4.8). }
        tier:
          type: string
          description: The governance tier this model is approved at.
        label: { type: string, description: Display name for the admin console. }

    ModelGovernance:
      type: object
      additionalProperties: false
      description: Read-only model-governance view for the admin console (#80).
      required: [allowed_models, tiers]
      properties:
        allowed_models:
          type: array
          description: The models permitted for this tenant, with their governance tier.
          items: { $ref: "#/components/schemas/ModelGovernanceEntry" }
        tiers:
          type: array
          description: The governance tiers referenced by allowed_models.
          items:
            type: object
            additionalProperties: false
            required: [id, description]
            properties:
              id: { type: string }
              description: { type: string }

    RiskTier:
      type: object
      additionalProperties: false
      description: One read-before-write risk tier (spec 0004 §2.5).
      required: [tier, description, approval]
      properties:
        tier:
          type: string
          enum: [T0, T1, T2, T3]
        description: { type: string, description: What this tier means / example actions. }
        approval:
          type: string
          description: The approval this tier requires (e.g. "none", "owner", "human approval + risk tier").

    RiskTierList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RiskTier" }

    TenantSettings:
      type: object
      additionalProperties: false
      description: >
        The admin-configurable per-tenant settings (issue #148). `max_tool_turns`
        is the EFFECTIVE chat tool-turn budget — the per-tenant override if set,
        else the system default — and `max_tool_turns_is_default` says which.
      required: [max_tool_turns, max_tool_turns_is_default]
      properties:
        max_tool_turns:
          type: integer
          minimum: 1
          maximum: 50
          description: >
            How many tool-calling turns the grounded answer runtime may take
            before it forces a final synthesis. A "turn" is one streamed
            completion that may request tools.
        max_tool_turns_is_default:
          type: boolean
          description: True when no per-tenant override is set and the system default is in force.
        fallback_models:
          type: array
          items: { type: string }
          maxItems: 3
          description: >
            The tenant's ordered turn-failover model list (ADR-0016 §4, #413):
            when an answer's model exhausts its bounded retry budget on
            transient provider faults, the runtime fails over down this list.
            Empty = no fallback configured (an exhausted answer errors, the
            pre-#413 behavior).
      # fallback_models is additive-optional in responses (older servers omit it).

    TenantSettingsUpdate:
      type: object
      additionalProperties: false
      description: >
        Set or clear the per-tenant chat tool-turn budget override (issue #148).
        `max_tool_turns` is required so the intent is explicit. `fallback_models`
        (#413) is PATCH-shaped: omitted/null leaves the stored list unchanged
        (pre-#413 clients keep working); [] clears it; a list (each id validated
        against the same allow-list the chat send path uses — the config
        registry or the tenant's enabled provider models) replaces it.
      required: [max_tool_turns]
      properties:
        max_tool_turns:
          type: [integer, "null"]
          minimum: 1
          maximum: 50
          description: >
            An integer in 1–50 sets the per-tenant override; `null` clears it so
            the system default applies again (the system default is configured
            server-side, `CHAT_MAX_TOOL_TURNS`).
        fallback_models:
          type: [array, "null"]
          items: { type: string }
          maxItems: 3
          description: >
            Ordered turn-failover model ids (#413). Omitted/null = unchanged;
            [] = clear; at most 3 entries; an unknown/unavailable id is a 422
            and nothing is written.

    # --- Per-tenant application logo (admin branding) -----------------------
    TenantBranding:
      type: object
      additionalProperties: false
      description: >
        The tenant's application logo (admin branding). `logo_url` is a short-TTL
        presigned GET URL for the tenant's uploaded logo, or null when none is set
        (the shell renders the default brand mark). The current state is also
        readable via `GET /auth/me` (`logo_url`), so no separate GET is needed.
      required: [logo_url]
      properties:
        logo_url:
          type: [string, "null"]
          description: Presigned GET URL for the tenant's logo, or null for the default mark.

    # --- Tool governance policy (per-tenant enable + approval, #223) ---------
    ToolPolicyEntry:
      type: object
      additionalProperties: false
      description: >
        The effective governance for one registered tool in this tenant (issue
        #223). `risk_tier` is the tool's static tier (spec 0004 §2.5), for display.
        `enabled` and `requires_approval` are the effective per-tenant flags — an
        admin override if one exists, else the tool's built-in default. A
        `requires_approval` tool executes only when `enabled` AND NOT
        `requires_approval` (the admin pre-approved it); otherwise the policy-driven
        approval gate denies it (deny-by-default).
      required: [tool_name, risk_tier, read_only, enabled, requires_approval, is_default]
      properties:
        tool_name:
          type: string
          description: The registered tool name (the registry's single source of truth).
        risk_tier: { $ref: "#/components/schemas/RiskTier/properties/tier" }
        read_only:
          type: boolean
          description: True for a read-only (T0) tool; write-tier tools are not read-only.
        enabled:
          type: boolean
          description: Whether the tool is enabled for this tenant.
        requires_approval:
          type: boolean
          description: >
            Whether an invocation still needs approval. For a write-tier tool this
            is the admin's pre-approval switch — `false` (with `enabled` true) lets
            the approval gate execute it; `true` keeps it gated (denied).
        is_default:
          type: boolean
          description: >
            True when no per-tenant admin override exists and the tool's built-in
            default flags are in force (deny-by-default for a `requires_approval`
            tool).

    ToolPolicy:
      type: object
      additionalProperties: false
      description: >
        The per-tenant tool-governance policy: one entry per registered tool
        (issue #223), deterministically ordered by tool name.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ToolPolicyEntry" }

    # --- Tool catalogue (member-readable, read-only; #505) ------------------
    ToolCatalogEntry:
      type: object
      additionalProperties: false
      description: >
        One registered tool as the assistant builder sees it (issue #505):
        the registry's static `description` / `risk_tier` / `read_only` plus this
        tenant's effective `enabled` / `requires_approval` flags. A `risk_tier` above
        `T0` is side-effecting and must be presented as such; `enabled: false` means
        the tenant's admin has switched the tool off, so it must be shown as
        unavailable rather than offered as a selectable control.
      required: [tool_name, description, risk_tier, read_only, enabled, requires_approval]
      properties:
        tool_name:
          type: string
          description: The registered tool name, as persisted into `Assistant.toolAllowlist`.
        description:
          type: string
          description: The registry's human-readable summary of what the tool does.
        risk_tier: { $ref: "#/components/schemas/RiskTier/properties/tier" }
        read_only:
          type: boolean
          description: True for a read-only (T0) tool; write-tier tools are not read-only.
        enabled:
          type: boolean
          description: Whether the tool is enabled for this tenant (an admin switch).
        requires_approval:
          type: boolean
          description: >
            Whether an invocation is still approval-gated for this tenant. Selecting
            such a tool is allowed (it is a configuration-time grant), but the UI must
            say so: the run-time gate, not the allow-list, decides execution.
        # NOTE: `is_default` is deliberately NOT on this schema. It records whether an
        # admin has ever overridden the row — governance provenance with no consumer in
        # the builder, and this read is available to every tenant MEMBER. Minimum
        # disclosure for a widened audience; it stays on the admin-only
        # `ToolPolicyEntry`.

    ToolCatalog:
      type: object
      additionalProperties: false
      description: >
        Every registered tool with this tenant's effective governance, ordered by
        `tool_name` (issue #505). Read-only; it grants nothing.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ToolCatalogEntry" }

    ToolPolicyUpdate:
      type: object
      additionalProperties: false
      description: >
        Set the per-tenant `enabled` / `requires_approval` flags for one registered
        tool (issue #223). Both flags are required so the stored override is
        explicit. An unknown `tool_name` is rejected 422 (INV-8).
      required: [tool_name, enabled, requires_approval]
      properties:
        tool_name:
          type: string
          minLength: 1
          description: The registered tool name to set the policy for (must exist in the registry).
        enabled:
          type: boolean
          description: Whether the tool is enabled for this tenant.
        requires_approval:
          type: boolean
          description: >
            Whether an invocation still needs approval. Set `false` (with `enabled`
            true) to pre-approve a write-tier tool so the approval gate executes it.

    # --- Sandbox governance policy (ADR-0020 enablement/packages + legacy fields) --
    SandboxPolicy:
      type: object
      additionalProperties: false
      description: >
        The per-tenant code-execution sandbox policy. `enabled` is deny-by-default
        — a tenant with no stored policy has code execution DISABLED (and every value
        is the config ceiling). ADR-0020 enforces enablement and package policy; egress
        and cap fields remain compatibility-only and are not enforced for reusable sessions.
      required:
        [
          enabled,
          allowed_packages,
          denied_packages,
          egress_allowed,
          egress_allowlist,
          max_runtime_s,
          max_memory_mb,
          daily_runtime_cap_s,
          max_concurrency,
          is_default,
          max_runtime_s_ceiling,
          max_memory_mb_ceiling,
          daily_runtime_cap_s_ceiling,
          max_concurrency_ceiling,
        ]
      properties:
        enabled:
          type: boolean
          description: >
            Whether code execution is enabled for this tenant. Deny-by-default: false
            until an admin enables it AND the deploy-wide kill-switch is on.
        allowed_packages:
          type: array
          items: { type: string }
          description: >
            Directly requested package distributions the sandbox may install for this
            tenant (a top-level allowlist). Dependencies of an admitted requirement are
            part of that grant. An empty list means the curated base image only.
        denied_packages:
          type: array
          items: { type: string }
          description: Directly requested packages explicitly denied for this tenant (takes precedence over the allowlist).
        egress_allowed:
          type: boolean
          deprecated: true
          description: >
            Compatibility-only ADR-0013 value. ADR-0020 model-code containers are
            always offline regardless of this value.
        egress_allowlist:
          type: array
          deprecated: true
          items: { type: string }
          description: >
            Compatibility-only ADR-0013 value; ADR-0020 does not open these targets.
        max_runtime_s:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only value; reusable sessions have no automatic timeout.
        max_memory_mb:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only value; reusable sessions have no memory cap.
        daily_runtime_cap_s:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only value; reusable sessions have no daily runtime cap.
        max_concurrency:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only value; reusable sessions do not enforce this quota.
        is_default:
          type: boolean
          description: >
            True when no per-tenant policy is stored — code execution is off and every
            cap is the deploy-wide config default (deny-by-default).
        max_runtime_s_ceiling:
          type: integer
          minimum: 1
          description: The deploy-wide per-run wall-clock cap a per-tenant value cannot exceed.
        max_memory_mb_ceiling:
          type: integer
          minimum: 1
          description: The deploy-wide per-run memory cap a per-tenant value cannot exceed.
        daily_runtime_cap_s_ceiling:
          type: integer
          minimum: 1
          description: The deploy-wide daily-runtime cap a per-tenant value cannot exceed.
        max_concurrency_ceiling:
          type: integer
          minimum: 1
          description: The deploy-wide concurrency cap a per-tenant value cannot exceed.

    SandboxPolicyUpdate:
      type: object
      additionalProperties: false
      description: >
        Set per-tenant enablement and package policy. All legacy fields remain required
        for wire compatibility but ADR-0020 does not enforce egress or cap values. An
        out-of-range compatibility value is still **422** (INV-8).
      required:
        [
          enabled,
          allowed_packages,
          denied_packages,
          egress_allowed,
          egress_allowlist,
          max_runtime_s,
          max_memory_mb,
          daily_runtime_cap_s,
          max_concurrency,
        ]
      properties:
        enabled:
          type: boolean
          description: Enable or disable code execution for this tenant.
        allowed_packages:
          type: array
          items: { type: string, minLength: 1 }
          description: Directly requested packages allowed for install (top-level allowlist; empty ⇒ base image only).
        denied_packages:
          type: array
          items: { type: string, minLength: 1 }
          description: Directly requested packages explicitly denied (takes precedence over the allowlist).
        egress_allowed:
          type: boolean
          deprecated: true
          description: Compatibility-only; ADR-0020 sessions are always offline.
        egress_allowlist:
          type: array
          deprecated: true
          items: { type: string, minLength: 1 }
          description: >
            Compatibility-only; ADR-0020 does not open these targets.
        max_runtime_s:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only; no automatic timeout is enforced.
        max_memory_mb:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only; no memory cap is enforced.
        daily_runtime_cap_s:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only; no daily runtime cap is enforced.
        max_concurrency:
          type: integer
          minimum: 1
          deprecated: true
          description: Compatibility-only; no tenant concurrency quota is enforced.

    # --- Assistant autonomy cap (per-tenant ceiling, #218) ------------------
    AutonomyPolicy:
      type: object
      additionalProperties: false
      description: >
        The per-tenant assistant autonomy cap (issue #218, ADR-0011 §3). `max_autonomy`
        is the ceiling an assistant's EFFECTIVE autonomy is `min`'d to. `is_default` is
        true when no cap is stored — there is no ceiling, so `max_autonomy` is reported
        as the top of the scale (`act_auto`) and every assistant runs at its own
        configured level. `levels` lists the choice set in ascending order.
      required: [max_autonomy, is_default, levels]
      properties:
        max_autonomy: { $ref: "#/components/schemas/AutonomyLevel" }
        is_default:
          type: boolean
          description: True when no per-tenant cap is stored (no ceiling — the permissive default).
        levels:
          type: array
          items: { $ref: "#/components/schemas/AutonomyLevel" }
          description: The autonomy values in ascending order (suggest … act_auto).

    AutonomyPolicyUpdate:
      type: object
      additionalProperties: false
      description: >
        Set the per-tenant assistant autonomy cap (issue #218). `max_autonomy` must be
        a valid `AutonomyLevel` (an unknown value → 422, INV-8). The cap only ever
        NARROWS — it lowers an assistant's effective autonomy, never raises it.
      required: [max_autonomy]
      properties:
        max_autonomy: { $ref: "#/components/schemas/AutonomyLevel" }

    # --- Sources (connector framework + Web URL source, ADR-0009 / #108) ----
    SourceType:
      type: string
      description: >
        The connector kind. `web` is the first connector (ADR-0009 §2): paste a
        public URL, we ingest it — zero source-side setup. `gdrive` is the first
        **managed** OAuth connector (ADR-0019 §5): read-only Google Drive with
        mirrored per-file ACLs. Future connectors (Slack, Confluence…) are
        additive via the auto-discovered registry and add their own values here,
        each behind its own ADR.
      enum: [web, gdrive]

    WebSourceMode:
      type: string
      description: >
        How a `web` source's URL is interpreted (ADR-0009 §2). `page` = one URL →
        one document; `feed` = an RSS/Atom feed → many documents (bounded);
        `sitemap` = a sitemap.xml → many documents (bounded). The server detects
        the mode from the fetched content.
      enum: [page, feed, sitemap]

    SourceStatus:
      type: string
      description: >
        Sync lifecycle for the connector health grid (ADR-0009 §4, ADR-0019 §1).
        `pending_auth` = a managed source was created but its OAuth consent has
        not completed (run `connectSource`); `pending` = authorized (or web),
        first sync not yet run; `syncing` = a sync is in flight; `ready` = last
        sync succeeded and content is indexed; `error` = the last sync failed
        (see `last_error`; a dead OAuth grant additionally sets
        `reauthorize_required`).
      enum: [pending_auth, pending, syncing, ready, error]

    SourceConfig:
      description: >
        A connector configuration — the additive union of every per-type config,
        discriminated by `mode` (the one property all variants carry; the web
        modes and the gdrive modes are disjoint value sets). Pre-0.7.0 clients
        keep this component; the discriminated `Source` branches bind the
        specific shapes directly (`WebSource.config` → `WebSourceConfig`,
        `GdriveSource.config` → `GdriveSourceConfig`), so cross-type mixes stay
        schema-invalid there.
      oneOf:
        - { $ref: "#/components/schemas/WebSourceConfig" }
        - { $ref: "#/components/schemas/GdriveMyDriveConfig" }
        - { $ref: "#/components/schemas/GdriveFolderConfig" }
        - { $ref: "#/components/schemas/GdriveSharedDriveConfig" }
      discriminator:
        propertyName: mode
        mapping:
          page: "#/components/schemas/WebSourceConfig"
          feed: "#/components/schemas/WebSourceConfig"
          sitemap: "#/components/schemas/WebSourceConfig"
          my_drive: "#/components/schemas/GdriveMyDriveConfig"
          folder: "#/components/schemas/GdriveFolderConfig"
          shared_drive: "#/components/schemas/GdriveSharedDriveConfig"

    WebSourceConfig:
      type: object
      additionalProperties: false
      description: >
        `web` connector configuration: the fetched `url` and the detected `mode`.
      required: [url, mode]
      properties:
        url:
          type: string
          format: uri
          description: The public URL this source ingests (http/https only; SSRF-checked).
        mode: { $ref: "#/components/schemas/WebSourceMode" }

    GdriveSourceConfig:
      description: >
        `gdrive` connector configuration (ADR-0019 §5), discriminated by `mode`
        — each variant is a closed shape, so a missing conditional id, or an id
        on a mode that does not take it, is schema-invalid (422 `invalid_config`,
        INV-8).
      oneOf:
        - { $ref: "#/components/schemas/GdriveMyDriveConfig" }
        - { $ref: "#/components/schemas/GdriveFolderConfig" }
        - { $ref: "#/components/schemas/GdriveSharedDriveConfig" }
      discriminator:
        propertyName: mode
        mapping:
          my_drive: "#/components/schemas/GdriveMyDriveConfig"
          folder: "#/components/schemas/GdriveFolderConfig"
          shared_drive: "#/components/schemas/GdriveSharedDriveConfig"

    GdriveMyDriveConfig:
      type: object
      additionalProperties: false
      description: Sync the connected account's entire My Drive (no ids permitted).
      required: [mode]
      properties:
        mode: { type: string, enum: [my_drive] }

    GdriveFolderConfig:
      type: object
      additionalProperties: false
      description: >
        Sync a single folder. `folder_id` is required; `drive_id` additionally
        scopes a folder that lives inside a Shared Drive (its change log is then
        that drive's — ADR-0019 §3).
      required: [mode, folder_id]
      properties:
        mode: { type: string, enum: [folder] }
        folder_id:
          type: string
          minLength: 1
          description: The Drive folder id to sync.
        drive_id:
          type: string
          minLength: 1
          description: The containing Shared Drive id, when the folder is in one.

    GdriveSharedDriveConfig:
      type: object
      additionalProperties: false
      description: Sync a whole Shared Drive. `drive_id` is required; `folder_id` is not permitted.
      required: [mode, drive_id]
      properties:
        mode: { type: string, enum: [shared_drive] }
        drive_id:
          type: string
          minLength: 1
          description: The Shared Drive id to sync.

    Source:
      description: >
        One connected source, tenant-scoped (ADR-0009 §4/§5, spec 0004
        INV-1/INV-2) — **discriminated by `type`**. The `web` branch is the
        pre-0.7.0 wire, byte-compatible (no new fields). The `gdrive` branch is
        ACL-mirrored (ADR-0019 §2) — its content is retrievable only via the
        fresh mirrored source ACL; ownership and Lumen grants do not widen it —
        and carries the managed-source health surface as **required** fields.
      oneOf:
        - { $ref: "#/components/schemas/WebSource" }
        - { $ref: "#/components/schemas/GdriveSource" }
      discriminator:
        propertyName: type
        mapping:
          web: "#/components/schemas/WebSource"
          gdrive: "#/components/schemas/GdriveSource"

    WebSource:
      type: object
      additionalProperties: false
      description: >
        A `web` source — owner-scoped (only the owner retrieves its content).
        Exactly the pre-0.7.0 `Source` shape with `type` pinned to `web`.
      required: [id, type, config, status, indexed_count, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [web] }
        config: { $ref: "#/components/schemas/WebSourceConfig" }
        status: { $ref: "#/components/schemas/SourceStatus" }
        indexed_count:
          type: integer
          minimum: 0
          description: Number of documents this source has ingested (0 until the first sync completes).
        last_synced_at:
          type: [string, "null"]
          format: date-time
          description: When the last successful sync finished (null before the first sync).
        last_error:
          type: string
          description: Failure reason when status is error.
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GdriveSource:
      type: object
      additionalProperties: false
      description: >
        A managed `gdrive` source (ADR-0019). The health-surface fields are
        required (nullable where the value can be absent) so a generated client
        can rely on their presence without narrowing hacks.
      required: [id, type, config, status, indexed_count, owner_id,
                 connected_account, acl_synced_at, unmapped_acl_count,
                 reauthorize_required, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [gdrive] }
        config: { $ref: "#/components/schemas/GdriveSourceConfig" }
        status: { $ref: "#/components/schemas/SourceStatus" }
        indexed_count:
          type: integer
          minimum: 0
          description: Number of documents this source has ingested (0 until the first sync completes).
        last_synced_at:
          type: [string, "null"]
          format: date-time
          description: When the last successful sync finished (null before the first sync).
        last_error:
          type: string
          description: Failure reason when status is error.
        connected_account:
          oneOf:
            - { $ref: "#/components/schemas/ConnectedAccount" }
            - type: "null"
          description: >
            The provider account this source is connected as (null before OAuth
            completes). Never carries tokens.
        acl_synced_at:
          type: [string, "null"]
          format: date-time
          description: >
            When the source's mirrored ACLs were last refreshed (ADR-0019 §2;
            null before the first sync). Content whose ACL is older than the
            freshness window is denied at retrieval.
        unmapped_acl_count:
          type: [integer, "null"]
          minimum: 0
          description: >
            Documents whose mirrored ACL mapped to no Lumen principal (ADR-0019
            §2 — ingested but invisible; identity attestation lights them up).
            Null before the first sync.
        reauthorize_required:
          type: boolean
          description: >
            True when the OAuth grant is dead (revoked/expired refresh token,
            ADR-0019 §1) — re-run `connectSource` to repair.
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConnectedAccount:
      type: object
      additionalProperties: false
      description: >
        The authenticated provider account of a managed source, as reported by
        the provider after consent (ADR-0019 §1 — for Drive, the authenticated
        `about.get` email). Metadata only; never token material.
      required: [email]
      properties:
        email: { type: string, format: email }

    SourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    SourceCreate:
      description: >
        Add a source, discriminated by `type`. `web` (any member): `{type: web,
        url}` — the server validates + SSRF-checks the URL (ADR-0009 §3); an
        invalid or blocked URL is 422 (INV-8). `gdrive` (**tenant admin only** —
        every managed-source mutation is admin-gated, ADR-0019 §1; a non-admin
        receives 403): `{type: gdrive, config}` — creates the row in
        `pending_auth`; run `connectSource` next to obtain the consent URL.
      oneOf:
        - { $ref: "#/components/schemas/WebSourceCreate" }
        - { $ref: "#/components/schemas/GdriveSourceCreate" }
      discriminator:
        propertyName: type
        mapping:
          web: "#/components/schemas/WebSourceCreate"
          gdrive: "#/components/schemas/GdriveSourceCreate"

    WebSourceCreate:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type: { type: string, enum: [web] }
        url:
          type: string
          format: uri
          description: The public URL to ingest (http/https only).

    GdriveSourceCreate:
      type: object
      additionalProperties: false
      required: [type, config]
      properties:
        type: { type: string, enum: [gdrive] }
        config: { $ref: "#/components/schemas/GdriveSourceConfig" }

    SourceConnectResponse:
      type: object
      additionalProperties: false
      description: >
        The provider consent URL for a managed source's OAuth flow (ADR-0019
        §1). The browser navigates there; the provider redirects back to
        `oauthCallback`. The URL carries only an **opaque single-use state
        handle** — never tokens, codes, or PKCE material minted by us.
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }

    # --- MCP servers (ADR-0012) ---------------------------------------------
    McpTransport:
      type: string
      description: >
        The remote MCP transport (ADR-0012 §1). Only remote transports ship in
        v1; `stdio`/local-process is deferred behind the code-execution sandbox
        (ADR-0013) and is rejected at registration.
      enum: [streamable_http, sse]

    McpServerStatus:
      type: string
      description: >
        Health state from the last probe (ADR-0012 §5). `pending` before the
        first successful probe, `ready` after a healthy handshake, `error` when
        the last probe failed.
      enum: [pending, ready, error]

    McpRiskTier:
      type: string
      description: >
        Inferred governance tier for a discovered tool (ADR-0012 §6, spec 0004
        §2.5). Default **T2** (approval-gated) unless the server annotates the tool
        read-only/non-destructive, which maps to **T0**. Trust is earned, never
        assumed — unannotated ⇒ T2.
      enum: [T0, T1, T2, T3]

    McpServer:
      type: object
      additionalProperties: false
      description: >
        One registered MCP server, tenant- and owner-scoped (ADR-0012 §5, spec
        0004 INV-1/INV-2). The response **never** includes the stored credential
        value — only a masked `secret_hint` (CC-C #209, AC-3). The `auth_ref`
        itself is a server-internal detail and is not exposed.
      required: [id, name, transport, endpoint_url, enabled, status, discovered_tool_count, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, description: Display name. }
        transport: { $ref: "#/components/schemas/McpTransport" }
        endpoint_url:
          type: string
          format: uri
          description: The remote MCP endpoint (https only; SSRF-checked on register and every connect).
        enabled:
          type: boolean
          description: Owner toggle — when false the server's tools are not offered to assistants.
        status: { $ref: "#/components/schemas/McpServerStatus" }
        last_health_at:
          type: [string, "null"]
          format: date-time
          description: When the last successful health probe finished (null before the first successful probe).
        last_error:
          type: [string, "null"]
          description: Safe failure reason when status is error (never contains the credential; ADR-0012 §7).
        discovered_tool_count:
          type: integer
          minimum: 0
          description: Number of tools discovered on the last successful probe (0 until first discovery).
        secret_hint:
          type: [string, "null"]
          description: >
            A **masked** hint at the stored credential (e.g. `"••••abcd"`), or null
            when no auth credential is stored. This is the ONLY credential-derived
            value ever returned — the actual secret is write-only, envelope-encrypted
            in the CC-C vault, and never serialized through any API (ADR-0012 §5,
            CC-C #209 AC-3).
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    McpServerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/McpServer" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    McpServerCreate:
      type: object
      additionalProperties: false
      description: >
        Register a remote MCP server (ADR-0012 §5). `transport` is constrained to
        the remote values (`stdio` rejected as 422 `unsupported_transport`);
        `endpoint_url` must be https and pass the SSRF check (else 422). The
        optional `auth` credential is **write-only** — stored envelope-encrypted via
        CC-C (#209) and never returned; the response carries only a masked
        `secret_hint`.
      required: [name, transport, endpoint_url]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: Display name. }
        transport: { $ref: "#/components/schemas/McpTransport" }
        endpoint_url:
          type: string
          format: uri
          description: The remote MCP endpoint (https only; SSRF-checked on register).
        auth:
          $ref: "#/components/schemas/McpServerAuth"

    McpServerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Update a registered MCP server (ADR-0012 §5). Any subset of fields; at
        least one. Rotating `auth` replaces the stored CC-C credential (write-only,
        never returned); send `auth: null` to clear it. Changing `endpoint_url`
        re-runs the https + SSRF validation (else 422).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        transport: { $ref: "#/components/schemas/McpTransport" }
        endpoint_url:
          type: string
          format: uri
          description: The remote MCP endpoint (https only; re-validated + SSRF-checked).
        enabled: { type: boolean, description: Owner toggle. }
        auth:
          oneOf:
            - $ref: "#/components/schemas/McpServerAuth"
            - type: "null"
          description: Rotate the write-only credential, or null to clear it.

    McpServerAuth:
      type: object
      additionalProperties: false
      writeOnly: true
      description: >
        Write-only auth material for the MCP endpoint (ADR-0012 §5). Sent on
        register/update, envelope-encrypted into the CC-C vault (#209) as an
        `auth_ref`, and **never** returned by any endpoint. A `bearer` token or a
        custom `header` are supported; exactly one form per registration.
      required: [type, value]
      properties:
        type:
          type: string
          enum: [bearer, header]
          description: >
            `bearer` — the value is an Authorization bearer token; `header` — the
            value is set as the named `header_name`.
        value:
          type: string
          minLength: 1
          writeOnly: true
          description: The secret value (write-only — never echoed back).
        header_name:
          type: string
          description: The header name to attach the value to (required when type is `header`).

    McpTool:
      type: object
      additionalProperties: false
      description: >
        One tool discovered from an MCP server (ADR-0012 §6). Injected into the
        CC-A registry (#207) under its namespaced name so it flows through the same
        allow-list / approval / audit path as native tools.
      required: [name, risk_tier, input_schema]
      properties:
        name:
          type: string
          description: >
            The namespaced registry name `mcp:<server_slug>:<tool>` (ADR-0012 §6) —
            stable per server, collision-free across servers and native tools.
        raw_name:
          type: string
          description: The tool's original (un-namespaced) name as advertised by the server.
        description:
          type: [string, "null"]
          description: The server-advertised tool description (may be null).
        input_schema:
          type: object
          description: >
            The tool's advertised argument JSON Schema. Model-supplied args are
            validated against this before invoke (ADR-0012 §6, INV-8); an opaque
            pass-through of the server's schema.
        risk_tier: { $ref: "#/components/schemas/McpRiskTier" }
        read_only:
          type: boolean
          description: >
            True when the server annotated the tool read-only/non-destructive
            (mapping it to T0); false/absent ⇒ defaulted to T2 (ADR-0012 §6).

    McpToolList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/McpTool" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # Single problem model for ALL errors (RFC-9457 application/problem+json).
    # Every endpoint's error responses reference this; both tiers depend on it.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
          description: A URI identifying the problem type.
        title: { type: string, description: Short, human-readable summary. }
        status: { type: integer, description: HTTP status code. }
        detail: { type: string, description: Human-readable explanation for this occurrence. }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Stable, machine-readable error code for clients to branch on.
        errors:
          type: array
          description: Field-level validation errors, when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    # --- User preferences (spec 0005) ---------------------------------------
    UserPreferences:
      type: object
      additionalProperties: false
      required: [default_model_id, custom_instructions, updated_at]
      properties:
        default_model_id:
          type: [string, "null"]
          description: >
            The caller's preferred default chat model — an id from `/models`, or
            null to use the server default. New chat sessions with no explicit model
            start from this.
        custom_instructions:
          type: [string, "null"]
          maxLength: 2000
          description: >
            A per-user free-text preamble prepended to the chat system prompt (the
            user's persona / standing context), or null for none. Composed BEFORE the
            grounding/citation contract at chat time — it can shape tone/scope but never
            removes grounding (INV-3). Capped at 2000 characters (over-limit → 422).
        updated_at:
          type: [string, "null"]
          format: date-time
          description: >
            When the caller last changed their preferences, or **null** if they
            never have (the implicit server-default state). `GET /preferences`
            returns `{ default_model_id: null, updated_at: null }` for a fresh user
            and performs no write — the row is created on the first `PATCH` (so a
            read never mutates state; "read before write", spec 0005 §2/§4).

    UserPreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        default_model_id:
          type: [string, "null"]
          description: >
            A `/models` id to set as the default, or null to clear the override
            (fall back to the server default). An unknown id → 422 `unknown_model`.
        custom_instructions:
          type: [string, "null"]
          maxLength: 2000
          description: >
            A per-user preamble to set (prepended to the chat system prompt), or null
            to clear it. Absent = leave unchanged; a value = set; null = clear. Capped
            at 2000 characters (over-limit → 422).

    # --- Saved searches (spec 0005) -----------------------------------------
    SavedSearch:
      type: object
      additionalProperties: false
      required: [id, name, query, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: The saved `/search` query (the `q` parameter).
        collection_id:
          type: [string, "null"]
          format: uuid
          description: Optional collection filter (the `/search` collection_id).
        source:
          oneOf:
            - { $ref: "#/components/schemas/ResultSource" }
            - { type: "null" }
          description: Optional source-kind filter (the `/search` source).
        type:
          type: [string, "null"]
          description: Optional content-type filter (the `/search` type).
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SavedSearchCreate:
      type: object
      additionalProperties: false
      required: [name, query]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        query: { type: string, minLength: 1, maxLength: 1000 }
        collection_id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ResultSource" }
        type: { type: string, maxLength: 100 }

    SavedSearchUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        query: { type: string, minLength: 1, maxLength: 1000 }
        collection_id: { type: [string, "null"], format: uuid }
        source:
          oneOf:
            - { $ref: "#/components/schemas/ResultSource" }
            - { type: "null" }
        type: { type: [string, "null"], maxLength: 100 }

    SavedSearchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedSearch" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # --- Search typeahead suggestions (spec 0005) ---------------------------
    SuggestionKind:
      type: string
      description: >
        What a suggestion represents. `completion` = a query the caller can run
        (from their recents/saved); `document` = a permitted document whose title
        matches; `saved_search` = one of the caller's saved searches.
      enum: [completion, document, saved_search]

    Suggestion:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: { $ref: "#/components/schemas/SuggestionKind" }
        text:
          type: string
          description: The display label / the query to run when chosen.
        document_id:
          type: [string, "null"]
          format: uuid
          description: The matched document, when kind is `document` (permitted, INV-2).
        source:
          oneOf:
            - { $ref: "#/components/schemas/ResultSource" }
            - { type: "null" }
          description: The document's source kind, when kind is `document`.
        saved_search_id:
          type: [string, "null"]
          format: uuid
          description: The matched saved search, when kind is `saved_search`.

    SuggestResponse:
      type: object
      additionalProperties: false
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Suggestion" }

    # --- Recent search history (spec 0005) ----------------------------------
    RecentSearch:
      type: object
      additionalProperties: false
      required: [query, last_used_at]
      properties:
        query: { type: string }
        last_used_at: { type: string, format: date-time }

    RecentSearchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecentSearch" }

    # --- merged schemas: AutonomyLevel, AssistantStatus, KnowledgeMode, KnowledgeScope, Assistant, AssistantCreate, AssistantUpdate, AssistantVersion, AssistantVersionConfig, AssistantPublishRequest, AssistantRollbackRequest, AssistantList, AssistantVersionList ---
    AutonomyLevel:
      type: string
      description: >
        How much an assistant may act on its own (ADR-0011 §3). Capped by the risk
        tier of its allowed tools; at MVP the product is T0/T1 only.
      enum: [suggest, draft, act_with_approval, act_auto]

    AssistantStatus:
      type: string
      description: Lifecycle status (ADR-0011 §1). A disabled assistant cannot start new sessions.
      enum: [draft, published, disabled]

    KnowledgeMode:
      type: string
      description: A retrieval source class the assistant's scope may draw from.
      enum: [company, uploaded, web, model]

    KnowledgeScope:
      type: object
      additionalProperties: false
      description: >
        The retrieval filter (ADR-0011 §1/§2). A *narrowing* set layered on top of
        the per-user INV-2 permission predicate inside `retrieval/` — it can only
        intersect, never widen, what the running principal may already retrieve.
      properties:
        collectionIds:
          type: array
          items: { type: string, format: uuid }
          description: Collections to scope retrieval to (empty ⇒ no collection narrowing).
        sourceIds:
          type: array
          items: { type: string, format: uuid }
          description: Connected sources to scope retrieval to.
        modes:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeMode" }
          description: Which source classes the scope may draw from.

    Assistant:
      type: object
      additionalProperties: false
      description: >
        A saved, named, governed chat configuration (ADR-0011 §1) — the mutable
        head. Tenant- and owner-scoped (INV-1/INV-2).
      required:
        [id, name, model, knowledgeScope, toolAllowlist, autonomyLevel, effectiveAutonomy, owner, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        description:
          type: [string, "null"]
          description: Optional human description.
        instructions:
          type: [string, "null"]
          description: System-prompt text injected at run time (persona/role; never removes grounding rules).
        model:
          type: [string, "null"]
          description: A model id from GET /models; null ⇒ the smart server default resolved at run time.
        knowledgeScope: { $ref: "#/components/schemas/KnowledgeScope" }
        toolAllowlist:
          type: array
          items: { type: string }
          description: Tool names the run may use ([] ⇒ the default retrieval tool set until CC-A lands).
        autonomyLevel: { $ref: "#/components/schemas/AutonomyLevel" }
        effectiveAutonomy:
          allOf:
            - { $ref: "#/components/schemas/AutonomyLevel" }
          description: >
            The autonomy the assistant may ACTUALLY run at after the tenant admin cap
            (min(autonomyLevel, tenant cap), issue #218). Equals autonomyLevel when no
            cap lowers it — visibility for the library/run detail.
        owner:
          type: string
          format: uuid
          description: The accountable owner's user id.
        backupOwner:
          type: [string, "null"]
          format: uuid
          description: The backup owner's user id; required before publish (ADR-0011 §4).
        status: { $ref: "#/components/schemas/AssistantStatus" }
        version:
          type: [integer, "null"]
          description: The current published head version number (null while never published).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssistantCreate:
      type: object
      additionalProperties: false
      description: >
        Create a draft assistant (ADR-0011 §1). Only `name` is required; the
        server owns `owner`/`status`/timestamps. A malformed body → 422 (INV-8).
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        instructions: { type: string }
        model:
          type: string
          description: A model id from GET /models; omitted ⇒ the smart server default.
        knowledgeScope: { $ref: "#/components/schemas/KnowledgeScope" }
        toolAllowlist:
          type: array
          items: { type: string }
        autonomyLevel: { $ref: "#/components/schemas/AutonomyLevel" }
        backupOwner:
          type: string
          format: uuid
          description: Optional at draft time; required before publish.

    AssistantUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Patch the mutable head (ADR-0011 §1). All fields optional; at least one
        must be present. A malformed body → 422 (INV-8).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"] }
        instructions: { type: [string, "null"] }
        model:
          type: [string, "null"]
          description: A model id from GET /models, or null to clear (⇒ smart server default).
        knowledgeScope: { $ref: "#/components/schemas/KnowledgeScope" }
        toolAllowlist:
          type: array
          items: { type: string }
        autonomyLevel: { $ref: "#/components/schemas/AutonomyLevel" }
        backupOwner:
          type: [string, "null"]
          format: uuid
          description: Set or clear the backup owner (must be distinct from owner, same tenant).

    AssistantVersion:
      type: object
      additionalProperties: false
      description: >
        An immutable published snapshot (ADR-0011 §1) — the full frozen definition
        a session/run pins to. Write-once; never mutated or deleted.
      required: [id, assistant_id, version, config, author, created_at]
      properties:
        id: { type: string, format: uuid }
        assistant_id: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: Monotonic per assistant (unique within the assistant).
        config:
          $ref: "#/components/schemas/AssistantVersionConfig"
        author:
          type: string
          format: uuid
          description: The user id who published (or rolled back to create) this version.
        notes:
          type: [string, "null"]
          description: Release note the author supplied.
        diff_summary:
          type: [string, "null"]
          description: Human-readable delta from the prior version (advisory).
        created_at: { type: string, format: date-time }

    AssistantVersionConfig:
      type: object
      additionalProperties: false
      description: The full frozen assistant definition captured at publish time (ADR-0011 §1).
      required: [name, model, knowledgeScope, toolAllowlist, autonomyLevel]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        instructions: { type: [string, "null"] }
        model:
          type: [string, "null"]
          description: The model id frozen at publish (null ⇒ smart server default at run time).
        knowledgeScope: { $ref: "#/components/schemas/KnowledgeScope" }
        toolAllowlist:
          type: array
          items: { type: string }
        autonomyLevel: { $ref: "#/components/schemas/AutonomyLevel" }

    AssistantPublishRequest:
      type: object
      additionalProperties: false
      description: Optional release metadata for a publish (ADR-0011 §1).
      properties:
        notes:
          type: string
          description: A release note attached to the new version.

    AssistantRollbackRequest:
      type: object
      additionalProperties: false
      description: >
        Roll the head back to a prior version (ADR-0011 §1) — creates a new head
        version from that snapshot. An unknown/malformed `version` → 422.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The prior version number to roll back to.
        notes:
          type: string
          description: Optional release note for the rollback version.

    AssistantTestRequest:
      type: object
      additionalProperties: false
      description: >
        A sample input for a read-only assistant test run (E6-5, issue #215).
        Optional — omitting `input` runs the assistant against a stable default
        request (the persona-augmented system prompt still carries the real task).
      properties:
        input:
          type: string
          maxLength: 8000
          description: The sample user input the assistant is tested against.

    AssistantTestToolCall:
      type: object
      additionalProperties: false
      description: >
        One tool call captured in a test run's debug trace (E6-5). `args` are the
        model-supplied arguments; `result` is the governed runner's outcome (`ok`,
        `summary`, `hitCount`, and an `error` code on failure/denial). A write-tier
        tool's `result` reflects the simulate/deny outcome — no real write occurred.
      required: [callId]
      properties:
        callId:
          type: string
          description: The tool-call id correlating the call with its result.
        tool:
          type: [string, "null"]
          description: The tool name invoked.
        args:
          type: [object, "null"]
          additionalProperties: true
          description: The model-supplied arguments for the call.
        result:
          type: [object, "null"]
          additionalProperties: true
          description: The governed runner's result (ok/summary/hitCount/error).

    AssistantTestTrace:
      type: object
      additionalProperties: false
      description: >
        The debug trace of a read-only assistant test run (E6-5, issue #215) — what
        the builder debug view renders. Reuses the runtime's own trace vocabulary
        (retrieval citations + tool-call/result envelopes). NO real side effect was
        produced (write-tier tools simulate/deny).
      required: [prompt, input, model, retrieval, toolCalls, outputs, errors, succeeded, durationMs]
      properties:
        prompt:
          type: string
          description: The effective system prompt (persona-augmented; grounding rules preserved).
        input:
          type: string
          description: The sample input the run answered.
        model:
          type: string
          description: The resolved model id the test run used.
        retrieval:
          type: array
          description: >
            The grounded citations the run produced — only permitted, retrieved
            passages (INV-3). Each entry mirrors the citation envelope shape.
          items:
            type: object
            additionalProperties: true
        toolCalls:
          type: array
          description: Each tool call the run made, with its args + result.
          items: { $ref: "#/components/schemas/AssistantTestToolCall" }
        outputs:
          type: string
          description: The streamed answer text the run produced.
        errors:
          type: array
          description: Any typed problem envelope(s) if the run failed (never a raw vendor string).
          items:
            type: object
            additionalProperties: true
        succeeded:
          type: boolean
          description: Whether the run completed with a terminal `done` and no error.
        durationMs:
          type: integer
          minimum: 0
          description: Wall-clock duration of the test run in milliseconds.

    AssistantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Assistant" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    AssistantVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssistantVersion" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    AssistantDraftRequest:
      type: object
      additionalProperties: false
      description: >
        Ask the conversational builder to draft an assistant (E6-1, issue #213)
        from a plain-language description. A blank/oversize description → 422.
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: Plain-language description of the assistant to draft.

    AssistantDraftConfig:
      type: object
      additionalProperties: false
      description: >
        The drafted, editable config the client pre-fills into the editor (E6-1) —
        the subset of `AssistantVersionConfig` the editor owns. Nothing is created
        until the user saves via `POST /assistants`.
      required: [name, model, knowledgeScope, toolAllowlist, autonomyLevel]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"] }
        instructions: { type: [string, "null"] }
        model:
          type: [string, "null"]
          description: A model id from GET /models; null ⇒ the smart server default.
        knowledgeScope: { $ref: "#/components/schemas/KnowledgeScope" }
        toolAllowlist:
          type: array
          items: { type: string }
          description: Registered tool names the draft keeps (unknown names are omitted).
        autonomyLevel: { $ref: "#/components/schemas/AutonomyLevel" }

    AssistantDraft:
      type: object
      additionalProperties: false
      description: >
        The builder's answer (E6-1, issue #213): a draft config the client loads
        into the editor for review + save, plus clarifying questions and notes.
      required: [draft]
      properties:
        draft: { $ref: "#/components/schemas/AssistantDraftConfig" }
        clarifications:
          type: array
          items: { type: string }
          description: >
            Questions the builder asks for anything the description left ambiguous —
            missing knowledge scope, owner/backup, or a risk acknowledgement (E6-3).
        notes:
          type: array
          items: { type: string }
          description: >
            Transparency notes for any field omitted from the draft because it
            referenced an unknown tool or a collection/source the caller cannot
            access (deny-by-default; INV-2).
        warnings:
          type: array
          items: { type: string }
          description: >
            Warnings for any drafted high-risk (write-tier / approval-gated) tool the
            user should acknowledge before publishing (CC-A tiers).

    # --- merged schemas: CodeRunStatus, ResourceUsage, CodeRun ---
    CodeRunStatus:
      type: string
      description: >
        Lifecycle of a sandbox code run (ADR-0020). `queued` = enqueued, not yet
        started; `running` = executing in the chat's reusable container; `succeeded`
        = finished with exit code 0; `failed` = finished with a non-zero exit code;
        `killed` = explicitly cancelled or terminated by the runtime; `denied` =
        refused before execution. `timeout` remains readable for historical rows;
        ADR-0020 adds no automatic execution timeout.
      enum: [queued, running, succeeded, failed, timeout, killed, denied]

    ResourceUsage:
      type: object
      additionalProperties: false
      description: >
        Measured resource consumption for a finished run (ADR-0020
        `code_runs.resource_usage`). Fields are best-effort — omitted when the
        runtime did not report them; absent entirely while the run is queued/running.
      properties:
        peak_memory_bytes:
          type: [integer, "null"]
          minimum: 0
          description: Peak resident memory the run reached, in bytes.
        cpu_time_ms:
          type: [integer, "null"]
          minimum: 0
          description: Total CPU time consumed, in milliseconds.
        max_pids:
          type: [integer, "null"]
          minimum: 0
          description: Peak number of processes/threads the run spawned.
        output_bytes:
          type: [integer, "null"]
          minimum: 0
          description: Total captured stdout+stderr size in bytes.

    SandboxSessionStatus:
      type: string
      enum: [not_created, active, closed, error]
      description: Lifecycle of the chat-scoped reusable sandbox (ADR-0020).

    SandboxSession:
      type: object
      additionalProperties: false
      required: [status, enabled, root_access]
      description: >
        The caller-visible state of one chat's reusable Python sandbox. Identifiers
        are opaque and owner/tenant scoped. `root_access=true` means UID 0 inside the
        isolated container only; model-authored execution remains network-none and
        receives no host mounts, engine socket, application credentials, or host env.
      properties:
        status: { $ref: "#/components/schemas/SandboxSessionStatus" }
        enabled:
          type: boolean
          description: Whether deploy and tenant policy currently admit code execution.
        sandbox_session_id: { type: [string, "null"], format: uuid }
        generation: { type: [integer, "null"], minimum: 1 }
        image_digest: { type: [string, "null"] }
        root_access: { type: boolean, const: true }
        created_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }

    CodeRun:
      type: object
      additionalProperties: false
      description: >
        One agent-authored sandbox code run, for inspection/history (ADR-0020,
        E15-7 / E6-5). Tenant- and owner-scoped (spec 0004 INV-1/INV-2). Runs are
        created by the `run_python` agent tool off the request path — never by a
        public execute endpoint. `exit_code`, `duration_ms`, `resource_usage`, and `artifact_ids` populate as
        the run finishes (null/empty while queued or running).
      required:
        [id, status, code, requested_packages, stdout, stderr, artifact_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id:
          type: [string, "null"]
          format: uuid
          description: Parent chat session id.
        sandbox_session_id:
          type: [string, "null"]
          format: uuid
          description: Opaque reusable sandbox id used for this run.
        sandbox_generation:
          type: [integer, "null"]
          minimum: 1
          description: Sandbox generation used for this run; changes after reset/cancel.
        status: { $ref: "#/components/schemas/CodeRunStatus" }
        code:
          type: string
          description: The exact Python source that was executed (inspectable, E15-7 / E6-5).
        requested_packages:
          type: array
          description: Policy-admitted PEP-508 requirements requested for this execution.
          items: { type: string }
        stdout:
          type: string
          description: Captured standard output.
        stderr:
          type: string
          description: Captured standard error.
        exit_code:
          type: [integer, "null"]
          description: >
            Process exit code once the run finishes; null while queued/running or
            when the run was killed/denied before producing one.
        duration_ms:
          type: [integer, "null"]
          minimum: 0
          description: Wall-clock execution time in milliseconds; null until the run finishes.
        resource_usage:
          oneOf:
            - { $ref: "#/components/schemas/ResourceUsage" }
            - { type: "null" }
          description: Measured resource consumption; null until the run finishes.
        artifact_ids:
          type: array
          description: >
            Ids of artifacts the run emitted (files collected from the output dir and
            persisted via CC-B #208, tenant-scoped). Empty until (and unless) the run
            produces output files.
          items: { type: string, format: uuid }
        image_digest:
          type: [string, "null"]
          description: >
            The pinned base-image digest actually used (reproducibility, E3-7);
            null until the run starts.
        trace_id:
          type: [string, "null"]
          description: Links the run to the parent agent trace (E15-7); null when unlinked.
        created_at: { type: string, format: date-time }
        started_at:
          type: [string, "null"]
          format: date-time
          description: When execution began; null while still queued.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the run reached a terminal status; null until then.

    # --- merged schemas: CadenceUnit, StructuredCadence, Cadence, ScheduleDelivery, OverlapPolicy, RunStatus, RunTrigger, Schedule, ScheduleCreate, ScheduleUpdate, ScheduleList, RunEnqueued, RunError, RunStepKind, RunStep, Run, RunList ---
    CadenceUnit:
      type: string
      description: The recurrence period for a structured cadence (ADR-0015 §2).
      enum: [hour, day, week, month]

    StructuredCadence:
      type: object
      additionalProperties: false
      description: >
        A structured recurrence — the human-friendly alternative to a raw cron
        expression (ADR-0015 §2 `cadence` jsonb). e.g.
        `{ every: day, at: "08:00" }` = every day at 08:00 local (in the schedule's
        `timezone`). `day_of_week` (0=Sunday..6=Saturday) applies when `every` is
        `week`; `day_of_month` (1..31) applies when `every` is `month`.
      required: [every, at]
      properties:
        every: { $ref: "#/components/schemas/CadenceUnit" }
        at:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time-of-day HH:MM (24h) in the schedule's timezone.
        day_of_week:
          type: [integer, "null"]
          minimum: 0
          maximum: 6
          description: 0=Sunday..6=Saturday; used when `every` is `week`.
        day_of_month:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
          description: 1..31; used when `every` is `month`.

    Cadence:
      description: >
        A schedule's recurrence — exactly one form (ADR-0015 §2): either a raw
        `cron` expression OR a `StructuredCadence`. The server normalizes both to
        one stored form and computes `next_run_at` tz/DST-correct from the
        schedule's `timezone`. A malformed cron is a **422** `invalid_cron`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [cron]
          properties:
            cron:
              type: string
              minLength: 1
              description: A standard 5-field cron expression (e.g. "0 8 * * 1").
        - type: object
          additionalProperties: false
          required: [structured]
          properties:
            structured: { $ref: "#/components/schemas/StructuredCadence" }

    ScheduleDelivery:
      type: object
      additionalProperties: false
      description: >
        Where a completed run's result lands (ADR-0015 §6). v1 is in-app only —
        the run inbox and an optional digest; external channels (email/Slack) are
        deferred (T2-ish, spec 0004 §2.5).
      properties:
        inbox:
          type: boolean
          default: true
          description: Land the completed run in the owner's in-app run inbox.
        digest:
          type: [string, "null"]
          enum: [none, daily, weekly, null]
          description: Roll recent runs into a periodic in-app digest, or null/none for no digest.

    OverlapPolicy:
      type: string
      description: >
        What happens when a schedule fires while its previous run is still active
        (ADR-0015 §5). `skip` (default) records a skipped fire; `queue` enqueues
        behind the active run; `allow` runs concurrently.
      enum: [skip, queue, allow]

    RunStatus:
      type: string
      description: >
        The run state machine (ADR-0015 §2). Terminal states are `succeeded`,
        `failed`, and `escalated` (a first-class terminal, distinct from failed —
        the run needs a human, ADR-0015 §6). An illegal transition is a **409**
        (INV-8).
      enum: [queued, running, succeeded, failed, escalated]

    RunTrigger:
      type: string
      description: Why the run fired (ADR-0015 §2). `schedule` = a cadence fire; `manual` = run-now.
      enum: [schedule, manual]

    Schedule:
      type: object
      additionalProperties: false
      description: >
        A user-defined recurring run of a saved assistant, tenant- and owner-scoped
        (ADR-0015 §2/§8, spec 0004 INV-1/INV-2). The `owner_id` is the run's
        principal — a fired run retrieves only what the owner could retrieve
        interactively (INV-2).
      required:
        [id, assistant_id, owner_id, cadence, timezone, delivery, overlap_policy, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        assistant_id:
          type: string
          format: uuid
          description: The saved assistant this schedule runs.
        owner_id:
          type: string
          format: uuid
          description: The schedule's owner — the run's principal (INV-2).
        cadence: { $ref: "#/components/schemas/Cadence" }
        timezone:
          type: string
          description: IANA timezone name (e.g. America/New_York); drives DST-correct next_run_at.
        input_params:
          type: object
          additionalProperties: true
          description: The assistant's inputs applied to each fire (the prompt-template values).
        delivery: { $ref: "#/components/schemas/ScheduleDelivery" }
        overlap_policy: { $ref: "#/components/schemas/OverlapPolicy" }
        enabled:
          type: boolean
          description: True = firing; false = paused (the derived RedBeat entry is removed).
        next_run_at:
          type: [string, "null"]
          format: date-time
          description: The upcoming fire (computed tz/DST-correct); null when paused.
        last_run_at:
          type: [string, "null"]
          format: date-time
          description: When this schedule last fired, or null before the first fire.
        last_status:
          oneOf:
            - { $ref: "#/components/schemas/RunStatus" }
            - { type: "null" }
          description: The status of the last fire, or null before the first fire.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScheduleCreate:
      type: object
      additionalProperties: false
      description: >
        Create a schedule (ADR-0015 §8). An invalid cron or unknown IANA timezone
        is rejected **422** (`invalid_cron` / `invalid_timezone`, INV-8); an unknown
        assistant is **404** (INV-1/INV-2).
      required: [assistant_id, cadence, timezone]
      properties:
        assistant_id: { type: string, format: uuid }
        cadence: { $ref: "#/components/schemas/Cadence" }
        timezone:
          type: string
          minLength: 1
          description: IANA timezone name (e.g. America/New_York). An unknown name is 422.
        input_params:
          type: object
          additionalProperties: true
          description: The assistant's inputs for each fire.
        delivery: { $ref: "#/components/schemas/ScheduleDelivery" }
        overlap_policy:
          allOf: [{ $ref: "#/components/schemas/OverlapPolicy" }]
          description: Overlap handling; omitted defaults to skip.
        enabled:
          type: boolean
          default: true
          description: Create paused by setting false; omitted defaults to true.

    ScheduleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Edit a schedule (ADR-0015 §8). Any invalid cron / IANA timezone is 422.
      properties:
        cadence: { $ref: "#/components/schemas/Cadence" }
        timezone: { type: string, minLength: 1 }
        input_params:
          type: object
          additionalProperties: true
        delivery: { $ref: "#/components/schemas/ScheduleDelivery" }
        overlap_policy: { $ref: "#/components/schemas/OverlapPolicy" }
        enabled: { type: boolean }

    ScheduleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Schedule" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    RunEnqueued:
      type: object
      additionalProperties: false
      description: The id of a run just enqueued by run-now (ADR-0015 §8), created queued.
      required: [run_id]
      properties:
        run_id:
          type: string
          format: uuid
          description: The new run's id — also its WS streamId for live attach (ADR-0015 §3).

    RunError:
      type: object
      additionalProperties: false
      description: >
        A typed run failure / escalation reason (ADR-0015 §2 `error` jsonb) — never
        a raw vendor string (the runtime's opaque-error rule). Present on `failed`
        and `escalated` runs.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable reason (e.g. model_unavailable, ambiguous, tool_failed).
        message:
          type: string
          description: Human-readable explanation for the owner's inbox.

    RunStepKind:
      type: string
      description: >
        A transcript step kind (ADR-0015 §2 `run_steps.kind`) — the durable
        analogue of the WS envelope type set: `delta` (incremental output),
        `tool_call` / `tool_result` (a tool turn), `citation` (a grounded passage),
        `error` (a failure step).
      enum: [delta, tool_call, tool_result, citation, error]

    RunStep:
      type: object
      additionalProperties: false
      description: >
        One ordered step of a run's persisted transcript (ADR-0015 §2 `run_steps`),
        the durable equivalent of a WS envelope. `seq` is monotonic per run — the
        same ordering guarantee as the WS `seq`. `payload` carries the envelope
        `data` (tool args/results, delta text, or citation fields), typed per
        `kind`.
      required: [seq, kind, created_at]
      properties:
        seq:
          type: integer
          minimum: 0
          description: Monotonic per-run sequence — the transcript ordering (matches the WS seq).
        kind: { $ref: "#/components/schemas/RunStepKind" }
        payload:
          type: object
          additionalProperties: true
          description: The step data (the envelope `data`), typed per `kind`.
        created_at: { type: string, format: date-time }

    Run:
      type: object
      additionalProperties: false
      description: >
        One execution of an assistant — scheduled or manual (ADR-0015 §2/§8),
        tenant- and owner-scoped (spec 0004 INV-1/INV-2). The full detail carries
        the ordered transcript (`steps`), the grounded `citations` (drawn only from
        permitted, retrieved passages — INV-3), the `outputs`, and the typed
        `error` on a failed/escalated run. `id` doubles as the WS `streamId` for
        live attach (ADR-0015 §3).
      required: [id, assistant_id, trigger, status, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The run id — also its WS streamId for live attach (ADR-0015 §3).
        schedule_id:
          type: [string, "null"]
          format: uuid
          description: The schedule that fired this run, or null for a manual/run-now run.
        assistant_id: { type: string, format: uuid }
        assistant_version_id:
          type: [string, "null"]
          format: uuid
          description: The pinned assistant version executed — a run is reproducible after edits.
        trigger: { $ref: "#/components/schemas/RunTrigger" }
        status: { $ref: "#/components/schemas/RunStatus" }
        inputs:
          type: object
          additionalProperties: true
          description: The resolved input_params snapshotted for this fire.
        summary:
          type: [string, "null"]
          description: Short digest line for the inbox (ADR-0015 §6).
        message_id:
          type: [string, "null"]
          format: uuid
          description: The assistant message the transcript produced (reuses the chat message/citation tables).
        steps:
          type: array
          description: The ordered persisted transcript (empty on the list view; present on detail).
          items: { $ref: "#/components/schemas/RunStep" }
        citations:
          type: array
          description: >
            The grounded citations of the run's answer — only permitted, retrieved
            passages (spec 0004 INV-3). Reuses the chat citation shape.
          items: { $ref: "#/components/schemas/Citation" }
        outputs:
          type: object
          additionalProperties: true
          description: The run's structured outputs, when the assistant produces them.
        error:
          oneOf:
            - { $ref: "#/components/schemas/RunError" }
            - { type: "null" }
          description: The typed failure / escalation reason on a failed or escalated run; else null.
        started_at:
          type: [string, "null"]
          format: date-time
          description: When the run started executing, or null while queued.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the run reached a terminal status, or null while not terminal.
        created_at: { type: string, format: date-time }

    RunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    RunReroute:
      type: object
      additionalProperties: false
      description: >
        Reroute an escalated run to another owner (E7-5, #239). `to_owner_id` becomes
        the run's execution principal, so the re-driven run retrieves only what the new
        owner may (INV-2). Must be a user in the caller's tenant and not the current
        owner.
      required: [to_owner_id]
      properties:
        to_owner_id:
          type: string
          format: uuid
          description: The user to reassign the run to (its new execution principal).

    # --- merged schemas: CertificationState, GovernedAssistant, GovernedAssistantList, AssistantCertifyRequest, AssistantFeatureRequest, AssistantDisableRequest, AssistantOwnershipTransferRequest, BulkOrphanResult ---
    CertificationState:
      type: string
      description: >
        Admin library-governance certification (E6-6, #217) — an orthogonal axis to
        the lifecycle status. `none` = not reviewed; `certified` = an admin vouched
        for it (trusted in the library); `deprecated` = an admin flagged it for
        retirement (still runnable, the library warns). Admin-only mutation (INV-5).
      enum: [none, certified, deprecated]

    GovernedAssistant:
      type: object
      additionalProperties: false
      description: >
        One assistant in the admin library view (E6-6/E6-8, #217): identity + owner +
        lifecycle status plus the governance axis (certification / featured / category /
        disabled) and the `ownerOrphaned` projection (owner no longer a tenant member —
        flag for reassignment). Admin-only; spans every owner in the tenant.
      required:
        [id, name, autonomyLevel, owner, status, certificationState, featured, ownerOrphaned, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"] }
        model: { type: [string, "null"] }
        autonomyLevel: { $ref: "#/components/schemas/AutonomyLevel" }
        owner:
          type: string
          format: uuid
          description: The accountable owner's user id.
        backupOwner:
          type: [string, "null"]
          format: uuid
        status: { $ref: "#/components/schemas/AssistantStatus" }
        certificationState: { $ref: "#/components/schemas/CertificationState" }
        featured:
          type: boolean
          description: Whether an admin has featured/pinned the assistant.
        category:
          type: [string, "null"]
          description: A library grouping label (null ⇒ uncategorised).
        disabledAt:
          type: [string, "null"]
          format: date-time
          description: When an admin disabled the assistant (null ⇒ not disabled).
        ownerOrphaned:
          type: boolean
          description: The owner is no longer a member of the tenant (flag for reassignment, E6-8).
        version:
          type: [integer, "null"]
          description: The current published head version number (null while never published).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GovernedAssistantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GovernedAssistant" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    AssistantCertifyRequest:
      type: object
      additionalProperties: false
      required: [certificationState]
      description: Set an assistant's certification verdict (certify / deprecate / clear).
      properties:
        certificationState: { $ref: "#/components/schemas/CertificationState" }

    AssistantFeatureRequest:
      type: object
      additionalProperties: false
      required: [featured]
      description: Feature / unfeature an assistant in the library.
      properties:
        featured: { type: boolean }

    AssistantDisableRequest:
      type: object
      additionalProperties: false
      required: [disabled]
      description: >
        Disable / re-enable an assistant. Disabling blocks it from starting a chat /
        schedule / run (INV-8); re-enabling returns the head to `draft` (the owner
        must re-publish before it can run again).
      properties:
        disabled: { type: boolean }

    AssistantOwnershipTransferRequest:
      type: object
      additionalProperties: false
      required: [newOwner]
      description: >
        Reassign the assistant's accountable owner to another tenant member (E6-8). The
        new owner must be a distinct member of the tenant (else 422). Rescues an
        orphaned assistant (owner deprovisioned).
      properties:
        newOwner:
          type: string
          format: uuid
          description: The new owner's user id (a distinct member of the tenant).

    BulkOrphanResult:
      type: object
      additionalProperties: false
      required: [affected, action]
      description: The outcome of a bulk reassign/disable of orphaned assistants (E6-8).
      properties:
        affected:
          type: array
          items: { type: string, format: uuid }
          description: The assistant ids affected by the sweep.
        action:
          type: string
          description: The action applied to each affected assistant (e.g. "disabled").

    # --- merged schemas: RunDeliveryKind, RunDeliveryStatus, RunDelivery, RunDeliveryList ---
    RunDeliveryKind:
      type: string
      description: >
        How a completed run's output reached the owner (ADR-0015 §6, #238). `inbox`
        = an immediate in-app inbox delivery on completion (the default); `digest` =
        a run rolled into a periodic in-app digest batch. External channels
        (email/Slack) are deferred T2-ish egress — no kind here.
      enum: [inbox, digest]

    RunDeliveryStatus:
      type: string
      description: >
        The lifecycle of one in-app run delivery (ADR-0015 §6, #238). `pending` =
        created, awaiting its digest batch; `delivered` = visible in the inbox
        (unread); `read` = the owner opened it; `failed` = the delivery could not be
        produced (visible + retryable via the run detail, never a silent drop).
      enum: [pending, delivered, read, failed]

    RunDelivery:
      type: object
      additionalProperties: false
      description: >
        One in-app delivery of a completed run's output (issue #238). Tenant- and
        owner-scoped (INV-1/§2.2): a delivery in another tenant / addressed to another
        user is 404. `run_id` links to the full cited transcript (`GET /runs/{id}`).
      required: [id, run_id, kind, status, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id:
          type: string
          format: uuid
          description: The completed run this delivery is for (link to its transcript).
        schedule_id:
          type: [string, "null"]
          format: uuid
          description: The schedule that fired the run, or null for a manual run.
        kind: { $ref: "#/components/schemas/RunDeliveryKind" }
        status: { $ref: "#/components/schemas/RunDeliveryStatus" }
        summary:
          type: [string, "null"]
          description: The inbox line — the run's short summary.
        created_at: { type: string, format: date-time }
        read_at:
          type: [string, "null"]
          format: date-time
          description: When the owner opened the delivery, or null while unread.

    RunDeliveryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RunDelivery" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # --- merged schemas: LlmProviderType, LlmProviderStatus, LlmProviderModel, LlmProvider, LlmProviderList, LlmProviderCreate, LlmProviderUpdate ---
    LlmProviderType:
      type: string
      description: >
        The API shape a registered LLM provider speaks. `openai_compatible` covers
        OpenRouter / OpenAI / vLLM and any host exposing the OpenAI `GET /v1/models`
        + `POST /v1/chat/completions` shape. The enum is small but extensible (a new
        provider family adds a value, never a schema migration).
      enum: [openai_compatible]

    LlmProviderStatus:
      type: string
      description: >
        Model-discovery state from the last probe. `pending` before the first
        discovery, `ready` after a successful `GET /models` snapshot, `error` when
        the last discovery failed (see `last_error`).
      enum: [pending, ready, error]

    LlmProviderModel:
      type: object
      additionalProperties: false
      description: One model discovered from the provider's `/models` catalog.
      required: [id]
      properties:
        id:
          type: string
          description: The provider's model id (e.g. `openai/gpt-4o`).
        label:
          type: [string, "null"]
          description: A human-friendly label derived from the catalog entry (or the id).

    LlmProvider:
      type: object
      additionalProperties: false
      description: >
        One registered per-tenant LLM provider, tenant- and owner-scoped (spec 0004
        INV-1/INV-2). The response **never** includes the stored API-key value — only
        a masked `secret_hint`. `discovered_models` is the last successful `GET
        /models` snapshot. Foundation PR: this catalog is not yet wired into the chat
        model picker or completion routing (a follow-up PR).
      required: [id, name, provider_type, base_url, enabled, status, discovered_models, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, description: Display name. }
        provider_type: { $ref: "#/components/schemas/LlmProviderType" }
        base_url:
          type: string
          format: uri
          description: The provider's OpenAI-compatible API root (https only; SSRF-checked on register and every discovery).
        enabled:
          type: boolean
          description: Admin toggle — when false the provider is inactive (its models are not offered; follow-up PR).
        status: { $ref: "#/components/schemas/LlmProviderStatus" }
        last_discovery_at:
          type: [string, "null"]
          format: date-time
          description: When the last successful model discovery finished (null before the first success).
        last_error:
          type: [string, "null"]
          description: Safe failure reason when status is error (never contains the API key).
        discovered_models:
          type: array
          items: { $ref: "#/components/schemas/LlmProviderModel" }
          description: The models discovered on the last successful `GET /models` (empty until first discovery).
        secret_hint:
          type: [string, "null"]
          description: >
            A **masked** hint at the stored API key (e.g. `"****abcd"`), or null when
            no key is stored. This is the ONLY key-derived value ever returned — the
            actual key is write-only, envelope-encrypted in the CC-C vault, and never
            serialized through any API.
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LlmProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LlmProvider" }

    LlmProviderCreate:
      type: object
      additionalProperties: false
      description: >
        Register an LLM provider. `provider_type` is constrained to the supported
        values (`openai_compatible`); `base_url` must be https and pass the SSRF check
        (else 422). The optional `api_key` is **write-only** — stored envelope-
        encrypted via CC-C and never returned; the response carries only a masked
        `secret_hint`. The backend auto-discovers the provider's models on create.
      required: [name, provider_type, base_url]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: Display name. }
        provider_type: { $ref: "#/components/schemas/LlmProviderType" }
        base_url:
          type: string
          format: uri
          description: The provider's OpenAI-compatible API root (https only; SSRF-checked).
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: The provider API key. Write-only — stored in the CC-C vault, never returned.

    LlmProviderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Update a registered LLM provider. Any subset of fields; at least one. Rotating
        `api_key` replaces the stored CC-C key (write-only, never returned); send
        `api_key: null` to clear it. Changing `base_url` re-runs the https + SSRF
        validation (else 422) and re-runs model discovery.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        base_url:
          type: string
          format: uri
          description: The provider's OpenAI-compatible API root (https only; re-validated + SSRF-checked).
        enabled: { type: boolean, description: Admin toggle. }
        api_key:
          oneOf:
            - { type: string, minLength: 1, writeOnly: true }
            - type: "null"
          description: Rotate the write-only API key, or null to clear it.

  responses:
    Problem:
      description: Error (problem+json).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, invalid, or expired credentials (INV-4).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: >
        Authenticated but not authorized for this action — the caller lacks the
        required role (e.g. a non-admin on /admin/*, a non-security/admin on
        /audit). Wrong-role → 403 (INV-5).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found — or in another tenant / not permitted (INV-1/INV-2).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: >
        The resource exists but is not in a state that allows this request
        (illegal transition / not ready — INV-8). The problem `code` names the
        specific conflict (e.g. `document_not_ready`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Malformed or invalid request body (INV-8).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Upload exceeds MAX_UPLOAD_BYTES.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Content-type not in the upload allowlist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  securitySchemes:
    # Identity/tenant is resolved in backend/app/auth (CC-3, spec 0004 §2.3):
    # app-managed email+password → short-lived access JWT. Bearer-token on every
    # endpoint except health + login + refresh.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: health
    description: Liveness & readiness probes.
  - name: auth
    description: App-managed identity — login, refresh, logout, whoami.
  - name: collections
    description: Folders that group uploaded documents.
  - name: documents
    description: Upload, list, view, and delete documents (multi-format).
  - name: chat
    description: Chat sessions, history, and message send (answer streams over WS).
  - name: models
    description: The selectable chat-model registry (picker).
  - name: preferences
    description: The caller's account preferences (e.g. default chat model).
  - name: search
    description: Permission-trimmed, cited grounded search across the caller's sources.
  - name: saved-searches
    description: The caller's saved searches — save a query + filters and re-run it.
  - name: audit
    description: The append-only audit trail with provenance (admin / security only).
  - name: admin
    description: >-
      Tenant administration (admin only) — members, model governance and risk
      tiers (reads), plus per-tenant settings (`GET`/`PATCH /admin/settings`, the
      chat tool-turn budget — the one admin write, audited; issue #148).
  - name: sources
    description: Connected sources — the connector grid (add / sync / remove a Web URL source).
  - name: mcp-servers
    description: >-
      Registered MCP (Model Context Protocol) servers — register / manage remote
      tool-providing endpoints, probe health + discover tools (ADR-0012).
  - name: assistants
    description: "Saved, governed chat configurations (ADR-0011) \u2014 create/edit drafts, publish\
  \ immutable versions, list versions, and roll back."
  - name: code-runs
    description: "Inspect and cancel reusable sandbox runs (ADR-0020) \u2014 status, code, output,\
  \ timing, generation, resource usage, and emitted artifacts. Runs are created by\
  \ the `run_python` agent tool, not a public execute endpoint."
  - name: schedules
    description: "The caller's recurring assistant runs \u2014 create / edit / delete a schedule and\
  \ pause / resume / run-now (ADR-0015 \xA78)."
  - name: runs
    description: "The run inbox \u2014 list runs and read a run's detail (status, transcript, tool\
  \ calls, citations, outputs, error). Live attach reuses the chat WS envelopes."
  - name: tools
    description: >-
      The tool catalogue (read-only): every registered tool with its risk tier and
      the caller's tenant's effective governance flags, so the assistant builder can
      offer a truthful allow-list picker (issue #505). Granting/ungranting a tool for
      a tenant stays an admin write on `/admin/tool-policy`.
