openapi: 3.1.0
info:
  title: Lumen Copilot API
  version: 0.5.0
  description: >
    Source-of-truth contract for the Lumen Copilot REST surface. The backend
    implements to match this; the frontend client is generated from it.


    Revision 0.1.0 froze the **grounded-chat MVP wire** (issue #37,
    ADR-0006 Phase 0): auth, collections, documents, chat, and the model
    picker. Streaming assistant answers ride the WebSocket envelope
    (`websocket-envelopes.schema.json`); request/response stays REST (ADR-0003).


    This revision (0.2.0) **additively** freezes the **M2 Trust-Surfaces wire**
    (issue #80, ADR-0006 Phase 0 / ADR-0008 wave 0): `GET /search`
    (permission-trimmed, cited grounded search), `GET /audit` (the append-only
    audit trail with provenance), and the read-only `/admin/*` governance
    surfaces (members, model governance, risk tiers). These are the frozen
    hand-off artifact that gates the parallel M2 build slices; no shape from
    0.1.0 changed. All three are REST request/response — no new WebSocket
    envelope shapes were required.


    This revision (0.3.0) **additively** freezes the **Sources wire** (issue
    #108, ADR-0009 §5, ADR-0006 Phase 0): `GET /sources` (the connector grid),
    `POST /sources` (add a source — the first connector is a Web URL; an invalid
    or SSRF-blocked URL is a **422**, ADR-0009 §3), `POST /sources/{id}/sync`
    (re-sync), and `DELETE /sources/{id}` (remove, cascading the source's
    documents). Sources are tenant- and owner-scoped (INV-1/INV-2). No shape from
    0.1.0 or 0.2.0 changed; these are REST request/response only.


    This revision (0.4.0) **additively** freezes the **preferences, saved-searches
    & search-suggestions wire** (spec 0005, epic #144, ADR-0006 Phase 0):
    `GET`/`PATCH /preferences` (the caller's account preferences — a default chat
    model validated against `/models`), `GET`/`POST`/`GET`/`PATCH`/`DELETE
    /saved-searches` (save a query + filters and re-run it), `GET /search/suggest`
    (permission-trimmed typeahead through the `retrieval/` chokepoint), and
    `GET`/`DELETE /search/recent` (recent-query history; `/search` records the
    executed query). All per-user and tenant-scoped (INV-1/INV-2). No shape from
    0.1.0–0.3.0 changed; REST request/response only.


    This revision (0.5.0) **additively** adds the **admin per-tenant settings
    wire** (issue #148): `GET /admin/settings` (the tenant's effective chat
    tool-turn budget) and `PATCH /admin/settings` (set or clear the per-tenant
    override). The PATCH is the first `/admin` **write** — a reversible,
    tenant-scoped **T1** action (spec 0004 §2.5): `admin`-only (**403** otherwise,
    INV-5), audited, with an out-of-range value rejected as **422** (INV-8). No
    shape from 0.1.0–0.4.0 changed; REST request/response only.


    **Tenancy & permission (spec 0004).** Every resource below is implicitly
    scoped to the authenticated user's tenant and ownership. A request for a
    resource in another tenant — or one the caller is not permitted to see —
    returns **404** (existence non-disclosure, INV-1/INV-2), never 403. Clients
    never send `tenant_id`; it is resolved from the bearer token in
    `backend/app/auth/`. All endpoints except `getHealth`, `getReadiness`,
    `login`, and `refresh` require the bearer token.
servers:
  - url: http://localhost:47181
    description: Local compose (default host port; see ADR-0005 / .env.example)
  - url: /
    description: Same-origin (behind a reverse proxy / in dev via Vite proxy)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness — the process is up.
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness — the process and its dependencies are reachable.
      tags: [health]
      security: []
      responses:
        "200":
          description: Service and all dependencies are ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
        "503":
          description: One or more dependencies are not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }

  # --- Auth (CC-3 / spec 0004 §2.3) -----------------------------------------
  /auth/login:
    post:
      operationId: login
      summary: Exchange email + password for an access token.
      description: >
        App-managed identity (spec 0004): returns a short-lived access token and
        sets a rotating, httpOnly refresh cookie. Invalid credentials → 401 with
        a generic message (no account-existence disclosure).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/refresh:
    post:
      operationId: refresh
      summary: Mint a new access token from the refresh cookie.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token / clear the session.
      tags: [auth]
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The authenticated principal (id, tenant, roles).
      tags: [auth]
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Collections / folders -------------------------------------------------
  /collections:
    get:
      operationId: listCollections
      summary: List the caller's collections.
      tags: [collections]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of collections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCollection
      summary: Create a collection.
      tags: [collections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /collections/{collectionId}:
    parameters:
      - { $ref: "#/components/parameters/CollectionId" }
    get:
      operationId: getCollection
      summary: Get a collection by id.
      tags: [collections]
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCollection
      summary: Rename / re-describe a collection.
      tags: [collections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteCollection
      summary: Delete a collection and its documents.
      tags: [collections]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Documents (upload + multi-format ingestion: #28 / #21) ----------------
  /documents:
    get:
      operationId: listDocuments
      summary: List documents, optionally filtered by collection / status / text.
      tags: [documents]
      parameters:
        - name: collection_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict to one collection.
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Filter by filename substring (lexical, not semantic).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: uploadDocument
      summary: Upload a document into a collection (multi-format).
      description: >
        Stores the file (MinIO sandbox, CC-12) and creates a `Document` with
        status `pending`; ingestion (parse → chunk → embed) runs async (#21).
        Allowed content-types and the size cap are enforced server-side
        (`UPLOAD_ALLOWED_CONTENT_TYPES`, `MAX_UPLOAD_BYTES`).
      tags: [documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, collection_id]
              properties:
                file:
                  type: string
                  format: binary
                collection_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Accepted for ingestion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /documents/{documentId}:
    parameters:
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      operationId: getDocument
      summary: Get document metadata (incl. ingestion status).
      tags: [documents]
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDocument
      summary: Delete a document and its chunks/embeddings.
      tags: [documents]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/content:
    parameters:
      - { $ref: "#/components/parameters/DocumentId" }
    get:
      operationId: getDocumentContent
      summary: Download / view the original file bytes.
      description: >
        Returns the stored bytes for viewing in the UI. The server may instead
        respond 302 to a short-TTL presigned URL (CC-12); clients must follow it.
      tags: [documents]
      responses:
        "200":
          description: The raw document bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a short-TTL presigned URL.
          headers:
            Location:
              required: true
              description: Short-TTL presigned URL for the object.
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Chat (sessions, history, send → stream) : CC-6 #24 --------------------
  /chat/sessions:
    get:
      operationId: listChatSessions
      summary: List the caller's chat sessions (history).
      tags: [chat]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of chat sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createChatSession
      summary: Start a new chat session.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSessionCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /chat/sessions/{sessionId}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: getChatSession
      summary: Get a chat session.
      tags: [chat]
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateChatSession
      summary: Rename a session or change its default model.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSessionUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteChatSession
      summary: Delete a chat session and its messages.
      tags: [chat]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /chat/sessions/{sessionId}/messages:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
    get:
      operationId: listMessages
      summary: Message history for a session (oldest → newest).
      tags: [chat]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: sendMessage
      summary: Send a user message; the assistant answer streams over WebSocket.
      description: >
        Persists the user message and returns a `stream_id`. The client then
        consumes the answer over the WebSocket envelope stream with that id
        (`start` → `delta`(token)* / `event`(citation|tool_call|tool_result)* →
        `done|error`; see websocket-envelopes.schema.json). The finished
        assistant message — with citations — is also retrievable via
        `listMessages`. `model` overrides the session default for this turn;
        `collection_ids` scopes retrieval (default: all the caller's documents).
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "202":
          description: Accepted; consume the answer on the WS stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendMessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Model picker ----------------------------------------------------------
  /models:
    get:
      operationId: listModels
      summary: The selectable chat models (picker registry).
      description: >
        The curated set the UI offers, grouped by tier (frontier / fast / oss).
        Exactly one has `is_default: true`. Backed by config — adding a model is
        a config change, not a contract change.
      tags: [models]
      responses:
        "200":
          description: Available chat models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Search (M2: grounded, permission-trimmed, cited) : #80 ----------------
  /search:
    get:
      operationId: search
      summary: Permission-trimmed ranked search, with an optional cited answer.
      description: >
        Runs the query through the `retrieval/` chokepoint (spec 0004 §2.2): the
        ranked results contain ONLY passages in the caller's effective allow-set
        (INV-2) within their tenant (INV-1). Passages the caller may not see are
        never returned; they are counted in `hidden_count` so the UI can disclose
        "N results hidden by your permissions" without leaking their content.


        When the query is answerable from the permitted results the response MAY
        include a `direct_answer` — a short synthesized answer whose every claim
        is backed by `citations[]` that reference passages present in `results`
        (INV-3, citation integrity). When nothing answers it, `direct_answer` is
        omitted (prefer "no answer" over an unsourced claim, mission filter #2).
      tags: [search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: The search query (lexical + semantic; ranked).
        - name: collection_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict to one collection.
        - name: source
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ResultSource" }
          description: Restrict to results from one source kind.
        - name: type
          in: query
          required: false
          schema: { type: string }
          description: Restrict to one content type (e.g. document, message).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of permission-trimmed ranked results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Audit trail (M2: provenance-rich, admin/security only) : #80 ----------
  /audit:
    get:
      operationId: listAuditEvents
      summary: The append-only audit trail (admin / security only).
      description: >
        Reads the one append-only audit sink (spec 0004 §2.4). Restricted to the
        `admin` and `security` roles; any other role (incl. `member`) receives
        **403** (INV-5). Events are tenant-scoped — a caller only ever sees their
        own tenant's events (INV-1). Each event carries `provenance` so a reviewer
        can see WHY a retrieval/answer decision was made, including the candidate
        passages that were allowed vs. excluded and the reason for each.


        Default ordering is newest → oldest; `from`/`to` bound the time window.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
          description: Filter to one actor (user id, or `system`/`anonymous`).
        - name: event_type
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AuditEventType" }
          description: Filter to one event type.
        - name: resource_id
          in: query
          required: false
          schema: { type: string }
          description: Filter to events touching one resource.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive lower bound on event timestamp (UTC ISO-8601).
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Exclusive upper bound on event timestamp (UTC ISO-8601).
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of audit events (newest → oldest).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Admin (M2: read-only governance surfaces, admin only) : #80 -----------
  /admin/members:
    get:
      operationId: listMembers
      summary: The tenant's members and their roles (admin only).
      description: >
        Read-only roster for the admin console. Restricted to the `admin` role;
        any other role receives **403** (INV-5). Tenant-scoped (INV-1): only the
        caller's own tenant's members are returned.
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/model-governance:
    get:
      operationId: getModelGovernance
      summary: Which models are allowed, by governance tier (admin only).
      description: >
        Read-only view of model governance for the admin console: the set of
        models permitted for this tenant and the governance tiers they map to.
        Restricted to the `admin` role; otherwise **403** (INV-5).
      tags: [admin]
      responses:
        "200":
          description: Model governance configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelGovernance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/risk-tiers:
    get:
      operationId: getRiskTiers
      summary: The read-before-write risk tiers T0–T3 (admin only).
      description: >
        Read-only reference of the action risk tiers (spec 0004 §2.5): T0
        (read-only) through T3 (destructive/irreversible external), each with its
        description and the approval it requires. Restricted to the `admin` role;
        otherwise **403** (INV-5).
      tags: [admin]
      responses:
        "200":
          description: The risk-tier reference (T0–T3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskTierList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/settings:
    get:
      operationId: getTenantSettings
      summary: The tenant's admin-configurable settings (admin only).
      description: >
        The caller's tenant's effective chat tool-turn budget (issue #148): the
        per-tenant override if set, else the system default, plus whether the
        default is in force. Restricted to the `admin` role; otherwise **403**
        (INV-5). Tenant-scoped (INV-1).
      tags: [admin]
      responses:
        "200":
          description: The tenant's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateTenantSettings
      summary: Set or clear the tenant's chat tool-turn budget (admin only).
      description: >
        Set the per-tenant chat tool-turn budget override, or clear it (`null`) to
        fall back to the system default (issue #148). The first `/admin` **write**
        — a reversible, tenant-scoped **T1** action (spec 0004 §2.5): `admin`-only
        (**403** otherwise, INV-5), audited (INV-6). An out-of-range value (outside
        1–50) or a missing field is **422** (INV-8). Returns the resulting
        effective settings.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettingsUpdate" }
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Sources (connector framework + Web URL source) : ADR-0009 / #108 -------
  /sources:
    get:
      operationId: listSources
      summary: The caller's connected sources (connector grid).
      description: >
        Lists the sources the caller has connected, tenant- and owner-scoped
        (ADR-0009 §5, spec 0004 INV-1/INV-2): a caller only ever sees their own
        sources within their tenant. Each item carries the connector `type`, its
        `config`, sync `status` and `indexed_count` for the health grid, plus
        `owner_id` so the UI can show ownership.
      tags: [sources]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of sources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSource
      summary: Connect a source (first connector — a Web URL).
      description: >
        Adds a source and enqueues its first sync (ADR-0009 §5). For the `web`
        connector the body is `{type: web, url}`: the server validates the URL and
        runs the mandatory SSRF check (allow only http/https; reject loopback,
        private/RFC-1918, link-local, CGNAT, and cloud-metadata ranges, on every
        redirect hop; ADR-0009 §3). An invalid OR SSRF-blocked URL is rejected with
        **422** (INV-8) — a blocked URL is a validation failure, not a 403. The
        created source is returned with status `pending`; the sync runs async as a
        Celery task (never in the request path). A write at read-before-write tier
        T1 (owner-gated; spec 0004 §2.5) — every add emits an audit event.
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCreate" }
      responses:
        "201":
          description: Connected; the first sync is enqueued (status pending).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >
            Malformed body, an unsupported `type`, or an invalid / SSRF-blocked
            URL (INV-8, ADR-0009 §3). `code` distinguishes the cases (e.g.
            `url_blocked` for an SSRF rejection).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /sources/{sourceId}:
    parameters:
      - { $ref: "#/components/parameters/SourceId" }
    delete:
      operationId: deleteSource
      summary: Remove a source (cascades its ingested documents).
      description: >
        Deletes the source and cascades the documents it ingested — their chunks
        and embeddings are removed too (ADR-0009 §5). Owner-gated: a caller who is
        not the owner receives **404** (existence non-disclosure within the tenant,
        INV-1/INV-2); a source in another tenant is likewise **404**. Emits an
        audit event.
      tags: [sources]
      responses:
        "204": { description: Deleted (source + its documents). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sources/{sourceId}/sync:
    parameters:
      - { $ref: "#/components/parameters/SourceId" }
    post:
      operationId: syncSource
      summary: Re-sync a source (re-fetch and re-index).
      description: >
        Re-fetches the source and re-indexes its content (ADR-0009 §2/§5). The
        sync runs async as a Celery task; the response returns the source with
        status `syncing` (202 — accepted, sync enqueued; 200 if the source was
        already syncing and this is a no-op). Owner-gated: a non-owner or
        cross-tenant source is **404** (INV-1/INV-2). Emits an audit event.
      tags: [sources]
      responses:
        "200":
          description: Already syncing — no new sync enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "202":
          description: Accepted; a re-sync was enqueued (status syncing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- User preferences (spec 0005 §3; epic #144) ----------------------------
  /preferences:
    get:
      operationId: getPreferences
      summary: The caller's account preferences.
      description: >
        Per-user, tenant-scoped settings (spec 0005). A fresh user has
        `default_model_id: null` (meaning "use the server default"). Always the
        CALLER's row — there is no id in the path and no way to read another user's
        preferences (INV-2).
      tags: [preferences]
      responses:
        "200":
          description: The caller's preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updatePreferences
      summary: Update the caller's account preferences.
      description: >
        Sets the caller's preferences. `default_model_id` must be an id from
        `/models` (else 422 `unknown_model`); send `null` to clear the override and
        fall back to the server default. Stored as an override, validated
        fail-closed at chat time (a model later removed from the registry falls back
        to the server default rather than erroring a chat — spec 0005 §2).
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesUpdate" }
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # --- Saved searches (spec 0005 §3; epic #144) ------------------------------
  /saved-searches:
    get:
      operationId: listSavedSearches
      summary: List the caller's saved searches (newest first).
      tags: [saved-searches]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of saved searches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearchList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createSavedSearch
      summary: Save a search (query + optional filters) under a name.
      description: >
        Captures exactly what `/search` accepts — `query` plus the optional
        `collection_id` / `source` / `type` filters — so applying a saved search is
        re-running `/search` with those params (spec 0005 §2). Per-user and
        tenant-scoped.
      tags: [saved-searches]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedSearchCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /saved-searches/{savedSearchId}:
    parameters:
      - { $ref: "#/components/parameters/SavedSearchId" }
    get:
      operationId: getSavedSearch
      summary: Get one saved search.
      tags: [saved-searches]
      responses:
        "200":
          description: The saved search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSavedSearch
      summary: Rename a saved search or change its query/filters.
      tags: [saved-searches]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedSearchUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedSearch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteSavedSearch
      summary: Delete a saved search.
      tags: [saved-searches]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Search typeahead + recent history (spec 0005 §3; epic #144) -----------
  /search/suggest:
    get:
      operationId: suggestSearch
      summary: Typeahead suggestions as the user types (permission-trimmed).
      description: >
        Returns up to `limit` suggestions for a partial query, ranked by relevance
        and mixing kinds (spec 0005 §3): `completion` (from the caller's own recent
        and saved searches), `document` (matching document titles the caller may
        open), and `saved_search` (a matching saved search). Document matches run
        through the SAME `retrieval/` permission chokepoint as `/search` (CC-1): a
        title the caller cannot open is never suggested (INV-2), within their tenant
        (INV-1). Empty/whitespace `q` → 422 (INV-8). This is a retrieval surface, so
        like `/search` it emits a retrieval audit event (INV-6).
      tags: [search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, pattern: "\\S" }
          description: >
            The partial query typed so far. Must contain a non-whitespace character
            (the `\S` pattern makes an all-whitespace `q` a 422 in the contract,
            matching spec 0005 AC-G3 — no FE/BE divergence); the server trims it
            before use.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
          description: Max suggestions to return.
      responses:
        "200":
          description: Ranked, permission-trimmed suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /search/recent:
    get:
      operationId: listRecentSearches
      summary: The caller's recent search queries (newest first).
      description: >
        Recent queries the caller actually ran via `/search`, de-duplicated by
        normalized query and capped server-side (spec 0005 §2). Per-user — one
        user's recents never appear for another (INV-2).
      tags: [search]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: Max recent queries to return.
      responses:
        "200":
          description: Recent queries, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentSearchList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: clearRecentSearches
      summary: Clear the caller's recent search history.
      description: Idempotent — clears all of the caller's recent queries (spec 0005 AC-R2).
      tags: [search]
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque pagination cursor from a previous response's next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Max items to return.
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SavedSearchId:
      name: savedSearchId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, example: lumen-copilot-backend }
        version: { type: string, example: 0.0.1 }

    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/DependencyStatus" }

    DependencyStatus:
      type: object
      additionalProperties: false
      required: [name, ok]
      properties:
        name:
          type: string
          description: Dependency identifier (e.g. postgres, redis, minio).
        ok: { type: boolean }
        detail:
          type: string
          description: Optional human-readable detail when not ok.

    # --- Auth ---------------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: Short-lived JWT bearer token. }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, description: Access-token lifetime in seconds. }

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, tenant_id, roles, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        tenant_id: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string, enum: [member, admin, security] }
        created_at: { type: string, format: date-time }

    # --- Collections --------------------------------------------------------
    CollectionCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    CollectionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    Collection:
      type: object
      additionalProperties: false
      required: [id, name, owner_id, document_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner_id: { type: string, format: uuid }
        document_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CollectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # --- Documents ----------------------------------------------------------
    DocumentStatus:
      type: string
      description: Ingestion lifecycle.
      enum: [pending, processing, ready, failed]

    Document:
      type: object
      additionalProperties: false
      required:
        [id, filename, mime_type, size_bytes, collection_id, owner_id, status, chunk_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        collection_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        error:
          type: string
          description: Failure reason when status is failed.
        chunk_count:
          type: integer
          minimum: 0
          description: Number of indexed chunks (0 until ingestion completes).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        next_cursor:
          type: [string, "null"]

    # --- Chat ---------------------------------------------------------------
    ChatSessionCreate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        model:
          type: string
          description: A model id from GET /models; omitted = server default.

    ChatSessionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 200 }
        model: { type: string }

    ChatSession:
      type: object
      additionalProperties: false
      required: [id, title, model, owner_id, message_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        model: { type: string, description: The session's default model id. }
        owner_id: { type: string, format: uuid }
        message_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChatSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatSession" }
        next_cursor:
          type: [string, "null"]

    MessageRole:
      type: string
      enum: [user, assistant, system]

    Citation:
      type: object
      additionalProperties: false
      description: >
        A clickable, passage-level reference (spec 0004 INV-3). Resolves to a
        document the caller is permitted to see and a character span within it.
      required: [id, document_id, document_name, chunk_id, snippet, char_start, char_end]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_name: { type: string }
        chunk_id: { type: string, format: uuid }
        snippet: { type: string, description: The cited passage text. }
        char_start: { type: integer, minimum: 0 }
        char_end: { type: integer, minimum: 0 }
        score:
          type: number
          description: Optional retrieval/rerank score.

    Message:
      type: object
      additionalProperties: false
      required: [id, session_id, role, content, citations, created_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/MessageRole" }
        content: { type: string }
        model:
          type: string
          description: Model that produced an assistant message (null for user).
        citations:
          type: array
          description: Passage-level citations (assistant messages only).
          items: { $ref: "#/components/schemas/Citation" }
        created_at: { type: string, format: date-time }

    MessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_cursor:
          type: [string, "null"]

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        model:
          type: string
          description: Override the session model for this turn (a GET /models id).
        collection_ids:
          type: array
          description: Restrict retrieval to these collections; omitted = all permitted docs.
          items: { type: string, format: uuid }

    SendMessageResponse:
      type: object
      additionalProperties: false
      required: [message, stream_id]
      properties:
        message:
          allOf: [{ $ref: "#/components/schemas/Message" }]
          description: The persisted user message.
        stream_id:
          type: string
          description: Subscribe to this WebSocket stream id for the assistant answer.

    # --- Models -------------------------------------------------------------
    ModelTier:
      type: string
      description: Picker grouping.
      enum: [frontier, fast, oss]

    ChatModelInfo:
      type: object
      additionalProperties: false
      required: [id, label, provider, tier, is_default]
      properties:
        id: { type: string, description: Model id passed to chat (e.g. anthropic/claude-opus-4.8). }
        label: { type: string, description: Display name for the picker. }
        provider: { type: string, description: e.g. anthropic, openai, google, deepseek, qwen. }
        tier: { $ref: "#/components/schemas/ModelTier" }
        is_default: { type: boolean }
        description: { type: string }

    ModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatModelInfo" }

    # --- Search (M2, #80) ---------------------------------------------------
    ResultSource:
      type: string
      description: >
        Where a result originated. `upload` = a user-uploaded document; `chat` =
        a prior chat message; `connector` = an external connected source (the
        connector framework is post-MVP, spec 0004 §2.2 — the value is reserved).
      enum: [upload, chat, connector]

    PermissionState:
      type: string
      description: >
        Per-result permission outcome. Permission-trimmed results are normally
        `allowed`; `restricted` is for results surfaced as metadata-only (the
        caller may see that it exists but not its full content). Passages the
        caller may not see at all are never returned — they are counted in
        `hidden_count` instead (spec 0004 INV-2).
      enum: [allowed, restricted]

    MatchSpan:
      type: object
      additionalProperties: false
      description: A character span within `snippet` that matched the query (for highlighting).
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }

    SearchResult:
      type: object
      additionalProperties: false
      description: >
        One permission-trimmed ranked result. Always within the caller's tenant
        and effective allow-set (spec 0004 INV-1/INV-2).
      required:
        [id, title, snippet, match_spans, why_matched, source, type, permission, last_indexed]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        snippet: { type: string, description: Excerpt of the matched passage. }
        match_spans:
          type: array
          description: Character spans within `snippet` that matched the query.
          items: { $ref: "#/components/schemas/MatchSpan" }
        why_matched:
          type: string
          description: Human-readable explanation of why this result ranked (e.g. "semantic + title").
        source: { $ref: "#/components/schemas/ResultSource" }
        type:
          type: string
          description: Content type of the result (e.g. document, message).
        owner:
          type: [string, "null"]
          format: uuid
          description: Owning principal id, when known (null for system/connector content).
        last_indexed:
          type: string
          format: date-time
          description: Freshness — when this result was last indexed.
        permission: { $ref: "#/components/schemas/PermissionState" }
        document_id:
          type: string
          format: uuid
          description: Source document id when the result resolves to a document (for click-through).
        score:
          type: number
          description: Optional retrieval/rerank score.

    SearchCitation:
      type: object
      additionalProperties: false
      description: >
        A citation backing the direct answer. References a passage that is present
        in this response's `results` (by `result_id`) so the answer can never cite
        a passage the caller could not retrieve (spec 0004 INV-3).
      required: [result_id]
      properties:
        result_id:
          type: string
          format: uuid
          description: Id of the SearchResult this citation refers to.
        snippet:
          type: string
          description: The specific cited passage text (a substring of the result snippet).
        char_start: { type: integer, minimum: 0 }
        char_end: { type: integer, minimum: 0 }

    DirectAnswer:
      type: object
      additionalProperties: false
      description: >
        An optional synthesized answer. Present only when the permitted results
        support it; every claim is backed by `citations` (spec 0004 INV-3).
      required: [text, citations]
      properties:
        text: { type: string, description: The synthesized answer (rendered as sanitized markdown). }
        citations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SearchCitation" }

    SearchResponse:
      type: object
      additionalProperties: false
      required: [query, results, hidden_count]
      properties:
        query: { type: string, description: The query that produced this page (echoed back). }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        direct_answer:
          allOf: [{ $ref: "#/components/schemas/DirectAnswer" }]
          description: Optional cited answer; omitted when nothing permitted answers the query.
        hidden_count:
          type: integer
          minimum: 0
          description: >
            How many otherwise-matching results were withheld because they are
            outside the caller's permissions (spec 0004 INV-2). Lets the UI
            disclose the trim without leaking the hidden content.
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # --- Audit (M2, #80) ----------------------------------------------------
    AuditEventType:
      type: string
      description: Audit event taxonomy (spec 0004 §2.4).
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - collection.created
        - document.uploaded
        - document.viewed
        - document.downloaded
        - document.deleted
        - retrieval.query
        - answer.generated
        - permission.denied
        - action.requested
        - action.approved
        - action.executed

    AuditDecision:
      type: string
      description: The outcome recorded for the event (spec 0004 §2.4 `outcome`).
      enum: [allowed, denied, error]

    AuditCandidate:
      type: object
      additionalProperties: false
      description: >
        One retrieval candidate considered for a decision, and whether it was
        allowed into the result set or excluded — with the reason. This is the
        provenance that makes a permission/answer decision reviewable (spec 0004
        §2.4: retrieval.query / answer.generated carry retrieved doc ids).
      required: [resource_id, disposition, reason]
      properties:
        resource_id:
          type: string
          description: Id of the candidate passage/document/chunk considered.
        disposition:
          type: string
          enum: [allow, exclude]
          description: Whether the candidate was allowed into the result set or excluded.
        reason:
          type: string
          description: Why it was allowed or excluded (e.g. "in allow-set", "owner mismatch").
        score:
          type: number
          description: Optional retrieval/rerank score for the candidate.

    AuditProvenance:
      type: object
      additionalProperties: false
      description: Why the decision was made — candidate dispositions plus the raw recorded payload.
      required: [candidates]
      properties:
        candidates:
          type: array
          description: The candidates considered, each allowed or excluded with a reason.
          items: { $ref: "#/components/schemas/AuditCandidate" }
        raw:
          type: object
          additionalProperties: true
          description: The raw recorded metadata payload for the event (model id, query hash, etc.).

    AuditEvent:
      type: object
      additionalProperties: false
      description: One append-only audit event (spec 0004 §2.4).
      required: [id, ts, actor, tenant_id, event_type, decision, provenance]
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time, description: Event time (UTC ISO-8601). }
        actor:
          type: string
          description: The acting principal — a user id, or `system` / `anonymous`.
        tenant_id: { type: string, format: uuid }
        event_type: { $ref: "#/components/schemas/AuditEventType" }
        resource_id:
          type: [string, "null"]
          description: The resource the event touched, when applicable.
        decision: { $ref: "#/components/schemas/AuditDecision" }
        provenance: { $ref: "#/components/schemas/AuditProvenance" }

    AuditEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor:
          type: [string, "null"]

    # --- Admin (M2, #80) ----------------------------------------------------
    Member:
      type: object
      additionalProperties: false
      description: A tenant member and their role(s) for the admin roster.
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: array
          description: The member's tenant roles (MVP RBAC, spec 0004 §2.3).
          items: { type: string, enum: [member, admin, security] }

    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_cursor:
          type: [string, "null"]

    ModelGovernanceEntry:
      type: object
      additionalProperties: false
      description: One allowed model and the governance tier it maps to.
      required: [model_id, tier]
      properties:
        model_id: { type: string, description: A model id (e.g. anthropic/claude-opus-4.8). }
        tier:
          type: string
          description: The governance tier this model is approved at.
        label: { type: string, description: Display name for the admin console. }

    ModelGovernance:
      type: object
      additionalProperties: false
      description: Read-only model-governance view for the admin console (#80).
      required: [allowed_models, tiers]
      properties:
        allowed_models:
          type: array
          description: The models permitted for this tenant, with their governance tier.
          items: { $ref: "#/components/schemas/ModelGovernanceEntry" }
        tiers:
          type: array
          description: The governance tiers referenced by allowed_models.
          items:
            type: object
            additionalProperties: false
            required: [id, description]
            properties:
              id: { type: string }
              description: { type: string }

    RiskTier:
      type: object
      additionalProperties: false
      description: One read-before-write risk tier (spec 0004 §2.5).
      required: [tier, description, approval]
      properties:
        tier:
          type: string
          enum: [T0, T1, T2, T3]
        description: { type: string, description: What this tier means / example actions. }
        approval:
          type: string
          description: The approval this tier requires (e.g. "none", "owner", "human approval + risk tier").

    RiskTierList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RiskTier" }

    TenantSettings:
      type: object
      additionalProperties: false
      description: >
        The admin-configurable per-tenant settings (issue #148). `max_tool_turns`
        is the EFFECTIVE chat tool-turn budget — the per-tenant override if set,
        else the system default — and `max_tool_turns_is_default` says which.
      required: [max_tool_turns, max_tool_turns_is_default]
      properties:
        max_tool_turns:
          type: integer
          minimum: 1
          maximum: 50
          description: >
            How many tool-calling turns the grounded answer runtime may take
            before it forces a final synthesis. A "turn" is one streamed
            completion that may request tools.
        max_tool_turns_is_default:
          type: boolean
          description: True when no per-tenant override is set and the system default is in force.

    TenantSettingsUpdate:
      type: object
      additionalProperties: false
      description: >
        Set or clear the per-tenant chat tool-turn budget override (issue #148).
        `max_tool_turns` is required so the intent is explicit.
      required: [max_tool_turns]
      properties:
        max_tool_turns:
          type: [integer, "null"]
          minimum: 1
          maximum: 50
          description: >
            An integer in 1–50 sets the per-tenant override; `null` clears it so
            the system default applies again (the system default is configured
            server-side, `CHAT_MAX_TOOL_TURNS`).

    # --- Sources (connector framework + Web URL source, ADR-0009 / #108) ----
    SourceType:
      type: string
      description: >
        The connector kind. `web` is the first connector (ADR-0009 §2): paste a
        public URL, we ingest it — zero source-side setup. Future connectors
        (Drive, Slack, Confluence…) are additive via the auto-discovered registry
        and add their own values here, each behind its own ADR.
      enum: [web]

    WebSourceMode:
      type: string
      description: >
        How a `web` source's URL is interpreted (ADR-0009 §2). `page` = one URL →
        one document; `feed` = an RSS/Atom feed → many documents (bounded);
        `sitemap` = a sitemap.xml → many documents (bounded). The server detects
        the mode from the fetched content.
      enum: [page, feed, sitemap]

    SourceStatus:
      type: string
      description: >
        Sync lifecycle for the connector health grid (ADR-0009 §4). `pending` =
        added, first sync not yet run; `syncing` = a sync is in flight; `ready` =
        last sync succeeded and content is indexed; `error` = the last sync failed
        (see `last_error`).
      enum: [pending, syncing, ready, error]

    SourceConfig:
      type: object
      additionalProperties: false
      description: >
        Connector configuration (ADR-0009 §4 `config` jsonb). For the `web`
        connector this is the fetched `url` and the detected `mode`.
      required: [url, mode]
      properties:
        url:
          type: string
          format: uri
          description: The public URL this source ingests (http/https only; SSRF-checked).
        mode: { $ref: "#/components/schemas/WebSourceMode" }

    Source:
      type: object
      additionalProperties: false
      description: >
        One connected source, tenant- and owner-scoped (ADR-0009 §4/§5, spec 0004
        INV-1/INV-2). Ingested content links back to this source and is retrievable
        only by the owner within their tenant.
      required: [id, type, config, status, indexed_count, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/SourceType" }
        config: { $ref: "#/components/schemas/SourceConfig" }
        status: { $ref: "#/components/schemas/SourceStatus" }
        indexed_count:
          type: integer
          minimum: 0
          description: Number of documents this source has ingested (0 until the first sync completes).
        last_synced_at:
          type: [string, "null"]
          format: date-time
          description: When the last successful sync finished (null before the first sync).
        last_error:
          type: string
          description: Failure reason when status is error.
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Source" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    SourceCreate:
      type: object
      additionalProperties: false
      description: >
        Connect a source. For the `web` connector: `{type: web, url}`. The server
        validates + SSRF-checks the URL (ADR-0009 §3); an invalid or blocked URL is
        rejected with 422 (INV-8).
      required: [type, url]
      properties:
        type: { $ref: "#/components/schemas/SourceType" }
        url:
          type: string
          format: uri
          description: The public URL to ingest (http/https only).

    # Single problem model for ALL errors (RFC-9457 application/problem+json).
    # Every endpoint's error responses reference this; both tiers depend on it.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
          description: A URI identifying the problem type.
        title: { type: string, description: Short, human-readable summary. }
        status: { type: integer, description: HTTP status code. }
        detail: { type: string, description: Human-readable explanation for this occurrence. }
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Stable, machine-readable error code for clients to branch on.
        errors:
          type: array
          description: Field-level validation errors, when applicable.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    # --- User preferences (spec 0005) ---------------------------------------
    UserPreferences:
      type: object
      additionalProperties: false
      required: [default_model_id, updated_at]
      properties:
        default_model_id:
          type: [string, "null"]
          description: >
            The caller's preferred default chat model — an id from `/models`, or
            null to use the server default. New chat sessions with no explicit model
            start from this.
        updated_at:
          type: [string, "null"]
          format: date-time
          description: >
            When the caller last changed their preferences, or **null** if they
            never have (the implicit server-default state). `GET /preferences`
            returns `{ default_model_id: null, updated_at: null }` for a fresh user
            and performs no write — the row is created on the first `PATCH` (so a
            read never mutates state; "read before write", spec 0005 §2/§4).

    UserPreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        default_model_id:
          type: [string, "null"]
          description: >
            A `/models` id to set as the default, or null to clear the override
            (fall back to the server default). An unknown id → 422 `unknown_model`.

    # --- Saved searches (spec 0005) -----------------------------------------
    SavedSearch:
      type: object
      additionalProperties: false
      required: [id, name, query, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: The saved `/search` query (the `q` parameter).
        collection_id:
          type: [string, "null"]
          format: uuid
          description: Optional collection filter (the `/search` collection_id).
        source:
          oneOf:
            - { $ref: "#/components/schemas/ResultSource" }
            - { type: "null" }
          description: Optional source-kind filter (the `/search` source).
        type:
          type: [string, "null"]
          description: Optional content-type filter (the `/search` type).
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SavedSearchCreate:
      type: object
      additionalProperties: false
      required: [name, query]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        query: { type: string, minLength: 1, maxLength: 1000 }
        collection_id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/ResultSource" }
        type: { type: string, maxLength: 100 }

    SavedSearchUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        query: { type: string, minLength: 1, maxLength: 1000 }
        collection_id: { type: [string, "null"], format: uuid }
        source:
          oneOf:
            - { $ref: "#/components/schemas/ResultSource" }
            - { type: "null" }
        type: { type: [string, "null"], maxLength: 100 }

    SavedSearchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedSearch" }
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when exhausted.

    # --- Search typeahead suggestions (spec 0005) ---------------------------
    SuggestionKind:
      type: string
      description: >
        What a suggestion represents. `completion` = a query the caller can run
        (from their recents/saved); `document` = a permitted document whose title
        matches; `saved_search` = one of the caller's saved searches.
      enum: [completion, document, saved_search]

    Suggestion:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: { $ref: "#/components/schemas/SuggestionKind" }
        text:
          type: string
          description: The display label / the query to run when chosen.
        document_id:
          type: [string, "null"]
          format: uuid
          description: The matched document, when kind is `document` (permitted, INV-2).
        source:
          oneOf:
            - { $ref: "#/components/schemas/ResultSource" }
            - { type: "null" }
          description: The document's source kind, when kind is `document`.
        saved_search_id:
          type: [string, "null"]
          format: uuid
          description: The matched saved search, when kind is `saved_search`.

    SuggestResponse:
      type: object
      additionalProperties: false
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Suggestion" }

    # --- Recent search history (spec 0005) ----------------------------------
    RecentSearch:
      type: object
      additionalProperties: false
      required: [query, last_used_at]
      properties:
        query: { type: string }
        last_used_at: { type: string, format: date-time }

    RecentSearchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecentSearch" }

  responses:
    Problem:
      description: Error (problem+json).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, invalid, or expired credentials (INV-4).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: >
        Authenticated but not authorized for this action — the caller lacks the
        required role (e.g. a non-admin on /admin/*, a non-security/admin on
        /audit). Wrong-role → 403 (INV-5).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found — or in another tenant / not permitted (INV-1/INV-2).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Malformed or invalid request body (INV-8).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Upload exceeds MAX_UPLOAD_BYTES.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Content-type not in the upload allowlist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  securitySchemes:
    # Identity/tenant is resolved in backend/app/auth (CC-3, spec 0004 §2.3):
    # app-managed email+password → short-lived access JWT. Bearer-token on every
    # endpoint except health + login + refresh.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: health
    description: Liveness & readiness probes.
  - name: auth
    description: App-managed identity — login, refresh, logout, whoami.
  - name: collections
    description: Folders that group uploaded documents.
  - name: documents
    description: Upload, list, view, and delete documents (multi-format).
  - name: chat
    description: Chat sessions, history, and message send (answer streams over WS).
  - name: models
    description: The selectable chat-model registry (picker).
  - name: preferences
    description: The caller's account preferences (e.g. default chat model).
  - name: search
    description: Permission-trimmed, cited grounded search across the caller's sources.
  - name: saved-searches
    description: The caller's saved searches — save a query + filters and re-run it.
  - name: audit
    description: The append-only audit trail with provenance (admin / security only).
  - name: admin
    description: Read-only tenant governance — members, model governance, risk tiers (admin only).
  - name: sources
    description: Connected sources — the connector grid (add / sync / remove a Web URL source).
