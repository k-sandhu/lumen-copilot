[workspace]
members = ["crates/lumen-docintel", "crates/lumen-docintel-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pyo3 = { version = "=0.29.3", features = ["abi3-py312"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
proptest = "=1.11.0"

encoding_rs = "=0.8.42"
chardetng = "=1.0.0"
infer = { version = "=0.22.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
cfb = "=0.15.0"

rayon = "=1.12.0"

flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "=0.10.9"

[profile.release]
panic = "unwind"
