[workspace]
members = ["crates/lumen-docintel", "crates/lumen-docintel-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pyo3 = { version = "=0.29.3", features = ["abi3-py312"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
proptest = "=1.11.0"

[profile.release]
panic = "unwind"
