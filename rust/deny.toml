[advisories]
yanked = "deny"
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Reviewed 2026-10-08: tokenizers 0.23.2 uses paste 1.0.15 only for compile-time type/identifier macros; no document-input execution. Owner k-sandhu; expires 2026-11-07; scoped/expiry test in tests/dependency_review.rs; see docs/ingestion/dependency-review-667.md" }]

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
